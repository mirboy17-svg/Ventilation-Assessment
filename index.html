<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>밀폐공간 환기 위험성평가</title>
  
  <!-- 카카오톡 인앱 브라우저 감지 및 외부 브라우저(크롬/사파리) 강제 호출 스크립트 -->
  <script>
    var userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.indexOf("kakaotalk") > -1) {
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    }
  </script>

  <!-- PWA 아이콘 변수 설정 (이미지 파일명 변경 시 여기만 수정하세요) -->
  <script>
    // png 대신 벡터 파일인 jpeg로 변경 적용
    var iconFileName = "image_bf5001.jpeg"; 
    
    // 안정적인 Data URI 방식으로 Manifest 생성 (모바일 브라우저 차단 방지)
    var manifestData = {
      "name": "밀폐공간 환기계산",
      "short_name": "환기계산",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#F4F7FB",
      "theme_color": "#2563EB",
      "icons": [
        {
          "src": iconFileName,
          "sizes": "192x192",
          "type": "image/svg+xml"
        },
        {
          "src": iconFileName,
          "sizes": "512x512",
          "type": "image/svg+xml"
        }
      ]
    };
    
    // JSON 데이터를 URL 형태로 변환하여 직접 삽입
    var manifestStr = JSON.stringify(manifestData);
    var manifestDataUrl = "data:application/json;charset=utf-8," + encodeURIComponent(manifestStr);
    
    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestDataUrl;
    document.head.appendChild(manifestLink);

    var appleTouchIcon = document.createElement('link');
    appleTouchIcon.rel = 'apple-touch-icon';
    appleTouchIcon.href = iconFileName;
    document.head.appendChild(appleTouchIcon);
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM (UMD 빌드) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for parsing JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- html2canvas (결과 이미지 캡처용 라이브러리) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 강력한 보안 및 안티 디버깅 스크립트 -->
  <script>
    // 1. 마우스 우클릭 방지
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    // 2. 키보드 단축키 방지 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U 등)
    document.addEventListener('keydown', function(e) {
      if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I/J
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) // Ctrl+U(소스보기), Ctrl+S(저장)
      ) {
        e.preventDefault();
        e.returnValue = false;
      }
    });

    // 3. 안티 디버깅 (Sources 탭 강제 마비 및 코드 은닉)
    // 개발자 도구가 열리면 무한 루프에 빠지게 하여 Sources 탭 분석을 원천적으로 방해합니다.
    setInterval(function() {
      var before = new Date().getTime();
      (function() { return false; }['constructor']('debugger')());
      var after = new Date().getTime();
      
      // 디버거가 멈춰서 시간이 지연된 경우 = 개발자 도구가 열려있음
      if (after - before > 100) {
        // 화면을 즉시 하얗게 지워버리거나 경고 메시지 출력
        document.body.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#f8fafc; color:#0f172a; font-size:1.2rem; font-weight:bold; font-family:sans-serif;">보안 정책에 의해 개발자 도구를 사용할 수 없습니다.</div>';
      }
    }, 50);

    // 4. 콘솔(Console) 기록 지우기
    setInterval(function() {
      console.clear();
      console.log("%c경고!", "color: red; font-size: 50px; font-weight: bold;");
      console.log("%c이곳은 개발자 전용 공간입니다. 보안 정책에 의해 모든 기능이 차단됩니다.", "color: #333; font-size: 16px;");
    }, 1000);
  </script>

  <style>
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-[#F4F7FB] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [step, setStep] = useState(1);
      const [fanCapacity, setFanCapacity] = useState('');
      const [shape, setShape] = useState('');
      
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showInstallInstructions, setShowInstallInstructions] = useState(false);

      const [width, setWidth] = useState('');
      const [length, setLength] = useState('');
      const [diameter, setDiameter] = useState('');
      const [height, setHeight] = useState('');

      const [comboRectWidth, setComboRectWidth] = useState('');
      const [comboRectLength, setComboRectLength] = useState('');
      const [comboRectHeight, setComboRectHeight] = useState('');
      const [comboCylDiameter, setComboCylDiameter] = useState('');
      const [comboCylHeight, setComboCylHeight] = useState('');

      const [q1, setQ1] = useState(null);
      const [q2, setQ2] = useState(null);
      const [q3, setQ3] = useState(null);
      const [q4, setQ4] = useState(null);

      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const resultRef = useRef(null);

      const getVolume = () => {
        if (shape === 'rect') {
          const w = parseFloat(width) || 0;
          const l = parseFloat(length) || 0;
          const h = parseFloat(height) || 0;
          return w * l * h;
        } else if (shape === 'cyl') {
          const d = parseFloat(diameter) || 0;
          const h = parseFloat(height) || 0;
          return (3.14 * Math.pow(d, 2) / 4) * h;
        } else if (shape === 'combo') {
          const rw = parseFloat(comboRectWidth) || 0;
          const rl = parseFloat(comboRectLength) || 0;
          const rh = parseFloat(comboRectHeight) || 0;
          const v1 = rw * rl * rh;
          
          const cd = parseFloat(comboCylDiameter) || 0;
          const ch = parseFloat(comboCylHeight) || 0;
          const v2 = (3.14 * Math.pow(cd, 2) / 4) * ch;
          
          return v1 + v2;
        }
        return 0;
      };

      const volume = getVolume();
      const fanHr = parseFloat(fanCapacity) || 0;
      const reqTotalFanCapacityHr = volume * 24; 
      
      const rawFanCount = fanHr > 0 ? reqTotalFanCapacityHr / (fanHr * 0.8) : 0;
      let displayFanCount = "0대";
      if (rawFanCount > 0) {
        if (rawFanCount <= 1) {
          displayFanCount = "1대 이하";
        } else {
          displayFanCount = rawFanCount.toFixed(1) + "대 이상";
        }
      }

      const actualFanCount = Math.ceil(rawFanCount > 0 ? rawFanCount : 0);
      const effectiveAirflowMin = (actualFanCount * fanHr * 0.8) / 60;
      const rawVentTime = effectiveAirflowMin > 0 ? (volume * 10) / effectiveAirflowMin : 0;
      const ventTime = Math.max(Math.ceil(rawVentTime), 30); 
      const isMinimumForced = Math.ceil(rawVentTime) < 30 && effectiveAirflowMin > 0;

      const saveAsImage = () => {
        if (!resultRef.current) return;
        
        if (!window.html2canvas) {
          alert('이미지 저장 기능을 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
          return;
        }

        window.html2canvas(resultRef.current, {
          scale: 1.5, 
          backgroundColor: '#F8FAFC', 
        }).then(canvas => {
          const imgData = canvas.toDataURL('image/jpeg', 0.7);
          const link = document.createElement('a');
          
          const date = new Date();
          const dateStr = `${date.getFullYear().toString().slice(-2)}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}_${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}`;
          
          link.download = `밀폐공간_환기계산결과_${dateStr}.jpg`;
          link.href = imgData;
          link.click();
        }).catch(err => {
          console.error('이미지 저장 오류:', err);
          alert('이미지 저장 중 오류가 발생했습니다.');
        });
      };

      useEffect(() => {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
        
        // 30분 쿨타임 체크
        const hideUntil = localStorage.getItem('hideInstallPromptUntil');
        const now = new Date().getTime();

        if (!isStandalone) {
          // 숨김 기한 기록이 없거나, 현재 시간이 숨김 기한(30분)을 지났을 경우 팝업 표시
          if (!hideUntil || now > parseInt(hideUntil, 10)) {
            setShowInstallBanner(true);
          }
        }

        // 안드로이드 기본 앱 설치 팝업 이벤트 가로채기
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        };
      }, []);

      const dismissInstall = () => {
        setShowInstallBanner(false);
        // '나중에' 버튼 클릭 시, 현재 시간 기준 30분(30 * 60 * 1000 ms) 이후의 시간을 로컬스토리지에 저장
        const hideUntil = new Date().getTime() + 30 * 60 * 1000;
        localStorage.setItem('hideInstallPromptUntil', hideUntil);
      };

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          // 안드로이드: 브라우저가 제공하는 시스템 기본 "앱 설치" 팝업 강제 실행
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setShowInstallBanner(false);
          }
          setDeferredPrompt(null);
        } else {
          // 아이폰(iOS)이거나 API를 지원하지 않는 브라우저: 수동 설치 안내 모달 표시
          setShowInstallBanner(false);
          setShowInstallInstructions(true);
        }
      };

      const nextStep = () => setStep((s) => s + 1);
      const prevStep = () => setStep((s) => s - 1);
      const reset = () => {
        setStep(1);
        setFanCapacity('');
        setShape('');
        setWidth('');
        setLength('');
        setHeight('');
        setDiameter('');
        setComboRectWidth('');
        setComboRectLength('');
        setComboRectHeight('');
        setComboCylDiameter('');
        setComboCylHeight('');
        setQ1(null);
        setQ2(null);
        setQ3(null);
        setQ4(null);
      };

      return (
        <div className="min-h-screen bg-[#F4F7FB] flex justify-center font-sans text-slate-800 selection:bg-blue-200 sm:p-4">
          <div className="w-full max-w-md bg-white sm:rounded-[2.5rem] sm:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)] min-h-[100dvh] sm:min-h-[850px] flex flex-col relative overflow-hidden sm:border border-slate-100/50">
            
            {/* Header with Back Button */}
            {step > 1 && step <= 7 && (
              <header className="px-6 py-5 flex items-center bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100/80">
                <button 
                  onClick={prevStep} 
                  className="p-2 -ml-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <div className="w-full bg-slate-100 h-1.5 rounded-full ml-4 overflow-hidden">
                  <div 
                    className="bg-blue-600 h-full rounded-full transition-all duration-500 ease-out"
                    style={{ width: `${((step - 1) / 6) * 100}%` }}
                  ></div>
                </div>
                <span className="ml-3 text-xs font-bold text-slate-400 whitespace-nowrap">{step - 1} / 6</span>
                
                {/* 상단 앱 설치(다운로드 화살표) 버튼 추가 */}
                <button 
                  onClick={handleInstallClick} 
                  className="ml-3 p-1.5 bg-blue-50 text-blue-600 rounded-full shadow-sm hover:bg-blue-100 active:scale-95 transition-all flex-shrink-0"
                  title="앱 다운로드 및 설치"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                </button>
              </header>
            )}

            { }
            {step === 1 && (
              <div className="flex flex-col flex-1 pb-6 pt-10 animate-in fade-in duration-700 ease-out h-full max-h-[100dvh] relative">
                
                {/* 첫 화면 우측 상단 앱 설치(화살표) 버튼 추가 */}
                <div className="absolute top-4 right-4 z-20">
                  <button 
                    onClick={handleInstallClick} 
                    className="flex items-center gap-1.5 py-2 px-3 bg-white/90 backdrop-blur border border-slate-200/80 rounded-full shadow-sm text-blue-600 hover:bg-blue-50 active:scale-95 transition-all"
                  >
                    <svg className="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span className="text-xs font-bold">앱 설치</span>
                  </button>
                </div>

                <div className="text-center w-full space-y-3 px-6 mb-6 shrink-0 mt-4">
                  <span className="inline-block py-1.5 px-4 rounded-full bg-blue-50 text-blue-600 text-xs font-bold tracking-wide mb-1">
                    안전보건공단 KOSHA GUIDE 기준
                  </span>
                  <h1 className="text-[2.2rem] font-extrabold text-slate-900 tracking-tight leading-tight">
                    밀폐공간 환기 <br/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">
                      위험성평가
                    </span>
                  </h1>
                  <p className="text-slate-500 text-sm mt-3 font-medium px-4">
                    작업 전 필수적인 위험성평가와 적정 환기량을 빠르고 정확하게 산출합니다.
                  </p>
                </div>

                <div className="w-full relative shrink-0">
                  <div className="w-full aspect-[4/3] relative overflow-hidden bg-white shadow-sm border-y border-slate-100">
                    <img 
                      src="image_bf5001.png" 
                      alt="밀폐공간 환기 예시" 
                      className="absolute inset-0 w-full h-full object-contain"
                    />
                  </div>
                </div>

                <div className="px-6 flex-1 flex flex-col justify-center my-auto w-full max-w-sm mx-auto min-h-[100px]">
                  <button 
                    onClick={nextStep} 
                    className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-[1.15rem] rounded-2xl shadow-xl hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    시작하기
                  </button>
                </div>

                <div className="w-full shrink-0 flex flex-col items-center justify-end opacity-90 px-6 pb-2 space-y-2.5">
                  <img src="image_bfaefe.png" alt="하단 로고" className="h-10 sm:h-12 object-contain" />
                  <p className="text-[10px] text-slate-400 font-medium tracking-tight">
                    &copy; Copyright 2026.08 aniag000@kiha21.or.kr. All rights reserved.
                  </p>
                </div>
              </div>
            )}

            { }
            {step === 2 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">위험성평가 체크리스트</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    안전한 환기계산을 위해 아래 항목들을 꼼꼼히 확인해 주세요.
                  </p>
                </div>

                <div className="space-y-4 overflow-y-auto pb-4 custom-scrollbar">
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">1.</span> 보유 배풍기 풍량(m³/hr)을 아시나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ1('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q1 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ1('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q1 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">2.</span> 보유 배풍기 정압(mmAq)을 아시나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ2('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q2 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ2('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q2 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">3.</span> 배풍기 덕트 길이는 15m 이하거나 제조사 권장 기준을 준수하셨나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ3('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q3 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ3('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q3 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">4.</span> 배풍기 덕트 끝부분이 밀폐공간 가장 하단에 위치하고 있나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ4('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q4 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>

                          <input type="number" value={comboCylHeight} onChange={e => setComboCylHeight(e.target.value)} placeholder="0.0" className="w-full min-w-0 flex-1 text-center text-xl py-3 outline-none font-black text-slate-800 bg-transparent placeholder:text-slate-200" />
                          <div className="w-12 bg-slate-50 flex items-center justify-center border-l border-slate-100 shrink-0">
                            <span className="font-bold text-slate-400 text-sm">m</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="mt-6 bg-slate-50 rounded-2xl p-5 border border-slate-100 flex justify-between items-center shadow-inner shrink-0">
                  <span className="text-slate-500 font-bold text-sm">총 체적(m³)</span>
                  <span className="text-3xl font-black text-blue-600">
                    {volume > 0 ? volume.toFixed(2) : '0.00'}
                  </span>
                </div>

                <div className="mt-6 pt-2 pb-4 shrink-0">
                   <button 
                    onClick={nextStep} 
                    disabled={volume <= 0} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    환기계산 결과 보기
                  </button>
                </div>
              </div>
            )}

            {}
            {step === 7 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in zoom-in-95 duration-500 ease-out overflow-y-auto custom-scrollbar">
                
                {/* 캡처 대상 영역 */}
                <div ref={resultRef} className="p-6 space-y-5 pt-8 bg-[#F8FAFC]">
                  <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                    <h3 className="text-sm font-black text-blue-600 tracking-tight mb-4 ml-1">밀폐공간 환기 정보 요약</h3>
                    <div className="space-y-2 text-sm">
                      <div className="flex justify-between items-center py-1.5 border-b border-slate-50">
                        <span className="text-slate-500 font-medium">배풍기 풍량</span>
                        <span className="font-bold text-slate-800">{Number(fanCapacity).toLocaleString()} <span className="text-xs text-slate-400">m³/hr</span></span>
                      </div>
                      <div className="flex justify-between items-center py-1.5 border-b border-slate-50">
                        <span className="text-slate-500 font-medium">공간 형태</span>
                        <span className="font-bold text-slate-800">{shape === 'rect' ? '직사각형' : shape === 'cyl' ? '원통형' : '결합형 (직사각+원형)'}</span>
                      </div>
                      <div className="flex justify-between items-center py-1.5">
                        <span className="text-slate-500 font-medium">밀폐공간 체적</span>
                        <span className="font-bold text-blue-600">{volume.toFixed(2)} <span className="text-xs text-slate-400">m³</span></span>
                      </div>
                    </div>
                  </div>

                  {/* 추가된 2페이지 위험성평가 리포트 결과 영역 */}
                  <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                    <h3 className="text-sm font-black text-blue-600 tracking-tight mb-3 ml-1">위험성평가 체크리스트 결과</h3>
                    <div className="space-y-2">
                      {[
                        { q: q1, title: '1. 배풍기 풍량 확인' },
                        { q: q2, title: '2. 배풍기 정압 확인' },
                        { q: q3, title: '3. 덕트 길이 기준 준수' },
                        { q: q4, title: '4. 덕트 하단 위치 적정' }
                      ].map((item, idx) => (
                        <div key={idx} className="flex justify-between items-center py-2 border-b border-slate-50 last:border-0">
                          <span className="text-slate-600 text-[13px] font-medium">{item.title}</span>
                          <span className={`text-[11px] font-extrabold px-2.5 py-1 rounded-md ${item.q === 'yes' ? 'bg-blue-50 text-blue-600' : 'bg-rose-50 text-rose-600'}`}>
                            {item.q === 'yes' ? '예 (확인)' : '아니오 (부적정)'}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {(fanHr < 5000 || q1 === 'no' || q2 === 'no' || q3 === 'no' || q4 === 'no') && (
                    <div className="bg-rose-50 border border-rose-100 rounded-2xl p-5 shadow-sm">
                      <h4 className="text-rose-800 font-bold text-sm mb-3 flex items-center gap-2">
                        <svg className="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        개선조치사항
                      </h4>
                      <ul className="text-xs text-rose-700/90 leading-relaxed font-semibold space-y-2 list-disc pl-4">
                        {fanHr < 5000 && (
                          <li>덕트 내 압력 손실로 인한 환기 불량을 방지하기 위해, 배풍기는 최소 풍량 5,000 m³/hr(또는 정압 40 mmAq) 이상의 사양을 사용하여 주시기 바랍니다.</li>
                        )}
                        {q1 === 'no' && (
                          <li><span className="font-extrabold">배풍기 풍량 미확인:</span> 장비 제원표를 반드시 확인하여 정확한 환기량 산출이 가능하도록 파악하세요.</li>
                        )}
                        {q2 === 'no' && (
                          <li><span className="font-extrabold">배풍기 정압 미확인:</span> 제원표를 확인하여 압력 손실에 대비하세요.</li>
                        )}
                        {q3 === 'no' && (
                          <li><span className="font-extrabold">덕트 길이 기준 초과:</span> 덕트 길이를 줄이거나 고정압 배풍기를 사용하여 환기 효율 저하를 예방하세요.</li>
                        )}
                        {q4 === 'no' && (
                          <li><span className="font-extrabold">덕트 하단 위치 불량:</span> 사각지대 방지를 위해 덕트를 밀폐공간 하단으로 재조정하세요.</li>
                        )}
                      </ul>
                    </div>
                  )}

                  <div className="space-y-4">
                    <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 shadow-lg shadow-blue-500/20 text-white relative overflow-hidden">
                      <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                      <h3 className="text-white font-extrabold text-[1.15rem] mb-1 tracking-tight">1. (작업 전) 환기시간</h3>
                      <p className="text-[10px] text-blue-200/80 mb-4 font-semibold tracking-wide">
                        ※ 밀폐공간 체적 10배 급기, 배풍기 효율 80% 기준
                      </p>
                      
                      <div className="flex items-baseline gap-1.5 mt-2">
                        <span className="text-5xl font-black tracking-tighter">{ventTime}</span>
                        <span className="text-lg font-bold text-blue-100">min (분)</span>
                        {isMinimumForced && <span className="ml-1 text-sm font-bold text-blue-200">이상</span>}
                      </div>
                      
                      <div className="mt-4 bg-black/15 p-3.5 rounded-xl border border-white/10 backdrop-blur-sm">
                        <p className="text-xs text-blue-50 font-medium leading-relaxed">
                          ⚠️ 주의: 이론적 환기시간은 {Math.ceil(rawVentTime)}분이나, 작업 전 반드시 <strong className="text-white">30분 이상 급기</strong>를 실시바랍니다.
                        </p>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 shadow-lg shadow-blue-500/20 text-white relative overflow-hidden">
                      <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                      <h3 className="text-white font-extrabold text-[1.15rem] mb-1 tracking-tight">2. (작업 중) 배풍기 환기 가동 대수</h3>
                      <p className="text-[10px] text-blue-200/80 mb-4 font-semibold tracking-wide">
                        ※ 시간당 20회 환기, 배풍기 효율 80% 적용 기준
                      </p>
                      <div className="flex items-baseline gap-2 mt-1">
                        <span className="text-5xl font-black tracking-tighter">{displayFanCount}</span>
                      </div>
                      
                      {rawFanCount > 1 && (
                        <div className="mt-4 bg-white/95 p-3.5 rounded-xl border border-rose-100 shadow-sm backdrop-blur-sm">
                          <p className="text-[13px] text-rose-600 font-extrabold leading-relaxed">
                            ⚠️ 현재 배풍기를 해당 대수만큼 추가하여 환기 실시 바랍니다.
                          </p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="px-6 pt-2 pb-6 space-y-3 shrink-0">
                  <button 
                    onClick={saveAsImage} 
                    className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm flex items-center justify-center gap-2"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    종합결과 이미지로 저장하기
                  </button>
                  <button 
                    onClick={reset} 
                    className="w-full bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800 font-bold py-4 rounded-2xl active:scale-[0.98] transition-all duration-300 text-sm"
                  >
                    새로운 계산하기
                  </button>
                </div>
              </div>
            )}

            { }
            {showInstallBanner && !showInstallInstructions && (
              <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-white rounded-3xl p-5 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.3)] border border-slate-100 z-50 animate-in slide-in-from-bottom-10 fade-in duration-500">
                <div className="flex items-start gap-4">
                  <div className="bg-blue-50 p-3 rounded-2xl text-blue-600 shrink-0 shadow-inner">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                  </div>
                  <div className="flex-1">
                    <h4 className="font-extrabold text-slate-900 text-sm mb-1">앱 다운로드 및 설치</h4>
                    <p className="text-xs text-slate-500 font-medium leading-relaxed">바탕화면에 아이콘을 추가하여 언제든 빠르게 실행하세요!</p>
                  </div>
                </div>
                <div className="flex gap-2 mt-4">
                  <button onClick={dismissInstall} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors active:scale-95">나중에</button>
                  <button onClick={handleInstallClick} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-md shadow-blue-500/20 hover:bg-blue-700 transition-colors active:scale-95">앱 설치하기</button>
                </div>
              </div>
            )}

            {showInstallInstructions && (
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-300">
                <div className="bg-white rounded-[2.5rem] p-6 w-full max-w-sm shadow-2xl relative animate-in zoom-in-95 duration-300">
                  <button onClick={() => setShowInstallInstructions(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:bg-slate-50 rounded-full transition-colors">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                  </button>
                  
                  <div className="text-center mb-6 mt-2">
                    <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner">
                      <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <h3 className="text-xl font-extrabold text-slate-900">홈 화면에 추가하는 방법</h3>
                    <p className="text-sm text-slate-500 mt-2 font-medium">기기에 따라 아래 방법을 따라해주세요.</p>
                  </div>

                  <div className="space-y-4">
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm mb-2 flex items-center gap-2">
                        <svg className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91 1.62.15 3.09.84 4.01 2.15-3.16 1.9-2.61 6.54.49 7.76-.75 1.83-1.68 3.5-2.71 4.75zM15.42 6.51c.71-.85 1.19-2.04 1.06-3.21-1.02.04-2.27.68-3 1.54-.65.77-1.23 2.01-1.07 3.15 1.13.09 2.3-.59 3.01-1.48z"/></svg>
                        iPhone (Safari)
                      </h4>
                      <ol className="text-[13px] text-slate-600 space-y-2 pl-5 list-decimal font-medium">
                        <li>화면 하단의 <span className="inline-flex p-1 bg-white border border-slate-200 rounded text-blue-500 shadow-sm align-middle mx-0.5"><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg></span> <b>공유</b> 버튼을 누릅니다.</li>
                        <li>메뉴를 올려서 <b>'홈 화면에 추가'</b>를 선택합니다.</li>
                        <li>우측 상단의 <b>'추가'</b>를 누릅니다.</li>
                      </ol>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm mb-2 flex items-center gap-2">
                        <svg className="w-4 h-4 text-green-500" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-1.002-.451-1.002-1.0021 0-.5512.451-1.0022 1.002-1.0022.5512 0 1.0022.451 1.0022 1.0022 0 .5511-.451 1.0021-1.0022 1.0021m-11.046 0c-.5511 0-1.002-.451-1.002-1.0021 0-.5512.451-1.0022 1.002-1.0022.5511 0 1.0021.451 1.0021 1.0022 0 .5511-.451 1.0021-1.0021 1.0021m11.4045-6.023l1.844-3.1932c.1052-.1821.043-.4141-.1391-.5191-.1822-.1052-.4141-.0431-.5192.139l-1.8562 3.2152C15.7061 8.2435 13.9312 7.7634 12 7.7634c-1.9311 0-3.7062.4801-5.2112 1.1983L4.9328 5.7461c-.1052-.1821-.3371-.2442-.5191-.139-.1822.1051-.2443.3371-.1392.5191l1.8441 3.1932C2.6517 11.2386.3262 14.8845.021 19.3402h23.958c-.3052-4.4557-2.6307-8.1016-6.0975-10.0218"/></svg>
                        Android (Chrome/Samsung)
                      </h4>
                      <ol className="text-[13px] text-slate-600 space-y-2 pl-5 list-decimal font-medium">
                        <li>우측 하단/상단의 <span className="inline-flex px-1.5 py-0.5 bg-white border border-slate-200 rounded font-bold shadow-sm align-middle mx-0.5">⋮</span> 혹은 <b>≡</b> 메뉴를 누릅니다.</li>
                        <li><b>'홈 화면에 추가'</b> 또는 <b>'앱 설치'</b>를 선택합니다.</li>
                        <li>화면의 안내에 따라 <b>'설치(추가)'</b>를 누릅니다.</li>
                      </ol>
                    </div>
                  </div>
                  
                  <button onClick={() => setShowInstallInstructions(false)} className="w-full mt-6 bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm">
                    확인했습니다
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
