<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>밀폐공간 환기계산 웹앱</title>
  
  <!-- 카카오톡 인앱 브라우저 외부 실행 스크립트 -->
  <script>
    var userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.indexOf("kakaotalk") > -1) {
      // 카카오톡 인앱 브라우저인 경우 외부 브라우저(크롬, 사파리 등)로 강제 자동 연결
      window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(window.location.href);
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD versions for browser) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for parsing JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PWA & iOS Meta Tags (앱 설치 지원) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="환기계산앱">
  <link rel="apple-touch-icon" href="image_bf5585.jpg">
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%EB%B0%80%ED%8F%90%EA%B3%B5%EA%B0%84%20%ED%99%98%EA%B8%B0%20%EC%9C%84%ED%97%98%EC%84%B1%ED%8F%89%EA%B0%80%22%2C%22short_name%22%3A%22%ED%99%98%EA%B8%B0%EA%B3%84%EC%82%B0%EC%95%B1%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22background_color%22%3A%22%23F4F7FB%22%2C%22theme_color%22%3A%22%232563EB%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22image_bf5585.jpg%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%2C%7B%22src%22%3A%22image_bf5585.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D'>
  
  <!-- 가상 Service Worker 등록 (안드로이드 시스템 설치 팝업 유도용) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const swCode = "self.addEventListener('fetch', function(e) {});";
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(function(err) {});
      });
    }
  </script>

  <style>
    /* Custom Scrollbar for better UX */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    /* Prevent text selection on buttons */
    button {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-[#F4F7FB] antialiased">
  
  <!-- Root element for React -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [step, setStep] = useState(1);
      const [fanCapacity, setFanCapacity] = useState('');
      const [shape, setShape] = useState('');
      
      // 홈 화면 추가(앱 설치) 프롬프트 상태
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showInstallInstructions, setShowInstallInstructions] = useState(false);

      const [width, setWidth] = useState('');
      const [length, setLength] = useState('');
      
      // Cylindrical dimensions
      const [diameter, setDiameter] = useState('');
      
      // Common dimension
      const [height, setHeight] = useState('');

      // Combo dimensions
      const [comboRectWidth, setComboRectWidth] = useState('');
      const [comboRectLength, setComboRectLength] = useState('');
      const [comboRectHeight, setComboRectHeight] = useState('');
      const [comboCylDiameter, setComboCylDiameter] = useState('');
      const [comboCylHeight, setComboCylHeight] = useState('');

      // 위험성평가 상태
      const [q1, setQ1] = useState(null);
      const [q2, setQ2] = useState(null);
      const [q3, setQ3] = useState(null);
      const [q4, setQ4] = useState(null);

      // 체적 계산 함수
      const getVolume = () => {
        if (shape === 'rect') {
          const w = parseFloat(width) || 0;
          const l = parseFloat(length) || 0;
          const h = parseFloat(height) || 0;
          return w * l * h;
        } else if (shape === 'cyl') {
          const d = parseFloat(diameter) || 0;
          const h = parseFloat(height) || 0;
          return (3.14 * Math.pow(d, 2) / 4) * h;
        } else if (shape === 'combo') {
          const rw = parseFloat(comboRectWidth) || 0;
          const rl = parseFloat(comboRectLength) || 0;
          const rh = parseFloat(comboRectHeight) || 0;
          const v1 = rw * rl * rh;
          
          const cd = parseFloat(comboCylDiameter) || 0;
          const ch = parseFloat(comboCylHeight) || 0;
          const v2 = (3.14 * Math.pow(cd, 2) / 4) * ch;
          
          return v1 + v2;
        }
        return 0;
      };

      const volume = getVolume();

      // 결과 계산
      const fanHr = parseFloat(fanCapacity) || 0;
      const reqTotalFanCapacityHr = volume * 24; 
      
      const rawFanCount = fanHr > 0 ? reqTotalFanCapacityHr / (fanHr * 0.8) : 0;
      let displayFanCount = "0대";
      if (rawFanCount > 0) {
        if (rawFanCount <= 1) {
          displayFanCount = "1대 이하";
        } else {
          displayFanCount = rawFanCount.toFixed(1) + "대 이상";
        }
      }

      const actualFanCount = Math.ceil(rawFanCount > 0 ? rawFanCount : 0);
      const effectiveAirflowMin = (actualFanCount * fanHr * 0.8) / 60;
      const rawVentTime = effectiveAirflowMin > 0 ? (volume * 10) / effectiveAirflowMin : 0;
      // 계산된 환기시간이 30분 미만이더라도 최소 30분으로 표시하기 위한 변수
      const ventTime = Math.max(Math.ceil(rawVentTime), 30); 
      const isMinimumForced = Math.ceil(rawVentTime) < 30 && effectiveAirflowMin > 0;

      // 앱 설치 프롬프트 (자동 팝업 및 네이티브 PWA 지원)
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault(); // 기본 브라우저 팝업 방지
          window.deferredPrompt = e; // 이벤트 저장 (이후에 설치 버튼 누르면 호출)
          if (!localStorage.getItem('dismissedInstallPrompt')) {
            setShowInstallBanner(true); // 배너 띄우기
          }
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
        const hasDismissed = localStorage.getItem('dismissedInstallPrompt');

        // 접속 즉시 딜레이 없이 설치(다운로드) 배너 띄움
        if (!isStandalone && !hasDismissed) {
          setShowInstallBanner(true);
        }

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        };
      }, []);

      const dismissInstall = () => {
        setShowInstallBanner(false);
        localStorage.setItem('dismissedInstallPrompt', 'true');
      };

      const handleInstallClick = () => {
        if (window.deferredPrompt) {
          // Android: 시스템 기본 설치 팝업 호출
          window.deferredPrompt.prompt();
          window.deferredPrompt.userChoice.then((choiceResult) => {
            window.deferredPrompt = null;
            setShowInstallBanner(false);
          });
        } else {
          // iOS 또는 데스크탑: 설치 방법 수동 안내 모달 띄우기
          setShowInstallBanner(false);
          setShowInstallInstructions(true);
        }
      };

      const nextStep = () => setStep((s) => s + 1);
      const prevStep = () => setStep((s) => s - 1);
      const reset = () => {
        setStep(1);
        setFanCapacity('');
        setShape('');
        setWidth('');
        setLength('');
        setHeight('');
        setDiameter('');
        setComboRectWidth('');
        setComboRectLength('');
        setComboRectHeight('');
        setComboCylDiameter('');
        setComboCylHeight('');
        setQ1(null);
        setQ2(null);
        setQ3(null);
        setQ4(null);
      };

      return (
        <div className="min-h-screen flex justify-center font-sans text-slate-800 selection:bg-blue-200 sm:p-4">
          <div className="w-full max-w-md bg-white sm:rounded-[2.5rem] sm:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)] min-h-screen sm:min-h-[850px] flex flex-col relative overflow-hidden sm:border border-slate-100/50">
            
            {/* Header with Back Button (마지막 페이지 포함) */}
            {step > 1 && step <= 7 && (
              <header className="px-6 py-5 flex items-center bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100/80">
                <button 
                  onClick={prevStep} 
                  className="p-2 -ml-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <div className="w-full bg-slate-100 h-1.5 rounded-full ml-4 overflow-hidden">
                  <div 
                    className="bg-blue-600 h-full rounded-full transition-all duration-500 ease-out"
                    style={{ width: `${((step - 1) / 6) * 100}%` }}
                  ></div>
                </div>
                <span className="ml-4 text-xs font-bold text-slate-400 whitespace-nowrap">{step - 1} / 6</span>
              </header>
            )}

            {step === 1 && (
              <div className="flex flex-col items-center flex-1 px-5 pb-6 pt-6 animate-in fade-in duration-700 ease-out overflow-y-auto custom-scrollbar h-full">
                {/* 1. 타이틀 섹션 (여백 축소) */}
                <div className="text-center mb-4 w-full space-y-2 shrink-0">
                  <span className="inline-block py-1.5 px-3 rounded-full bg-blue-50 text-blue-600 text-[10px] font-bold tracking-wide mb-1">
                    안전보건공단 KOSHA GUIDE 기준
                  </span>
                  <h1 className="text-[1.75rem] font-extrabold text-slate-900 tracking-tight leading-tight">
                    밀폐공간 환기 <br/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">
                      위험성평가
                    </span>
                  </h1>
                  <p className="text-slate-500 text-[13px] mt-2 font-medium px-2 leading-relaxed">
                    작업 전 필수적인 위험성평가와 적정 환기량을 빠르고 정확하게 산출합니다.
                  </p>
                </div>

                {/* 2. 메인 이미지 (화면 비율에 맞춰 동적 축소) */}
                <div className="w-full relative rounded-[1.25rem] overflow-hidden shadow-[0_10px_30px_-10px_rgba(37,99,235,0.15)] ring-1 ring-slate-100/50 shrink-0">
                  <img 
                    src="image_bf5585.jpg" 
                    alt="밀폐공간 환기 예시" 
                    className="w-full h-[26vh] min-h-[160px] object-cover hover:scale-105 transition-transform duration-700"
                    onError={(e) => { e.target.src = 'https://placehold.co/600x400/e2e8f0/64748b?text=Image+Not+Found'; }}
                  />
                </div>

                {/* 3. 시작하기 버튼 (이미지와 로고 중간에 자연스럽게 배치) */}
                <div className="w-full my-auto py-6 shrink-0">
                  <button 
                    onClick={nextStep} 
                    className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-3.5 rounded-2xl shadow-xl hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    시작하기
                  </button>
                </div>

                {/* 4. 하단 로고 (화면 맨 아래) */}
                <div className="w-full flex justify-center items-center opacity-90 hover:opacity-100 transition-opacity shrink-0 pb-2">
                  <img 
                    src="image_bfaefe.png" 
                    alt="고용노동부 창원고용노동지청 로고" 
                    className="h-8 sm:h-10 object-contain drop-shadow-sm" 
                    onError={(e) => { e.target.src = 'https://placehold.co/300x80/ffffff/1e293b?text=Logos+Here'; }}
                  />
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">위험성평가 체크리스트</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    안전한 환기계산을 위해 아래 항목들을 꼼꼼히 확인해 주세요.
                  </p>
                </div>

                <div className="space-y-4 overflow-y-auto pb-4 custom-scrollbar">
                  {/* Q1 */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">1.</span> 보유 배풍기 풍량(m³/hr)을 아시나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ1('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q1 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ1('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q1 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>

                  {/* Q2 */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">2.</span> 보유 배풍기 정압(mmAq)을 아시나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ2('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q2 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ2('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q2 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>

                  {/* Q3 */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">3.</span> 배풍기 덕트 길이는 15m 이하거나 제조사 권장 기준을 준수하셨나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ3('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q3 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ3('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q3 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>

                  {/* Q4 */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">4.</span> 배풍기 덕트 끝부분이 밀폐공간 가장 하단에 위치하고 있나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ4('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q4 === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                      <button onClick={() => setQ4('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q4 === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                    </div>
                  </div>
                </div>

                <div className="mt-auto pt-6 pb-2 bg-white">
                  <button 
                    onClick={nextStep} 
                    disabled={!q1 || !q2 || !q3 || !q4} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    평가 결과 확인
                  </button>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="p-6 flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">평가 리포트</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    안전한 작업을 위해 아래 조치사항을 반드시 준수해 주세요.
                  </p>
                </div>

                <div className="space-y-3 mb-6">
                  {[
                    { q: q1, title: '배풍기 풍량', pass: '풍량을 인지하고 있어 정확한 환기량 산출이 가능합니다.', fail: '장비 제원표를 반드시 확인하여 풍량을 파악하세요.' },
                    { q: q2, title: '배풍기 정압', pass: '정압을 인지하고 있어 압력 손실 예측이 가능합니다.', fail: '제원표를 확인하여 압력 손실에 대비하세요.' },
                    { q: q3, title: '덕트 길이', pass: '기준을 준수하여 환기 효율 저하를 예방합니다.', fail: '길이를 줄이거나 고정압 배풍기를 사용하세요.' },
                    { q: q4, title: '덕트 하단 위치', pass: '효과적인 환기(급기)가 이루어질 수 있는 적절한 위치입니다.', fail: '사각지대 방지를 위해 덕트를 밀폐공간 하단으로 재조정하세요.' }
                  ].map((item, idx) => (
                    <div key={idx} className={`p-4 rounded-2xl flex items-start gap-3 bg-white border border-slate-100 shadow-sm`}>
                      <div className={`mt-0.5 rounded-full p-1 ${item.q === 'yes' ? 'bg-blue-50 text-blue-600' : 'bg-rose-50 text-rose-500'}`}>
                        {item.q === 'yes' ? (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                        ) : (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        )}
                      </div>
                      <div>
                        <p className="font-bold text-slate-800 text-sm mb-0.5">{idx + 1}. {item.title}</p>
                        <p className={`text-xs font-medium ${item.q === 'yes' ? 'text-slate-500' : 'text-rose-600'}`}>
                          {item.q === 'yes' ? item.pass : item.fail}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-gradient-to-br from-rose-50 to-orange-50 border border-rose-100 p-5 rounded-2xl shadow-sm mb-6">
                  <div className="flex items-center gap-2 mb-3">
                    <div className="bg-rose-100 p-1.5 rounded-lg text-rose-600">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h3 className="font-extrabold text-rose-800 text-sm tracking-tight">감소대책 조치사항</h3>
                  </div>
                  <p className="text-xs text-rose-700/90 leading-relaxed font-semibold">

                  </p>
                </div>

                <div className="mt-auto pt-2 pb-4">
                  <button 
                    onClick={nextStep} 
                    className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    환기계산 진행하기
                  </button>
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-8">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">배풍기 풍량 입력</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    현재 보유중인 배풍기(송풍기/포터블팬)의 성능을 입력해주세요.
                  </p>
                </div>

                <div className="space-y-4">
                  {/* Alert message for capacity < 5000 (Moved above the input) */}
                  <div className={`transition-all duration-500 overflow-hidden ${parseFloat(fanCapacity) > 0 && parseFloat(fanCapacity) < 5000 ? 'max-h-40 opacity-100 mb-2' : 'max-h-0 opacity-0 mb-0'}`}>
                    <div className="p-4 bg-orange-50 border border-orange-100 rounded-2xl flex items-start gap-3 shadow-sm">
                      <span className="text-orange-500 mt-0.5 text-lg">⚠️</span>
                      <p className="text-xs text-orange-700 font-bold leading-relaxed">
                        주의문구 : 5,000 m³/hr 이상 풍량일 경우 정압 40mmAq 이상이 되므로, 풍량 5,000 m³/hr 이상의 배풍기를 구매하여 주시기 바랍니다.
                      </p>
                    </div>
                  </div>

                  <label className="block text-sm font-bold text-slate-700 ml-1">보유 풍량 <span className="text-blue-500">*</span></label>

                    <input 
                      type="number" 
                      value={fanCapacity} 
                      onChange={e => setFanCapacity(e.target.value)} 
                      placeholder="0" 
                      min="0"
                      className="w-full text-3xl p-5 border border-slate-200 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:outline-none transition-all font-black text-slate-800 bg-slate-50 focus:bg-white placeholder:text-slate-300 shadow-inner" 
                    />
                    <span className="absolute right-6 top-1/2 -translate-y-1/2 text-slate-400 font-bold group-focus-within:text-blue-500 transition-colors">m³/hr</span>
                  </div>
                </div>

                <div className="mt-auto pt-8 pb-4">
                  <button 
                    onClick={nextStep} 
                    disabled={!fanCapacity || parseFloat(fanCapacity) <= 0} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    다음으로
                  </button>
                </div>
              </div>
            )}

            {step === 5 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-8">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">공간 형태 선택</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    작업하실 밀폐공간의 형태를 선택해주세요.
                  </p>
                </div>

                <div className="space-y-4 mt-2">
                  <button 
                    onClick={() => { setShape('rect'); nextStep(); }} 
                    className="w-full bg-white border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 p-6 rounded-[1.5rem] flex items-center shadow-sm hover:shadow-md transition-all duration-300 group"
                  >
                    <div className="w-14 h-14 bg-slate-50 group-hover:bg-white rounded-2xl flex items-center justify-center mr-5 shadow-inner transition-colors">
                      <div className="w-7 h-5 border-[3px] border-slate-400 group-hover:border-blue-500 rounded-sm transition-colors"></div>
                    </div>
                    <div className="text-left">
                      <h3 className="text-lg font-bold text-slate-800 group-hover:text-blue-700 transition-colors">직사각형</h3>
                      <p className="text-xs text-slate-400 mt-1 font-medium">가로, 세로, 높이 기반</p>
                    </div>
                    <div className="ml-auto opacity-0 group-hover:opacity-100 text-blue-500 transition-opacity">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                    </div>
                  </button>

                  <button 
                    onClick={() => { setShape('cyl'); nextStep(); }} 
                    className="w-full bg-white border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 p-6 rounded-[1.5rem] flex items-center shadow-sm hover:shadow-md transition-all duration-300 group"
                  >
                    <div className="w-14 h-14 bg-slate-50 group-hover:bg-white rounded-2xl flex items-center justify-center mr-5 shadow-inner transition-colors">
                      <div className="w-6 h-6 border-[3px] border-slate-400 group-hover:border-blue-500 rounded-full transition-colors"></div>
                    </div>
                    <div className="text-left">
                      <h3 className="text-lg font-bold text-slate-800 group-hover:text-blue-700 transition-colors">원통형(원형)</h3>
                      <p className="text-xs text-slate-400 mt-1 font-medium">지름, 높이 기반</p>
                    </div>
                    <div className="ml-auto opacity-0 group-hover:opacity-100 text-blue-500 transition-opacity">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                    </div>
                  </button>

                  <button 
                    onClick={() => { setShape('combo'); nextStep(); }} 
                    className="w-full bg-white border border-slate-200 hover:border-blue-500 hover:bg-blue-50/50 p-6 rounded-[1.5rem] flex items-center shadow-sm hover:shadow-md transition-all duration-300 group"
                  >
                    <div className="w-14 h-14 bg-slate-50 group-hover:bg-white rounded-2xl flex items-center justify-center mr-5 shadow-inner transition-colors">
                      <div className="w-7 h-7 border-[3px] border-slate-400 group-hover:border-blue-500 rounded-lg flex items-center justify-center transition-colors">
                        <div className="w-3 h-3 border-[2px] border-slate-400 group-hover:border-blue-500 rounded-full bg-slate-100"></div>
                      </div>
                    </div>
                    <div className="text-left">
                      <h3 className="text-lg font-bold text-slate-800 group-hover:text-blue-700 transition-colors">결합형</h3>
                      <p className="text-xs text-slate-400 mt-1 font-medium">직사각형 + 원통형</p>
                    </div>
                    <div className="ml-auto opacity-0 group-hover:opacity-100 text-blue-500 transition-opacity">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                    </div>
                  </button>
                </div>
              </div>
            )}

            {step === 6 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-3 tracking-tight">
                    {shape === 'rect' ? '직사각형' : shape === 'cyl' ? '원통형' : '결합형'} 제원 입력
                  </h2>
                  <div className="inline-block bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100/50">
                    <p className="text-xs font-bold text-blue-600 tracking-wide">
                      {shape === 'rect' ? '가로 × 세로 × 높이 = 체적(m³)' : shape === 'cyl' ? '(3.14 × 지름² / 4) × 높이 = 체적(m³)' : '직사각형 체적 + 원통형 체적 = 총 체적(m³)'}
                    </p>
                  </div>
                </div>

                <div className="space-y-3 pb-4">
                  {shape === 'rect' ? (
                    <>
                      <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                        <span className="font-bold text-slate-600 text-base ml-1">가로</span>
                        <div className="flex items-center gap-2">
                          <input type="number" value={width} onChange={e => setWidth(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                          <span className="font-bold text-slate-400 w-6">m</span>
                        </div>
                      </div>
                      <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                        <span className="font-bold text-slate-600 text-base ml-1">세로</span>
                        <div className="flex items-center gap-2">
                          <input type="number" value={length} onChange={e => setLength(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                          <span className="font-bold text-slate-400 w-6">m</span>
                        </div>
                      </div>
                      <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                        <span className="font-bold text-slate-600 text-base ml-1">높이</span>
                        <div className="flex items-center gap-2">
                          <input type="number" value={height} onChange={e => setHeight(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                          <span className="font-bold text-slate-400 w-6">m</span>
                        </div>
                      </div>
                    </>
                  ) : shape === 'cyl' ? (
                    <>
                      <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                        <span className="font-bold text-slate-600 text-base ml-1">지름</span>
                        <div className="flex items-center gap-2">
                          <input type="number" value={diameter} onChange={e => setDiameter(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                          <span className="font-bold text-slate-400 w-6">m</span>
                        </div>
                      </div>
                      <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                        <span className="font-bold text-slate-600 text-base ml-1">높이</span>
                        <div className="flex items-center gap-2">
                          <input type="number" value={height} onChange={e => setHeight(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                          <span className="font-bold text-slate-400 w-6">m</span>
                        </div>
                      </div>
                    </>
                  ) : (
                    <div className="space-y-6">
                      {/* Combo: Rectangular part */}
                      <div className="space-y-3">
                        <h4 className="font-bold text-slate-700 text-sm ml-1 flex items-center gap-2">
                          <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>직사각형 부분
                        </h4>
                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                          <span className="font-bold text-slate-600 text-base ml-1">가로</span>
                          <div className="flex items-center gap-2">
                            <input type="number" value={comboRectWidth} onChange={e => setComboRectWidth(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                            <span className="font-bold text-slate-400 w-6">m</span>
                          </div>
                        </div>
                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                          <span className="font-bold text-slate-600 text-base ml-1">세로</span>
                          <div className="flex items-center gap-2">
                            <input type="number" value={comboRectLength} onChange={e => setComboRectLength(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                            <span className="font-bold text-slate-400 w-6">m</span>
                          </div>
                        </div>
                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                          <span className="font-bold text-slate-600 text-base ml-1">높이</span>
                          <div className="flex items-center gap-2">
                            <input type="number" value={comboRectHeight} onChange={e => setComboRectHeight(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                            <span className="font-bold text-slate-400 w-6">m</span>
                          </div>
                        </div>
                      </div>
                      
                      {/* Combo: Cylindrical part */}
                      <div className="space-y-3">
                        <h4 className="font-bold text-slate-700 text-sm ml-1 flex items-center gap-2">
                          <span className="w-1.5 h-1.5 rounded-full bg-cyan-500"></span>원통형 부분
                        </h4>
                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                          <span className="font-bold text-slate-600 text-base ml-1">지름</span>
                          <div className="flex items-center gap-2">
                            <input type="number" value={comboCylDiameter} onChange={e => setComboCylDiameter(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                            <span className="font-bold text-slate-400 w-6">m</span>
                          </div>
                        </div>
                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm transition-all focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10">
                          <span className="font-bold text-slate-600 text-base ml-1">높이</span>
                          <div className="flex items-center gap-2">
                            <input type="number" value={comboCylHeight} onChange={e => setComboCylHeight(e.target.value)} placeholder="0.0" className="w-28 text-right text-2xl p-2 bg-slate-50 rounded-xl outline-none font-black text-slate-800 focus:bg-blue-50 focus:text-blue-700 transition-colors shadow-inner" />
                            <span className="font-bold text-slate-400 w-6">m</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="mt-8 bg-slate-50 rounded-2xl p-5 border border-slate-100 flex justify-between items-center shadow-inner shrink-0">
                  <span className="text-slate-500 font-bold text-sm">총 체적(m³)</span>
                  <span className="text-3xl font-black text-blue-600">
                    {volume > 0 ? volume.toFixed(2) : '0.00'}
                  </span>
                </div>

                <div className="mt-6 pt-2 pb-4 shrink-0">
                  <button 
                    onClick={nextStep} 
                    disabled={volume <= 0} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    환기계산 결과 보기
                  </button>
                </div>
              </div>
            )}

            {step === 7 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in zoom-in-95 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="p-6 space-y-5 pt-8">
                  {/* Info Summary */}
                  <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
                    <h3 className="text-sm font-black text-blue-600 tracking-tight mb-4 ml-1">밀폐공간 환기 정보 요약</h3>
                    <div className="space-y-2 text-sm">
                      <div className="flex justify-between items-center py-1.5 border-b border-slate-50">
                        <span className="text-slate-500 font-medium">배풍기 풍량</span>
                        <span className="font-bold text-slate-800">{Number(fanCapacity).toLocaleString()} <span className="text-xs text-slate-400">m³/hr</span></span>
                      </div>
                      <div className="flex justify-between items-center py-1.5 border-b border-slate-50">
                        <span className="text-slate-500 font-medium">공간 형태</span>
                        <span className="font-bold text-slate-800">{shape === 'rect' ? '직사각형' : shape === 'cyl' ? '원통형' : '결합형 (직사각+원형)'}</span>
                      </div>
                      <div className="flex justify-between items-center py-1.5">
                        <span className="text-slate-500 font-medium">밀폐공간 체적</span>
                        <span className="font-bold text-blue-600">{volume.toFixed(2)} <span className="text-xs text-slate-400">m³</span></span>
                      </div>
                    </div>
                  </div>

                  {/* 환기정보에 따른 개선조치 (풍량 5000 미만일 경우 표시) */}
                  {fanHr < 5000 && (
                    <div className="bg-rose-50 border border-rose-100 rounded-2xl p-5 shadow-sm">
                      <h4 className="text-rose-800 font-bold text-sm mb-2 flex items-center gap-2">
                        <svg className="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        환기정보에 따른 개선조치
                      </h4>
                      <p className="text-xs text-rose-700/90 leading-relaxed font-semibold">
                        덕트 내 압력 손실로 인한 환기 불량을 방지하기 위해, 배풍기는 최소 풍량 5,000 m³/hr(또는 정압 40 mmAq) 이상의 사양을 사용하여 주시기 바랍니다.
                      </p>
                    </div>
                  )}

                  {/* Main Results */}
                  <div className="space-y-4">
                    <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 shadow-lg shadow-blue-500/20 text-white relative overflow-hidden">
                      <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                      <h3 className="text-white font-extrabold text-lg mb-1 tracking-tight">1. (작업 전) 환기시간</h3>
                      <p className="text-[10px] text-blue-200/80 mb-4 font-semibold tracking-wide">
                        ※ 밀폐공간 체적 10배 급기, 배풍기 효율 80% 기준
                      </p>
                      
                      <div className="flex items-baseline gap-1.5 mt-2">
                        <span className="text-5xl font-black tracking-tighter">{ventTime}</span>
                        <span className="text-lg font-bold text-blue-100">min (분)</span>
                        {isMinimumForced && <span className="ml-1 text-sm font-bold text-blue-200">이상</span>}
                      </div>
                      
                      <div className="mt-4 bg-black/15 p-3.5 rounded-xl border border-white/10 backdrop-blur-sm">
                        <p className="text-xs text-blue-50 font-medium leading-relaxed">
                          ⚠️ 주의: 이론적 환기시간은 {Math.ceil(rawVentTime)}분이나, 작업 전 반드시 <strong className="text-white">30분 이상 급기</strong>를 실시바랍니다.
                        </p>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 shadow-lg shadow-blue-500/20 text-white relative overflow-hidden">
                      <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white/10 rounded-full blur-2xl"></div>
                      <h3 className="text-white font-extrabold text-lg mb-1 tracking-tight">2. (작업 중) 적정 배풍기 수량</h3>
                      <p className="text-[10px] text-blue-200/80 mb-4 font-semibold tracking-wide">
                        ※ 시간당 20회 환기, 배풍기 효율 80% 적용 기준
                      </p>
                      <div className="flex items-baseline gap-2 mt-1">
                        <span className="text-5xl font-black tracking-tighter">{displayFanCount}</span>
                      </div>
                      
                      {rawFanCount > 1 && (
                        <div className="mt-4 bg-white/95 p-3.5 rounded-xl border border-rose-100 shadow-sm backdrop-blur-sm">
                          <p className="text-xs text-rose-600 font-bold leading-relaxed">
                            ⚠️ 현재 배풍기를 해당 대수만큼 추가하여 환기 실시 바랍니다.
                          </p>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="pt-4 pb-6">
                    <button 
                      onClick={reset} 
                      className="w-full bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800 font-bold py-4 rounded-2xl active:scale-[0.98] transition-all duration-300 text-sm"
                    >
                      새로운 계산하기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 앱 설치(홈 화면 추가) 배너 */}
            {showInstallBanner && !showInstallInstructions && (
              <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-white rounded-3xl p-5 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.3)] border border-slate-100 z-50 animate-in slide-in-from-bottom-10 fade-in duration-500">
                <div className="flex items-start gap-4">
                  <div className="bg-blue-50 p-3 rounded-2xl text-blue-600 shrink-0 shadow-inner">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                  </div>
                  <div className="flex-1">
                    <h4 className="font-extrabold text-slate-900 text-sm mb-1">앱 다운로드 (홈 화면 추가)</h4>
                    <p className="text-xs text-slate-500 font-medium leading-relaxed">바탕화면에 설치하여 언제든 빠르고 편리하게 앱을 사용하세요!</p>
                  </div>
                </div>
                <div className="flex gap-2 mt-4">
                  <button onClick={dismissInstall} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors active:scale-95">나중에</button>
                  <button onClick={handleInstallClick} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-md shadow-blue-500/20 hover:bg-blue-700 transition-colors active:scale-95">다운로드(설치)</button>
                </div>
              </div>
            )}

            {/* 앱 설치 방법 안내 모달 */}
            {showInstallInstructions && (
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-300">
                <div className="bg-white rounded-[2.5rem] p-6 w-full max-w-sm shadow-2xl relative animate-in zoom-in-95 duration-300">
                  <button onClick={() => setShowInstallInstructions(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:bg-slate-50 rounded-full transition-colors">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                  </button>
                  
                  <div className="text-center mb-6 mt-2">
                    <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner">
                      <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <h3 className="text-xl font-extrabold text-slate-900">홈 화면에 추가하는 방법</h3>
                    <p className="text-sm text-slate-500 mt-2 font-medium">기기에 따라 아래 방법을 따라해주세요.</p>
                  </div>

                  <div className="space-y-4">
                    {/* iOS Instructions */}
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm mb-2 flex items-center gap-2">
                        <svg className="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91 1.62.15 3.09.84 4.01 2.15-3.16 1.9-2.61 6.54.49 7.76-.75 1.83-1.68 3.5-2.71 4.75zM15.42 6.51c.71-.85 1.19-2.04 1.06-3.21-1.02.04-2.27.68-3 1.54-.65.77-1.23 2.01-1.07 3.15 1.13.09 2.3-.59 3.01-1.48z"/></svg>
                        iPhone (Safari)
                      </h4>
                      <ol className="text-[13px] text-slate-600 space-y-2 pl-5 list-decimal font-medium">
                        <li>화면 하단의 <span className="inline-flex p-1 bg-white border border-slate-200 rounded text-blue-500 shadow-sm align-middle mx-0.5"><svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg></span> <b>공유</b> 버튼을 누릅니다.</li>
                        <li>메뉴를 올려서 <b>'홈 화면에 추가'</b>를 선택합니다.</li>
                        <li>우측 상단의 <b>'추가'</b>를 누릅니다.</li>
                      </ol>
                    </div>

                    {/* Android Instructions */}
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm mb-2 flex items-center gap-2">
                        <svg className="w-4 h-4 text-green-500" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-1.002-.451-1.002-1.0021 0-.5512.451-1.0022 1.002-1.0022.5512 0 1.0022.451 1.0022 1.0022 0 .5511-.451 1.0021-1.0022 1.0021m-11.046 0c-.5511 0-1.002-.451-1.002-1.0021 0-.5512.451-1.0022 1.002-1.0022.5511 0 1.0021.451 1.0021 1.0022 0 .5511-.451 1.0021-1.0021 1.0021m11.4045-6.023l1.844-3.1932c.1052-.1821.043-.4141-.1391-.5191-.1822-.1052-.4141-.0431-.5192.139l-1.8562 3.2152C15.7061 8.2435 13.9312 7.7634 12 7.7634c-1.9311 0-3.7062.4801-5.2112 1.1983L4.9328 5.7461c-.1052-.1821-.3371-.2442-.5191-.139-.1822.1051-.2443.3371-.1392.5191l1.8441 3.1932C2.6517 11.2386.3262 14.8845.021 19.3402h23.958c-.3052-4.4557-2.6307-8.1016-6.0975-10.0218"/></svg>
                        Android (Chrome)
                      </h4>
                      <ol className="text-[13px] text-slate-600 space-y-2 pl-5 list-decimal font-medium">
                        <li>우측 상단의 <span className="inline-flex px-1.5 py-0.5 bg-white border border-slate-200 rounded font-bold shadow-sm align-middle mx-0.5">⋮</span> 메뉴를 누릅니다.</li>
                        <li><b>'홈 화면에 추가'</b> 또는 <b>'앱 설치'</b>를 선택합니다.</li>
                        <li>화면의 안내에 따라 <b>'설치'</b>를 누릅니다.</li>
                      </ol>
                    </div>
                  </div>
                  
                  <button onClick={() => setShowInstallInstructions(false)} className="w-full mt-6 bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm">
                    확인했습니다
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
