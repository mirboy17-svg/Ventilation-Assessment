<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>맨홀작업 - 안전지킴이앱</title>
  
  <!-- Open Graph / 카카오톡, 페이스북, 밴드 등 링크 공유 썸네일(미리보기) 설정 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="맨홀작업 - 안전지킴이앱" />
  <meta property="og:description" content="맨홀 작업 전 사전일정 송부 및 안전점검을 지원합니다." />
  <meta property="og:image" content="https://ventilation-assessment.vercel.app/image_bf5001.jpg" />
  <meta property="og:url" content="https://ventilation-assessment.vercel.app" />
  
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="맨홀작업 - 안전지킴이앱" />
  <meta name="twitter:description" content="맨홀 작업 전 사전일정 송부 및 안전점검을 지원합니다." />
  <meta name="twitter:image" content="https://ventilation-assessment.vercel.app/image_bf5001.jpg" />

  <script>
    var userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.indexOf("kakaotalk") > -1) {
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    }
  </script>

  <script>
    var iconFileName = "image_bf5001.jpg"; 
    var manifestData = {
      "name": "맨홀지킴이",
      "short_name": "맨홀지킴이",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#F4F7FB",
      "theme_color": "#2563EB",
      "icons": [
        { "src": iconFileName, "sizes": "192x192", "type": "image/jpeg" },
        { "src": iconFileName, "sizes": "512x512", "type": "image/jpeg" }
      ]
    };
    var manifestStr = JSON.stringify(manifestData);
    var manifestDataUrl = "data:application/json;charset=utf-8," + encodeURIComponent(manifestStr);
    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestDataUrl;
    document.head.appendChild(manifestLink);
    var appleTouchIcon = document.createElement('link');
    appleTouchIcon.rel = 'apple-touch-icon';
    appleTouchIcon.href = iconFileName;
    document.head.appendChild(appleTouchIcon);
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- html2canvas & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-[#F4F7FB] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // 1. 링크 접속 시 원격 서명(승인) 페이지 자동 처리 로직
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const action = params.get('action');
        const id = params.get('id');
        const approverName = params.get('approverName');

        if (action === 'approve' && id) {
          const gasUrl = 'https://script.google.com/macros/s/AKfycbzol98mGAggX5MAIllHg1KgRAzdrvSTN1cqYrle_PTGFdFZQUyrG4Jd8sJDVcKZAEHJhg/exec';
          
          document.body.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; text-align:center; padding:20px; background:#F4F7FB;">
              <div style="background:white; padding:40px; border-radius:24px; box-shadow:0 10px 25px rgba(0,0,0,0.05); max-width:400px; width:100%;">
                <h2 style="font-size:26px; font-weight:900; color:#1e293b; margin-bottom:12px;">서명완료</h2>
                <p style="font-size:15px; color:#64748b; margin-bottom:24px;">최종 승인을 진행하시겠습니까?<br/><b>(${decodeURIComponent(approverName || '허가자')}님)</b></p>
                <button id="confirmBtn" style="background:#2563eb; color:white; border:none; width:100%; padding:16px; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; margin-bottom:10px; transition:0.2s;">확인</button>
                <div id="statusArea" style="margin-top:10px;"></div>
              </div>
            </div>
          `;

          document.getElementById('confirmBtn').onclick = () => {
            document.getElementById('confirmBtn').innerText = '처리 중...';
            document.getElementById('confirmBtn').disabled = true;

            fetch(`${gasUrl}?action=approve&id=${id}&approverName=${encodeURIComponent(approverName || '승인자')}`)
              .then(res => res.json())
              .then(data => {
                if (data.success) {
                  document.getElementById('confirmBtn').style.display = 'none';
                  document.getElementById('statusArea').innerHTML = `
                    <div style="color: #2563EB; font-size: 24px; font-weight: 900; margin-bottom: 6px;">${decodeURIComponent(approverName || '승인자')}</div>
                    <div style="font-size: 16px; font-weight: bold; color: #333;">승인완료</div>
                  `;
                } else {
                  alert(data.message || '이미 처리되었거나 오류가 발생했습니다.');
                  document.getElementById('confirmBtn').innerText = '승인 불가';
                }
              })
              .catch(err => {
                alert('네트워크 오류가 발생했습니다.');
                document.getElementById('confirmBtn').disabled = false;
                document.getElementById('confirmBtn').innerText = '확인';
              });
          };
        }
      }, []);

      const [step, setStep] = useState(1);
      const [formData, setFormData] = useState({
        receiver: '', sender: '', companyName: '', representative: '',
        location: '', client: '', contact: '', workDate: '',
        workContent: '', otherInfo: '', remarks: '', inspector: ''
      });
      const formRef = useRef(null);
      const pdfTemplateRef = useRef(null);
      const permitPdfTemplateRef = useRef(null);

      // 환기계산 변수
      const [fanCapacity, setFanCapacity] = useState('');
      const [shape, setShape] = useState('');
      const [width, setWidth] = useState('');
      const [length, setLength] = useState('');
      const [diameter, setDiameter] = useState('');
      const [height, setHeight] = useState('');
      const [comboRectWidth, setComboRectWidth] = useState('');
      const [comboRectLength, setComboRectLength] = useState('');
      const [comboRectHeight, setComboRectHeight] = useState('');
      const [comboCylDiameter, setComboCylDiameter] = useState('');
      const [comboCylHeight, setComboCylHeight] = useState('');

      // 체크리스트 변수
      const [q1, setQ1] = useState(null); const [q2, setQ2] = useState(null); const [q3, setQ3] = useState(null);
      const [q4, setQ4] = useState(null); const [q5, setQ5] = useState(null); const [q6, setQ6] = useState(null);
      const [q7, setQ7] = useState(null); const [q8, setQ8] = useState(null); const [q9, setQ9] = useState(null);
      const [q10, setQ10] = useState(null);

      // 가스측정 변수
      const [calDate, setCalDate] = useState('');
      const [o2, setO2] = useState('');
      const [h2s, setH2S] = useState('');
      const [co2, setCO2] = useState('');
      const [co, setCO] = useState('');

      // 작업자 및 승인자 관리 (서명 포함)
      const [workers, setWorkers] = useState([{ type: '작업자', name: '', signature: null }]);
      const [approver, setApprover] = useState({ dept: '', title: '', name: '', phone: '', signed: false, signature: null });

      // 캔버스 모달 상태 관리
      const [signTarget, setSignTarget] = useState(null); // { type: 'worker', index: 0 } or { type: 'approver' }
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showInstallInstructions, setShowInstallInstructions] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const resultRef = useRef(null);

      // --- 캔버스 서명 그리기 로직 ---
      useEffect(() => {
        if (signTarget && canvasRef.current) {
           const ctx = canvasRef.current.getContext('2d');
           ctx.lineWidth = 4;
           ctx.lineCap = 'round';
           ctx.strokeStyle = '#000';
        }
      }, [signTarget]);

      const getCoordinates = (e, canvas) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCoordinates(e, canvas);
        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCoordinates(e, canvas);
        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => setIsDrawing(false);

      const handleSaveSignature = () => {
        const canvas = canvasRef.current;
        const dataUrl = canvas.toDataURL('image/png');
        if (signTarget.type === 'worker') {
          const newWorkers = [...workers];
          newWorkers[signTarget.index].signature = dataUrl;
          setWorkers(newWorkers);
        } else if (signTarget.type === 'approver') {
          setApprover({ ...approver, signature: dataUrl, signed: true });
        }
        setSignTarget(null);
      };

      const handleClearSignature = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      };

      // --- 데이터 계산 로직 ---
      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const getVolume = () => {
        if (shape === 'rect') return (parseFloat(width) || 0) * (parseFloat(length) || 0) * (parseFloat(height) || 0);
        if (shape === 'cyl') return (3.14 * Math.pow(parseFloat(diameter) || 0, 2) / 4) * (parseFloat(height) || 0);
        if (shape === 'combo') {
          const rw = parseFloat(comboRectWidth) || 0; const rl = parseFloat(comboRectLength) || 0; const rh = parseFloat(comboRectHeight) || 0;
          const cd = parseFloat(comboCylDiameter) || 0; const ch = parseFloat(comboCylHeight) || 0;
          return (rw * rl * rh) + ((3.14 * Math.pow(cd, 2) / 4) * ch);
        }
        return 0;
      };

      const volume = getVolume();
      const fanHr = parseFloat(fanCapacity) || 0;
      const reqTotalFanCapacityHr = volume * 24; 
      const rawFanCount = fanHr > 0 ? reqTotalFanCapacityHr / (fanHr * 0.8) : 0;
      
      let displayFanCount = "0대";
      if (rawFanCount > 0) displayFanCount = rawFanCount <= 1 ? "1대 이하" : rawFanCount.toFixed(1) + "대 이상";

      const actualFanCount = Math.ceil(rawFanCount > 0 ? rawFanCount : 0);
      const effectiveAirflowMin = (actualFanCount * fanHr * 0.8) / 60;
      const rawVentTime = effectiveAirflowMin > 0 ? (volume * 10) / effectiveAirflowMin : 0;
      const ventTime = Math.max(Math.ceil(rawVentTime), 30); 
      const isMinimumForced = Math.ceil(rawVentTime) < 30 && effectiveAirflowMin > 0;

      const handleAddWorker = () => setWorkers([...workers, { type: '작업자', name: '', signature: null }]);
      const handleWorkerChange = (index, field, value) => {
        const newWorkers = [...workers];
        newWorkers[index][field] = value;
        setWorkers(newWorkers);
      };
      const handleRemoveWorker = (index) => setWorkers(workers.filter((_, i) => i !== index));

      // --- 문자 연동 ---
      const handleSendPermitSMS = () => {
        if (!approver.phone) return alert('최종 허가자의 전화번호를 입력해주세요.');
        if (!approver.name) return alert('최종 허가자의 성명을 입력해주세요.');

        const permitId = 'permit_' + Date.now();
        const gasUrl = 'https://script.google.com/macros/s/AKfycbzol98mGAggX5MAIllHg1KgRAzdrvSTN1cqYrle_PTGFdFZQUyrG4Jd8sJDVcKZAEHJhg/exec';

        fetch(`${gasUrl}?action=create&id=${permitId}&location=${encodeURIComponent(formData.location)}`, {
          method: 'POST', mode: 'no-cors'
        }).catch(err => console.log('DB 등록 요청 완료'));

        const message = `[맨홀작업 안전지킴이]  
작업허가서 승인 요청입니다.
- 작업장소(위치) : ${formData.location || '-'}
- 작업내용 : ${formData.workContent || '-'}
- 작업수행시간 : ${formData.workDate || '-'}
- 산소및유해가스농도측정결과(4개항목결과) : O2 ${o2 || '-'}%, H2S ${h2s || '-'}ppm, CO2 ${co2 || '-'}ppm, CO ${co || '-'}ppm

아래의 '확인'을 누르시면 최종 승인됩니다.
https://ventilation-assessment.vercel.app/?action=approve&id=${permitId}&approverName=${encodeURIComponent(approver.name)}`;

        window.location.href = `sms:${approver.phone}?body=${encodeURIComponent(message)}`;

        const checkInterval = setInterval(() => {
          fetch(`${gasUrl}?action=check&id=${permitId}`)
            .then(res => res.json())
            .then(data => {
              if (data.success && data.status === '승인완료') {
                setApprover(prev => ({ ...prev, signed: true, name: data.approver || prev.name }));
                clearInterval(checkInterval);
                alert('최종 허가자가 승인을 완료하였습니다!');
              }
            })
            .catch(err => console.log('상태 확인 중...'));
        }, 3000);
      };

      // --- PDF 저장 로직 ---
      const saveAsPDF = () => {
        if (!pdfTemplateRef.current) return;
        if (!window.html2canvas || !window.jspdf) return alert('PDF 기능을 불러오는 중입니다.');
        const { jsPDF } = window.jspdf;
        pdfTemplateRef.current.style.display = 'block';

        window.html2canvas(pdfTemplateRef.current, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true })
        .then(canvas => {
          pdfTemplateRef.current.style.display = 'none';
          const imgData = canvas.toDataURL('image/jpeg', 1.0);
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const imgHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'JPEG', 0, 15, pdfWidth, imgHeight);
          pdf.save(`맨홀작업일정_사전송부.pdf`);
        });
      };

      const savePermitAsPDF = () => {
        if (!permitPdfTemplateRef.current) return;
        if (!window.html2canvas || !window.jspdf) return alert('PDF 기능을 불러오는 중입니다.');
        const { jsPDF } = window.jspdf;
        permitPdfTemplateRef.current.style.display = 'block';

        window.html2canvas(permitPdfTemplateRef.current, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true })
        .then(canvas => {
          permitPdfTemplateRef.current.style.display = 'none';
          const imgData = canvas.toDataURL('image/jpeg', 1.0);
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = pdf.internal.pageSize.getHeight();
          let imgHeight = (canvas.height * pdfWidth) / canvas.width;
          if (imgHeight > pdfHeight) imgHeight = pdfHeight;
          pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, imgHeight);
          pdf.save(`맨홀공간_작업계획허가서.pdf`);
        });
      };

      const downloadOneCallService = () => {
        const link = document.createElement('a'); link.href = '원콜서비스.pdf'; link.download = '원콜서비스_안내.pdf'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };
      const saveAsImage = () => {
        if (!resultRef.current) return;
        window.html2canvas(resultRef.current, { scale: 1.5, backgroundColor: '#F8FAFC' }).then(canvas => {
          const link = document.createElement('a'); link.download = `환기계산결과.jpg`; link.href = canvas.toDataURL('image/jpeg', 0.7); link.click();
        });
      };

      const nextStep = () => setStep((s) => s + 1);
      const prevStep = () => setStep((s) => s - 1);
      const reset = () => {
        setStep(1); setFormData({ receiver: '', sender: '', companyName: '', representative: '', location: '', client: '', contact: '', workDate: '', workContent: '', otherInfo: '', remarks: '', inspector: '' });
        setFanCapacity(''); setShape(''); setWidth(''); setLength(''); setHeight(''); setDiameter(''); setComboRectWidth(''); setComboRectLength(''); setComboRectHeight(''); setComboCylDiameter(''); setComboCylHeight('');
        setQ1(null); setQ2(null); setQ3(null); setQ4(null); setQ5(null); setQ6(null); setQ7(null); setQ8(null); setQ9(null); setQ10(null);
        setCalDate(''); setO2(''); setH2S(''); setCO2(''); setCO('');
        setWorkers([{ type: '작업자', name: '', signature: null }]); setApprover({ dept: '', title: '', name: '', phone: '', signed: false, signature: null });
      };

      return (
        <div className="min-h-screen bg-[#F4F7FB] flex justify-center font-sans text-slate-800 selection:bg-blue-200 sm:p-4 md:p-8 relative">
          <div className="w-full max-w-md md:max-w-3xl lg:max-w-5xl bg-white sm:rounded-[2.5rem] sm:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)] min-h-[100dvh] sm:min-h-[850px] flex flex-col relative overflow-hidden sm:border border-slate-100/50 transition-all duration-500">
            
            {/* 상단 프로그레스 바 (Step 2 ~ 10 통합 적용) */}
            {step > 1 && step <= 10 && (
              <header className="px-6 py-5 flex items-center bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100/80 justify-between">
                <button onClick={prevStep} className="p-2 -ml-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95 shrink-0">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" /></svg>
                </button>
                <div className="flex-1 flex items-center px-4 md:px-10">
                  <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div className="bg-blue-600 h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${((step - 1) / 9) * 100}%` }}></div>
                  </div>
                  <span className="ml-3 text-xs font-bold text-slate-400 whitespace-nowrap">{step - 1} / 9</span>
                </div>
                <button onClick={nextStep} disabled={step === 10} className={`p-2 -mr-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95 shrink-0 ${step === 10 ? 'opacity-0 cursor-default' : 'opacity-100'}`}>
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" /></svg>
                </button>
              </header>
            )}

            {/* Step 1 */}
            {step === 1 && (
              <div className="flex flex-col flex-1 pb-6 pt-10 animate-in fade-in duration-700 ease-out h-full max-h-[100dvh] relative md:justify-center">
                <div className="text-center w-full space-y-3 px-6 mb-6 shrink-0 mt-4 md:mt-0">
                  <span className="inline-block py-1.5 px-4 rounded-full bg-blue-50 text-blue-600 text-xs font-bold tracking-wide mb-1">안전보건공단 KOSHA GUIDE 기준</span>
                  <h1 className="text-[2.2rem] md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight transition-all">맨홀작업 안전조치 <br className="md:hidden"/><span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">맨홀지킴이</span></h1>
                  <p className="text-slate-500 text-sm md:text-base mt-3 font-medium px-4 md:max-w-lg md:mx-auto transition-all">맨홀 작업 사전일정 송부 및 작업 전 필수적인 맨홀 안전점검을 지원합니다.</p>
                </div>
                <div className="w-full relative shrink-0 md:max-w-2xl md:mx-auto md:rounded-3xl md:overflow-hidden md:shadow-sm md:border md:border-slate-100 transition-all">
                  <div className="w-full aspect-[4/3] md:aspect-[21/9] relative overflow-hidden bg-white shadow-sm border-y border-slate-100 md:border-none">
                    <img src="image_bf5001.jpg" alt="환기 예시 아이콘" className="absolute inset-0 w-full h-full object-contain p-8 md:p-12 transition-all" />
                  </div>
                </div>
                <div className="px-6 flex-1 flex flex-col justify-center my-auto w-full max-w-sm md:max-w-md mx-auto min-h-[100px] relative z-20">
                  <button onClick={nextStep} className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-[1.15rem] md:py-5 rounded-2xl md:rounded-3xl shadow-xl hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg md:text-xl relative z-30">사전송부 및 평가 시작</button>
                </div>
              </div>
            )}

            {/* Step 2 */}
            {step === 2 && (
              <div className="flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out bg-[#F8FAFC]">
                <div ref={formRef} className="p-6 pb-4 bg-white flex-1 overflow-y-auto custom-scrollbar">
                  <div className="mb-6 text-center border-b-2 border-slate-800 pb-4">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight transition-all">맨홀 작업 일정 사전송부 서식</h2>
                  </div>
                  <div className="space-y-1 md:grid md:grid-cols-2 md:gap-x-10 md:gap-y-2 md:space-y-0 transition-all">
                    {[
                      { num: '1', label: '수신자', name: 'receiver', placeholder: '입력하세요' },
                      { num: '2', label: '발신자', name: 'sender', placeholder: '입력하세요' },
                      { num: '3', label: '사업장명(현장명)', name: 'companyName', placeholder: '입력하세요' },
                      { num: '4', label: '대표자(현장책임자)', name: 'representative', placeholder: '입력하세요' },
                      { num: '5', label: '소재지(맨홀위치)', name: 'location', placeholder: '상세 위치 입력' },
                      { num: '6', label: '발주자', name: 'client', placeholder: '입력하세요' },
                      { num: '7', label: '현장 연락처', name: 'contact', placeholder: '핸드폰 등 입력' },
                      { num: '8', label: '작업 일시', name: 'workDate', placeholder: '예: 2024.10.12 09:00~18:00' },
                      { num: '9', label: '작업 내용', name: 'workContent', placeholder: '구체적인 작업 내용 입력' },
                      { num: '10', label: '기타(보호구 등)', name: 'otherInfo', placeholder: '보유장비, 특기사항 등' },
                      { num: '11', label: '특이사항', name: 'remarks', placeholder: '특이사항 입력' },
                      { num: '12', label: '입회자(담당공무원)', name: 'inspector', placeholder: '입력하세요' }
                    ].map((item) => (
                      <div key={item.name} className={`flex items-start border-b border-slate-300 py-3 hover:bg-slate-50/50 transition-colors ${(item.num === '11' || item.num === '12') ? 'md:col-span-2' : ''}`}>
                        <span className="font-bold text-slate-700 text-[13.5px] md:text-[14.5px] w-[145px] md:w-[160px] shrink-0 mt-0.5">{item.num}. {item.label}</span>
                        <span className="text-slate-400 mr-2 mt-0.5">:</span>
                        <textarea name={item.name} value={formData[item.name]} onChange={(e) => { handleInputChange(e); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }} rows="1" className="flex-1 w-full px-1 py-0.5 outline-none text-[13.5px] md:text-[14.5px] font-medium focus:bg-blue-50/50 bg-transparent text-slate-900 resize-none overflow-hidden break-words whitespace-pre-wrap" placeholder={item.placeholder} />
                      </div>
                    ))}
                  </div>
                </div>

                {/* PDF 템플릿 1 */}
                <div style={{ display: 'none', position: 'absolute', left: '-9999px', top: '0', width: '800px', backgroundColor: 'white', padding: '10px 40px 40px 40px', boxSizing: 'border-box' }} ref={pdfTemplateRef}>
                  <div style={{ textAlign: 'center', marginBottom: '15px', marginTop: '35px', fontSize: '13.5px', fontWeight: 'bold', color: '#DC2626', lineHeight: '1.4' }}>
                    『맨홀 질식재해 예방 3대 안전수칙』 준수<br/>
                    ① 산소 및 유해가스 측정! &nbsp; ② 충분한 환기! &nbsp; ③ 호흡보호구(송기마스크 등) 착용!
                  </div>
                  <h1 style={{ fontSize: '32px', fontWeight: 'bold', textAlign: 'center', marginBottom: '25px', color: '#000' }}>맨홀 작업 일정 사전송부</h1>
                  <div style={{ textAlign: 'left', marginBottom: '20px', fontSize: '18px', color: '#000', lineHeight: '1.8' }}>
                    <div><strong>수신자:</strong> {formData.receiver}</div>
                    <div style={{ marginTop: '10px' }}><strong>발신자:</strong> {formData.sender}</div>
                  </div>
                  <table style={{ width: '100%', borderCollapse: 'collapse', border: '2px solid black', color: '#000', fontSize: '16px', tableLayout: 'fixed' }}>
                    <tbody>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', width: '20%', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>사업장명<br/>(현장명)</th>
                        <td style={{ border: '1px solid black', padding: '12px', width: '30%', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.companyName}</td>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', width: '20%', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>대표자<br/>(현장 책임자)</th>
                        <td style={{ border: '1px solid black', padding: '12px', width: '30%', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.representative}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>소재지<br/>(맨홀위치)</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.location}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>발주자</th>
                        <td style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.client}</td>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>현장 연락처<br/>(핸드폰 등)</th>
                        <td style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.contact}</td>
                      </tr>
                      <tr>
                        <th rowSpan="3" style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>작업정보</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '24px 12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}><strong>1. 작업 일시:</strong> {formData.workDate}</td>
                      </tr>
                      <tr>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '30px 12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}><strong>2. 작업 내용:</strong> {formData.workContent}</td>
                      </tr>
                      <tr>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '30px 12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}><strong>3. 기타:</strong> {formData.otherInfo}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>특이사항</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.remarks}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>입회자<br/>(담당 공무원)</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.inspector}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div className="mt-auto px-6 pt-4 pb-6 bg-[#F8FAFC] space-y-3 shrink-0 border-t border-slate-100 md:flex md:space-y-0 md:gap-4 md:justify-center md:px-10">
                  <button onClick={saveAsPDF} className="w-full md:w-1/2 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm md:text-base flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    맨홀 작업 일정 다운로드
                  </button>
                  <button onClick={nextStep} className="w-full md:w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg md:text-xl">
                    가이드 확인 진행
                  </button>
                </div>
              </div>
            )}

            {/* Step 3 ~ 9 ... */}
            {step === 3 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out h-full overflow-hidden">
                <div className="p-6 pb-4 shrink-0 bg-white border-b border-slate-100 shadow-sm z-10 relative text-center">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">질식사고예방 사전준비 사항</h2>
                </div>
                <div className="flex-1 overflow-y-auto custom-scrollbar p-6 bg-slate-50 flex flex-col justify-start items-center">
                  <div className="w-full max-w-3xl rounded-2xl overflow-hidden shadow-md border border-slate-200 bg-white">
                    <img src="image1.jpg" alt="질식사고예방 가이드" className="w-full h-auto max-h-[60vh] object-contain block mx-auto" />
                  </div>
                </div>
                <div className="p-6 pt-4 pb-6 bg-white border-t border-slate-100 shrink-0 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] z-10 relative space-y-3 md:flex md:space-y-0 md:gap-4 md:justify-center md:px-10">
                  <button onClick={nextStep} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 active:scale-[0.98] transition-all duration-300 text-lg">확인완료/다음</button>
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out text-center overflow-y-auto custom-scrollbar md:px-10">
                <div className="mb-6 md:mb-10">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">맨홀 안전작업 체크리스트</h2>
                </div>
                <div className="space-y-4 pb-4 text-left md:grid md:grid-cols-2 md:gap-5 md:space-y-0 transition-all">
                  {[
                    { qState: q1, setFn: setQ1, num: '1', text: '위치 및 위험요인 파악' }, { qState: q2, setFn: setQ2, num: '2', text: '허가서 발급 및 게시' },
                    { qState: q3, setFn: setQ3, num: '3', text: '출입금지 표지 게시' }, { qState: q4, setFn: setQ4, num: '4', text: '산소 및 유해가스 측정(작업 전/중)' },
                    { qState: q5, setFn: setQ5, num: '5', text: '환기팬 가동 및 성능 확인' }, { qState: q6, setFn: setQ6, num: '6', text: '호흡용보호구 비치' },
                    { qState: q7, setFn: setQ7, num: '7', text: '감시인 배치' }, { qState: q8, setFn: setQ8, num: '8', text: '입/퇴장 인원 점검' },
                    { qState: q9, setFn: setQ9, num: '9', text: '안전교육(TBM) 실시' }, { qState: q10, setFn: setQ10, num: '10', text: '구조장비 설치 및 훈련' }
                  ].map((item, idx) => (
                    <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors flex flex-col justify-between">
                      <p className="font-bold text-slate-800 mb-4 text-sm md:text-base leading-snug"><span className="text-blue-600 mr-1">{item.num}.</span> {item.text}</p>
                      <div className="flex gap-2">
                        <button onClick={() => item.setFn('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${item.qState === 'yes' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                        <button onClick={() => item.setFn('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${item.qState === 'no' ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-auto pt-4 pb-2 bg-transparent shrink-0 md:max-w-md md:mx-auto w-full">
                  <button onClick={nextStep} disabled={!q1 || !q2 || !q3 || !q4 || !q5 || !q6 || !q7 || !q8 || !q9 || !q10} className="w-full bg-blue-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg">평가 리포트 확인</button>
                </div>
              </div>
            )}

            {step === 5 && (
              <div className="p-6 flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar md:px-10">
                <div className="mb-6 md:mb-10 text-center">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">자율점검 평가 리포트</h2>
                </div>
                <div className="mt-auto pt-2 pb-4 bg-transparent shrink-0 md:max-w-md md:mx-auto w-full">
                  <button onClick={nextStep} className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg">맨홀 형태 선택</button>
                </div>
              </div>
            )}

            {step === 6 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out md:justify-center md:items-center">
                <div className="mb-8 md:mb-12 text-center">
                  <h2 className="text-2xl md:text-4xl font-extrabold text-slate-900 mb-3 tracking-tight transition-all">맨홀 공간 형태 선택</h2>
                </div>
                <div className="space-y-4 w-full md:grid md:grid-cols-3 md:gap-6 md:space-y-0 md:max-w-4xl transition-all">
                  <button onClick={() => { setShape('cyl'); nextStep(); }} className="w-full bg-white border border-slate-200 hover:border-blue-500 p-6 md:p-8 rounded-[1.5rem] flex md:flex-col items-center justify-center">원통형</button>
                  <button onClick={() => { setShape('rect'); nextStep(); }} className="w-full bg-white border border-slate-200 hover:border-blue-500 p-6 md:p-8 rounded-[1.5rem] flex md:flex-col items-center justify-center">직사각형</button>
                  <button onClick={() => { setShape('combo'); nextStep(); }} className="w-full bg-white border border-slate-200 hover:border-blue-500 p-6 md:p-8 rounded-[1.5rem] flex md:flex-col items-center justify-center">결합형</button>
                </div>
              </div>
            )}

            {step === 7 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar md:px-10">
                <div className="mb-6 shrink-0 md:text-center md:mb-10">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-3 tracking-tight transition-all">{shape === 'rect' ? '직사각형' : shape === 'cyl' ? '원통형' : '결합형'} 제원 입력</h2>
                </div>
                <div className="w-full max-w-[280px] md:max-w-md mx-auto mt-2 pb-4 flex-1">
                  {shape === 'cyl' && (
                    <div className="space-y-4">
                      <input type="number" value={diameter} onChange={e=>setDiameter(e.target.value)} placeholder="지름(m)" className="w-full p-4 border rounded-xl text-center text-xl font-bold bg-white" />
                      <input type="number" value={height} onChange={e=>setHeight(e.target.value)} placeholder="높이(m)" className="w-full p-4 border rounded-xl text-center text-xl font-bold bg-white" />
                    </div>
                  )}
                  {shape === 'rect' && (
                    <div className="space-y-4">
                      <input type="number" value={width} onChange={e=>setWidth(e.target.value)} placeholder="가로(m)" className="w-full p-4 border rounded-xl text-center text-xl font-bold bg-white" />
                      <input type="number" value={length} onChange={e=>setLength(e.target.value)} placeholder="세로(m)" className="w-full p-4 border rounded-xl text-center text-xl font-bold bg-white" />
                      <input type="number" value={height} onChange={e=>setHeight(e.target.value)} placeholder="높이(m)" className="w-full p-4 border rounded-xl text-center text-xl font-bold bg-white" />
                    </div>
                  )}
                  {shape === 'combo' && (
                     <div className="space-y-4">
                       <h4 className="font-bold">사각 부분</h4>
                       <input type="number" value={comboRectWidth} onChange={e=>setComboRectWidth(e.target.value)} placeholder="가로(m)" className="w-full p-3 border rounded-xl bg-white" />
                       <input type="number" value={comboRectLength} onChange={e=>setComboRectLength(e.target.value)} placeholder="세로(m)" className="w-full p-3 border rounded-xl bg-white" />
                       <input type="number" value={comboRectHeight} onChange={e=>setComboRectHeight(e.target.value)} placeholder="높이(m)" className="w-full p-3 border rounded-xl bg-white" />
                       <h4 className="font-bold mt-4">원형 부분</h4>
                       <input type="number" value={comboCylDiameter} onChange={e=>setComboCylDiameter(e.target.value)} placeholder="지름(m)" className="w-full p-3 border rounded-xl bg-white" />
                       <input type="number" value={comboCylHeight} onChange={e=>setComboCylHeight(e.target.value)} placeholder="높이(m)" className="w-full p-3 border rounded-xl bg-white" />
                     </div>
                  )}
                  <div className="mt-8 bg-slate-50 rounded-2xl p-5 border text-center">
                    <span className="text-slate-500 font-bold">총 체적: </span>
                    <span className="text-3xl font-black text-blue-600">{volume > 0 ? volume.toFixed(2) : '0.00'} m³</span>
                  </div>
                </div>
                <div className="mt-4 pt-2 pb-4 shrink-0 md:max-w-md md:mx-auto w-full">
                   <button onClick={nextStep} disabled={volume <= 0} className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg">농도측정/풍량 입력</button>
                </div>
              </div>
            )}

            {step === 8 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar md:px-10">
                <div className="mb-6 md:mb-10 md:text-center">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">작업 전 가스측정결과 및<br/>보유 배풍기 풍량 확인</h2>
                </div>
                <div className="space-y-8 md:grid md:grid-cols-2 md:gap-10 md:space-y-0 transition-all">
                  <div>
                    <h3 className="font-bold text-slate-800 mb-4">1. 측정결과</h3>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                      <div className="flex justify-between items-center"><label>산소 (O₂)</label><input type="number" value={o2} onChange={e=>setO2(e.target.value)} placeholder="20.9" className="w-24 p-2 border rounded text-center" /></div>
                      <div className="flex justify-between items-center"><label>황화수소 (H₂S)</label><input type="number" value={h2s} onChange={e=>setH2S(e.target.value)} placeholder="0" className="w-24 p-2 border rounded text-center" /></div>
                      <div className="flex justify-between items-center"><label>이산화탄소 (CO₂)</label><input type="number" value={co2} onChange={e=>setCO2(e.target.value)} placeholder="400" className="w-24 p-2 border rounded text-center" /></div>
                      <div className="flex justify-between items-center"><label>일산화탄소 (CO)</label><input type="number" value={co} onChange={e=>setCO(e.target.value)} placeholder="0" className="w-24 p-2 border rounded text-center" /></div>
                    </div>
                  </div>
                  <div>
                    <h3 className="font-bold text-slate-800 mb-4">2. 보유 풍량</h3>
                    <div className="space-y-4">
                      <input type="number" value={fanCapacity} onChange={e=>setFanCapacity(e.target.value)} placeholder="풍량 입력 (m³/hr)" className="w-full text-2xl p-6 border border-slate-200 rounded-2xl font-black bg-white shadow-sm text-center" />
                    </div>
                  </div>
                </div>
                <div className="mt-auto pt-8 pb-4 shrink-0 md:max-w-md md:mx-auto w-full">
                   <button onClick={nextStep} disabled={!fanCapacity || !o2 || !h2s || !co2 || !co} className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-lg md:text-xl">환기계산 결과 보기</button>
                </div>
              </div>
            )}

            {step === 9 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in zoom-in-95 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="bg-white px-6 py-10 md:py-14 border-b border-slate-100 shadow-sm text-center shrink-0">
                  <h2 className="text-[1.75rem] md:text-4xl font-black text-slate-900">자율점검 완료</h2>
                </div>
                <div className="mt-auto pt-2 pb-6 px-6 shrink-0 md:max-w-2xl md:mx-auto w-full text-center">
                    <button onClick={nextStep} className="w-full md:w-1/2 mx-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-lg md:text-xl">작업허가서 작성 및 발급</button>
                </div>
              </div>
            )}

            {/* Step 10: 작업허가서 발급 */}
            {step === 10 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar relative">
                <div className="bg-white px-6 py-6 md:py-8 border-b border-slate-100 shadow-sm shrink-0 text-center">
                  <h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">맨홀공간 작업(계획)허가서</h2>
                  <p className="text-slate-500 text-[13px] md:text-sm mt-2 font-medium">최종 작업자 명단과 허가자 서명을 완료 후 발급하세요.</p>
                </div>
                
                <div className="p-6 md:p-10 space-y-6 flex-1 md:max-w-4xl md:mx-auto md:w-full">
                  
                  {/* 1. 기본 정보 */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                     <h3 className="text-base font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">기본 정보</h3>
                     <div className="space-y-3 text-sm md:text-base">
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">신청인(발신자)</span><span className="font-medium text-slate-900">{formData.sender || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">작업수행시간</span><span className="font-medium text-slate-900">{formData.workDate || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">작업장소(위치)</span><span className="font-medium text-slate-900">{formData.location || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">작업내용</span><span className="font-medium text-slate-900">{formData.workContent || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">내부 연락방법</span><span className="font-medium text-slate-900">{formData.representative} / {formData.contact}</span></div>
                     </div>
                  </div>

                  {/* 5. 작업자(측정자) 명단 및 캔버스 서명 */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                     <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                       <h3 className="text-base font-bold text-slate-800">5. 작업자(측정자) 명단</h3>
                       <button onClick={handleAddWorker} className="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition-colors">+ 인원 추가</button>
                     </div>
                     {workers.some(w => w.type === '측정자') && (
                       <div className="mb-3 text-sm text-blue-600 font-bold bg-blue-50 p-2 rounded">
                         ※ 산소 및 유해가스농도측정자명을 정확히 적어주세요.
                       </div>
                     )}
                     <div className="space-y-4">
                        {workers.map((worker, idx) => (
                           <div key={idx} className="flex flex-col gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                              <div className="flex gap-2 items-center">
                                <select value={worker.type} onChange={(e) => handleWorkerChange(idx, 'type', e.target.value)} className="p-2.5 rounded-lg border border-slate-200 bg-white font-bold text-slate-700 text-sm md:text-base outline-none focus:border-blue-500 shrink-0">
                                   <option value="작업자">작업자</option>
                                   <option value="감시인">감시인</option>
                                   <option value="측정자">측정자</option>
                                </select>
                                <input type="text" value={worker.name} onChange={(e) => handleWorkerChange(idx, 'name', e.target.value)} placeholder="성명 입력" className="flex-1 p-2.5 rounded-lg border border-slate-200 bg-white text-sm md:text-base outline-none focus:border-blue-500" />
                                {workers.length > 1 && (
                                  <button onClick={() => handleRemoveWorker(idx)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg shrink-0">✕</button>
                                )}
                              </div>
                              <div className="flex justify-end items-center mt-1">
                                {worker.signature ? (
                                  <div className="flex items-center gap-3">
                                    <img src={worker.signature} className="h-10 object-contain border border-slate-200 bg-white rounded shadow-sm px-2" alt="서명 이미지" />
                                    <button onClick={() => setSignTarget({type:'worker', index: idx})} className="text-xs font-bold text-slate-500 underline">다시 서명</button>
                                  </div>
                                ) : (
                                  <button onClick={() => setSignTarget({type:'worker', index: idx})} className="text-sm font-bold bg-white border border-slate-300 text-slate-600 px-4 py-1.5 rounded-lg shadow-sm hover:bg-slate-50">✍️ 직접 서명하기</button>
                                )}
                              </div>
                           </div>
                        ))}
                     </div>
                  </div>

                  {/* 6. 최종 허가자 승인 (직접 및 문자 원격) */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                     <h3 className="text-base font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">6. 최종 허가자 승인</h3>
                     <div className="grid grid-cols-2 gap-3 mb-4 md:grid-cols-4">
                        <input type="text" placeholder="부서" value={approver.dept} onChange={e => setApprover({...approver, dept: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white" />
                        <input type="text" placeholder="직책" value={approver.title} onChange={e => setApprover({...approver, title: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white" />
                        <input type="text" placeholder="성명" value={approver.name} onChange={e => setApprover({...approver, name: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white" />
                        <input type="tel" placeholder="문자수신 번호" value={approver.phone} onChange={e => setApprover({...approver, phone: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white" />
                     </div>
                     
                     <div className="flex flex-col md:flex-row gap-3 items-stretch">
                        <button onClick={() => setSignTarget({type:'approver'})} className="flex-1 bg-white border border-slate-300 text-slate-700 font-bold py-3.5 md:py-4 rounded-xl shadow-sm hover:bg-slate-50 transition-all text-sm md:text-base flex items-center justify-center gap-2">
                          ✍️ 태블릿 직접 서명
                        </button>
                        <button onClick={handleSendPermitSMS} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md transition-all text-sm md:text-base flex items-center justify-center gap-2">
                          📱 승인 요청 알림문자 발송
                        </button>
                     </div>

                     <div className={`mt-4 flex items-center justify-center py-4 rounded-xl border-2 border-dashed font-bold text-sm md:text-base ${(approver.signed || approver.signature) ? 'bg-blue-50 border-blue-300' : 'bg-slate-50 border-slate-300 text-slate-400'}`}>
                       {approver.signature ? (
                          <div className="flex flex-col items-center">
                            <img src={approver.signature} className="h-12 object-contain mix-blend-multiply" alt="승인자 서명" />
                            <div className="text-slate-800 font-bold text-xs mt-1">승인완료</div>
                          </div>
                       ) : approver.signed ? (
                          <div className="text-center">
                            <div className="text-blue-600 text-lg font-black">{approver.name || '책임자'}</div>
                            <div className="text-slate-800 text-sm mt-0.5">승인완료</div>
                          </div>
                       ) : '서명 대기중...'}
                     </div>
                  </div>
                </div>
                
                <div className="px-6 pt-2 pb-6 shrink-0 md:max-w-2xl md:mx-auto w-full space-y-3">
                  <button onClick={savePermitAsPDF} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-lg flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    최종 작업허가서 PDF 다운로드
                  </button>
                  <button onClick={reset} className="w-full bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800 font-bold py-4 rounded-2xl active:scale-[0.98] transition-all duration-300 text-base">처음으로 돌아가기</button>
                </div>

                {/* 10단계 작업허가서 전용 PDF 템플릿 (숨김처리) */}
                {(() => {
                  const measurerName = workers.find(w => w.type === '측정자' && w.name.trim() !== '')?.name || formData.inspector || formData.sender || '-';
                  
                  let shapeName = ''; let shapeDetails = '';
                  if(shape === 'rect'){ shapeName = '직사각형'; shapeDetails = `(가로: ${width||0}m, 세로: ${length||0}m, 높이: ${height||0}m)`; } 
                  else if(shape === 'cyl') { shapeName = '원통형'; shapeDetails = `(지름: ${diameter||0}m, 높이: ${height||0}m)`; } 
                  else if(shape === 'combo') { shapeName = '결합형'; shapeDetails = `(사각: 가로 ${comboRectWidth||0}m, 세로 ${comboRectLength||0}m, 높이 ${comboRectHeight||0}m / 원형: 지름 ${comboCylDiameter||0}m, 높이 ${comboCylHeight||0}m)`; }

                  return (
                  <div style={{ display: 'none', position: 'absolute', left: '-9999px', top: '0', width: '800px', backgroundColor: 'white', padding: '10px 20px', boxSizing: 'border-box' }} ref={permitPdfTemplateRef}>
                    <h1 style={{ fontSize: '28px', fontWeight: '900', textAlign: 'center', marginBottom: '20px', color: '#000', letterSpacing: '-1px' }}>맨홀공간 작업(계획)허가서</h1>
                    
                    <div style={{ display: 'flex', flexWrap: 'wrap', marginBottom: '15px', fontSize: '14px', color: '#000', lineHeight: '1.6' }}>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 신청인:</strong> {formData.sender}</div>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 작업수행시간:</strong> {formData.workDate}</div>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 작업장소(위치):</strong> {formData.location}</div>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 작업내용:</strong> {formData.workContent}</div>
                      <div style={{ width: '100%', marginBottom: '4px' }}><strong>ㅇ 내부 연락방법:</strong> {formData.representative} / {formData.contact}</div>
                    </div>

                    <div style={{ padding: '8px', backgroundColor: '#fffbeb', border: '1px solid #fcd34d', marginBottom: '15px', fontSize: '13px', color: '#92400e', fontWeight: 'bold' }}>
                      작업허가는 최대 8시간까지만 유효합니다. 유해가스의 농도에 따라서 출입시간에 제한이 있을 수도 있습니다. 이 허가서는 지정된 장소와 시간에 대해 1회만 유효합니다.<br/>
                      <span style={{color: '#000'}}>위 공간에서의 작업을 다음의 조건하에서만 허가함.</span>
                    </div>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>1. 맨홀공간 정보요약</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', marginBottom: '15px', fontSize: '13px', textAlign: 'center' }}>
                      <tbody>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>맨홀 형태</th>
                          <td style={{ border: '1px solid black', padding: '6px', width: '30%' }}>{shapeName}</td>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>맨홀 체적</th>
                          <td style={{ border: '1px solid black', padding: '6px', width: '30%' }}>{volume.toFixed(2)} m³<br/><span style={{fontSize:'11px', color:'#555'}}>{shapeDetails}</span></td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>2. 맨홀 안전작업 체크리스트</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', marginBottom: '15px', fontSize: '12px', textAlign: 'center' }}>
                      <thead>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '4px' }}>체크리스트(자율점검)</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '4px', width: '12%' }}>예</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '4px', width: '12%' }}>아니오</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[
                          { q: q1, title: '1. 해당 밀폐공간 위치파악, 유해위험요인 파악', fix: '작업 전 해당 장소의 위치와 위험요인을 명확히 파악하세요.' },
                          { q: q2, title: '2. 작업허가서 발급 및 작업장 게시', fix: '작업 전 반드시 허가서를 발급받고 작업장에 게시하세요.' },
                          { q: q3, title: '3. 출입금지 표지 게시', fix: '인근 잘 보이는 곳에 출입금지 표지를 즉시 게시하세요.' },
                          { q: q4, title: '4. 산소 및 유해가스 작업전·중 측정', fix: '산소 및 유해가스를 작업 전은 물론 작업 중에도 지속적으로 측정하세요.' },
                          { q: q5, title: '5. 환기팬 가동 및 성능 확인', fix: '보유 배풍기 성능을 파악하고, 작업 전/중 환기를 지속적으로 실시하세요.' },
                          { q: q6, title: '6. 호흡용보호구 비치', fix: '밀폐공간 작업용 송기마스크 등 호흡용보호구를 반드시 비치하세요.' },
                          { q: q7, title: '7. 감시인 배치 및 비상체계 마련', fix: '전담 감시인을 배치하고 내외부 연락 및 비상 조치 체계를 마련하세요.' },
                          { q: q8, title: '8. 입·퇴장 인원 점검', fix: '출입 시 근로자 인원을 철저히 점검하여 인원 누락을 방지하세요.' },
                          { q: q9, title: '9. 안전방법(TBM) 교육', fix: '작업 전 작업자와 감시인에게 안전한 작업방법(TBM)을 교육하세요.' },
                          { q: q10, title: '10. 구조장비 설치/구조훈련', fix: '삼각대 등 구조장비를 설치하고 사전에 긴급구조훈련을 실시하세요.' }
                        ].map((item, i) => (
                          <React.Fragment key={i}>
                            <tr>
                              <td style={{ border: '1px solid black', padding: '3px 8px', textAlign: 'left' }}>{item.title}</td>
                              <td style={{ border: '1px solid black', padding: '3px', color: '#2563EB', fontWeight: item.q==='yes'?'bold':'normal' }}>{item.q === 'yes' ? 'O' : ''}</td>
                              <td style={{ border: '1px solid black', padding: '3px', color: '#DC2626', fontWeight: item.q==='no'?'bold':'normal' }}>{item.q === 'no' ? 'O' : ''}</td>
                            </tr>
                            {item.q === 'no' && (
                              <tr>
                                <td colSpan="3" style={{ border: '1px solid black', padding: '3px 8px', textAlign: 'left', color: '#DC2626', fontSize: '11px', backgroundColor: '#fef2f2' }}>
                                  <strong>[조치사항]</strong> {item.fix}
                                </td>
                              </tr>
                            )}
                          </React.Fragment>
                        ))}
                      </tbody>
                    </table>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>3. 산소 및 유해가스 농도 측정 결과</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', marginBottom: '15px', fontSize: '13px', textAlign: 'center' }}>
                      <thead>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>측정물질명</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>측정농도</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>측정자</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '35%' }}>허가기준 농도</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>산소 (O₂)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{o2} %</td>
                          <td rowSpan="4" style={{ border: '1px solid black', padding: '4px', verticalAlign: 'middle', fontWeight: 'bold' }}>{measurerName}</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>18% 이상 23.5% 미만</td>
                        </tr>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>황화수소 (H₂S)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{h2s} ppm</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>10ppm 이하</td>
                        </tr>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>이산화탄소 (CO₂)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{co2} ppm</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>1.5% 미만 (15,000ppm)</td>
                        </tr>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>일산화탄소 (CO)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{co} ppm</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>30ppm 미만</td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>4. 특별조치필요사항</h3>
                    <div style={{ border: '1.5px solid black', padding: '10px', minHeight: '40px', marginBottom: '15px', fontSize: '13px', whiteSpace: 'pre-wrap', textAlign: 'left' }}>
                      {formData.remarks || '특이사항 없음'}
                    </div>

                    <div style={{ display: 'flex', gap: '20px' }}>
                      <div style={{ flex: '1' }}>
                        <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>5. 작업자 명단</h3>
                        <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', fontSize: '13px', textAlign: 'center' }}>
                          <thead>
                            <tr>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>구분</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '35%' }}>성명</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '40%' }}>서명</th>
                            </tr>
                          </thead>
                          <tbody>
                            {workers.map((w, i) => (
                              <tr key={i}>
                                <td style={{ border: '1px solid black', padding: '6px' }}>{w.type}</td>
                                <td style={{ border: '1px solid black', padding: '6px' }}>{w.name}</td>
                                <td style={{ border: '1px solid black', padding: '6px' }}>
                                  {w.signature ? <img src={w.signature} style={{ maxHeight: '25px', maxWidth: '80px', objectFit: 'contain' }} alt="서명" /> : (w.name || '(서명)')}
                                </td>
                              </tr>
                            ))}
                            {workers.length < 3 && Array(3 - workers.length).fill().map((_, i) => (
                              <tr key={'empty'+i}>
                                <td style={{ border: '1px solid black', padding: '13px' }}></td><td style={{ border: '1px solid black' }}></td><td style={{ border: '1px solid black' }}></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      
                      <div style={{ flex: '1' }}>
                        <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>6. 최종 허가자</h3>
                        <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', fontSize: '13px', textAlign: 'center' }}>
                          <thead>
                            <tr>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>부서</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>직책</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>성명</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>서명</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>{approver.dept}</td>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>{approver.title}</td>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>{approver.name}</td>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>
                                {approver.signature ? (
                                   <img src={approver.signature} style={{ maxHeight: '35px', maxWidth: '80px', objectFit: 'contain' }} alt="서명" />
                                ) : approver.signed ? (
                                   <div>
                                     <div style={{ color: '#2563EB', fontWeight: 'bold', fontSize: '13px' }}>{approver.name}</div>
                                     <div style={{ fontSize: '11px', fontWeight: 'bold', color: '#000', marginTop: '2px' }}>승인완료</div>
                                   </div>
                                ) : (approver.name || '(서명)')}
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                  );
                })()}
              </div>
            )}

            {/* 그림판(Canvas) 서명 모달 Overlay */}
            {signTarget && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl flex flex-col">
                  <h3 className="text-xl font-black text-slate-800 mb-4 text-center">
                    {signTarget.type === 'worker' ? '작업자 직접 서명' : '최종 허가자 직접 서명'}
                  </h3>
                  <div className="bg-slate-50 border-2 border-slate-300 border-dashed rounded-xl mb-4 overflow-hidden touch-none">
                    <canvas 
                      ref={canvasRef}
                      width={400} 
                      height={200} 
                      style={{ width: '100%', height: '200px', touchAction: 'none' }}
                      className="cursor-crosshair bg-white"
                      onMouseDown={startDrawing}
                      onMouseMove={draw}
                      onMouseUp={stopDrawing}
                      onMouseLeave={stopDrawing}
                      onTouchStart={startDrawing}
                      onTouchMove={draw}
                      onTouchEnd={stopDrawing}
                    />
                  </div>
                  <div className="flex gap-2">
                    <button onClick={handleClearSignature} className="flex-1 py-3.5 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-95 transition-all text-sm">지우기</button>
                    <button onClick={() => setSignTarget(null)} className="flex-1 py-3.5 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-95 transition-all text-sm">취소</button>
                    <button onClick={handleSaveSignature} className="flex-[2] py-3.5 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-700 active:scale-95 transition-all text-sm">저장하기</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
