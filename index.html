<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>맨홀작업 - 안전지킴이앱</title>
  
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="맨홀작업 - 안전지킴이앱" />
  <meta property="og:description" content="맨홀 작업 전 사전일정 송부 및 안전점검을 지원합니다." />
  <meta property="og:image" content="https://ventilation-assessment.vercel.app/manhole.jpg" />
  <meta property="og:url" content="https://ventilation-assessment.vercel.app" />

  <script>
    var userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.indexOf("kakaotalk") > -1) {
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    }
  </script>

  <script>
    var iconFileName = "manhole.jpg"; 
    var manifestData = {
      "name": "맨홀지킴이",
      "short_name": "맨홀지킴이",
      "start_url": "./",
      "display": "standalone",
      "background_color": "#F4F7FB",
      "theme_color": "#2563EB",
      "icons": [
        { "src": iconFileName, "sizes": "192x192", "type": "image/jpeg" },
        { "src": iconFileName, "sizes": "512x512", "type": "image/jpeg" }
      ]
    };
    var manifestStr = JSON.stringify(manifestData);
    var manifestDataUrl = "data:application/json;charset=utf-8," + encodeURIComponent(manifestStr);
    var manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = manifestDataUrl;
    document.head.appendChild(manifestLink);
    var appleTouchIcon = document.createElement('link');
    appleTouchIcon.rel = 'apple-touch-icon';
    appleTouchIcon.href = iconFileName;
    document.head.appendChild(appleTouchIcon);
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- html2canvas & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-[#F4F7FB] text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 기본값 및 초기화 로직 셋팅 ---
    const defaultFormData = {
      receiver: '', sender: '', companyName: '', representative: '',
      location: '', client: '', contact: '', workDate: '',
      workContent: '', otherInfo: '', remarks: '', inspector: ''
    };
    const defaultWorkers = [{ type: '작업자', name: '', confirmed: false }];
    const defaultApprover = { dept: '', title: '', name: '', phone: '', signed: false };

    // 가장 최근의 밤 10시 기준시간 타임스탬프 구하기
    const getMostRecent10PM = () => {
      const now = new Date();
      let tenPM = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 22, 0, 0, 0);
      if (now.getTime() < tenPM.getTime()) {
        tenPM.setDate(tenPM.getDate() - 1);
      }
      return tenPM.getTime();
    };

    // 로컬 스토리지 데이터 초기 로드 로직
    const getInitialState = (key, defaultVal) => {
      try {
        const savedTime = localStorage.getItem('manholeAppLastSaved');
        if (savedTime) {
          const recent10PM = getMostRecent10PM();
          if (parseInt(savedTime, 10) < recent10PM) {
            return defaultVal;
          }
        }
        const saved = localStorage.getItem('manholeAppData');
        if (saved) {
          const parsed = JSON.parse(saved);
          return parsed[key] !== undefined && parsed[key] !== null ? parsed[key] : defaultVal;
        }
      } catch (e) {
        console.error('Data load error', e);
      }
      return defaultVal;
    };


    function App() {
      // URL 파라미터를 읽어 원격 서명 페이지인지 확인
      const urlParams = new URLSearchParams(window.location.search);
      const isSignPage = urlParams.get('action') === 'sign';
      const signName = urlParams.get('name') || '책임자';
      const [remoteSigned, setRemoteSigned] = useState(false);

      const [step, setStep] = useState(1);
      
      const [formData, setFormData] = useState(() => getInitialState('formData', defaultFormData));
      
      const [fanCapacity, setFanCapacity] = useState(() => getInitialState('fanCapacity', ''));
      const [shape, setShape] = useState(() => getInitialState('shape', ''));
      const [width, setWidth] = useState(() => getInitialState('width', ''));
      const [length, setLength] = useState(() => getInitialState('length', ''));
      const [diameter, setDiameter] = useState(() => getInitialState('diameter', ''));
      const [height, setHeight] = useState(() => getInitialState('height', ''));
      const [comboRectWidth, setComboRectWidth] = useState(() => getInitialState('comboRectWidth', ''));
      const [comboRectLength, setComboRectLength] = useState(() => getInitialState('comboRectLength', ''));
      const [comboRectHeight, setComboRectHeight] = useState(() => getInitialState('comboRectHeight', ''));
      const [comboCylDiameter, setComboCylDiameter] = useState(() => getInitialState('comboCylDiameter', ''));
      const [comboCylHeight, setComboCylHeight] = useState(() => getInitialState('comboCylHeight', ''));

      const [q1, setQ1] = useState(() => getInitialState('q1', null));
      const [q2, setQ2] = useState(() => getInitialState('q2', null));
      const [q3, setQ3] = useState(() => getInitialState('q3', null));
      const [q4, setQ4] = useState(() => getInitialState('q4', null));
      const [q5, setQ5] = useState(() => getInitialState('q5', null));
      const [q6, setQ6] = useState(() => getInitialState('q6', null));
      const [q7, setQ7] = useState(() => getInitialState('q7', null));
      const [q8, setQ8] = useState(() => getInitialState('q8', null));
      const [q9, setQ9] = useState(() => getInitialState('q9', null));
      const [q10, setQ10] = useState(() => getInitialState('q10', null));

      const [calDate, setCalDate] = useState(() => getInitialState('calDate', ''));
      const [o2, setO2] = useState(() => getInitialState('o2', ''));
      const [h2s, setH2S] = useState(() => getInitialState('h2s', ''));
      const [co2, setCO2] = useState(() => getInitialState('co2', ''));
      const [co, setCO] = useState(() => getInitialState('co', ''));

      const [workers, setWorkers] = useState(() => getInitialState('workers', defaultWorkers));
      const [approver, setApprover] = useState(() => getInitialState('approver', defaultApprover));
      
      const formRef = useRef(null);
      const pdfTemplateRef = useRef(null);
      const permitPdfTemplateRef = useRef(null);
      const resultRef = useRef(null);

      // --- 자동 저장 (Auto-save) 로직 ---
      useEffect(() => {
        const dataToSave = {
          formData, fanCapacity, shape, width, length, diameter, height,
          comboRectWidth, comboRectLength, comboRectHeight, comboCylDiameter, comboCylHeight,
          q1, q2, q3, q4, q5, q6, q7, q8, q9, q10,
          calDate, o2, h2s, co2, co, workers, approver
        };
        localStorage.setItem('manholeAppData', JSON.stringify(dataToSave));
        localStorage.setItem('manholeAppLastSaved', Date.now().toString());
      }, [formData, fanCapacity, shape, width, length, diameter, height, comboRectWidth, comboRectLength, comboRectHeight, comboCylDiameter, comboCylHeight, q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, calDate, o2, h2s, co2, co, workers, approver]);

      // --- 매일 PM 10:00 자동 초기화 감시 타이머 ---
      useEffect(() => {
        const checkResetInterval = setInterval(() => {
          const savedTime = localStorage.getItem('manholeAppLastSaved');
          if (savedTime) {
            const recent10PM = getMostRecent10PM();
            if (parseInt(savedTime, 10) < recent10PM) {
              performReset();
            }
          }
        }, 60000);
        return () => clearInterval(checkResetInterval);
      }, []);

      const performReset = () => {
        setFormData(defaultFormData);
        setFanCapacity(''); setShape(''); setWidth(''); setLength(''); setDiameter(''); setHeight('');
        setComboRectWidth(''); setComboRectLength(''); setComboRectHeight(''); setComboCylDiameter(''); setComboCylHeight('');
        setQ1(null); setQ2(null); setQ3(null); setQ4(null); setQ5(null); setQ6(null); setQ7(null); setQ8(null); setQ9(null); setQ10(null);
        setCalDate(''); setO2(''); setH2S(''); setCO2(''); setCO('');
        setWorkers(defaultWorkers);
        setApprover(defaultApprover);
        localStorage.removeItem('manholeAppData');
        localStorage.removeItem('manholeAppLastSaved');
      };

      const handleGoHome = () => {
        setStep(1);
        performReset();
      };

      const [showResetModal, setShowResetModal] = useState(false);
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showInstallInstructions, setShowInstallInstructions] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const getVolume = () => {
        if (shape === 'rect') {
          const w = parseFloat(width) || 0; const l = parseFloat(length) || 0; const h = parseFloat(height) || 0;
          return w * l * h;
        } else if (shape === 'cyl') {
          const d = parseFloat(diameter) || 0; const h = parseFloat(height) || 0;
          return (3.14 * Math.pow(d, 2) / 4) * h;
        } else if (shape === 'combo') {
          const rw = parseFloat(comboRectWidth) || 0; const rl = parseFloat(comboRectLength) || 0; const rh = parseFloat(comboRectHeight) || 0;
          const cd = parseFloat(comboCylDiameter) || 0; const ch = parseFloat(comboCylHeight) || 0;
          return (rw * rl * rh) + ((3.14 * Math.pow(cd, 2) / 4) * ch);
        }
        return 0;
      };

      const volume = getVolume();
      const fanHr = parseFloat(fanCapacity) || 0;
      const reqTotalFanCapacityHr = volume * 24; 
      const rawFanCount = fanHr > 0 ? reqTotalFanCapacityHr / (fanHr * 0.8) : 0;
      
      let displayFanCount = "0대";
      if (rawFanCount > 0) {
        displayFanCount = rawFanCount <= 1 ? "1대 이하" : rawFanCount.toFixed(1) + "대 이상";
      }

      const actualFanCount = Math.ceil(rawFanCount > 0 ? rawFanCount : 0);
      const effectiveAirflowMin = (actualFanCount * fanHr * 0.8) / 60;
      const rawVentTime = effectiveAirflowMin > 0 ? (volume * 10) / effectiveAirflowMin : 0;
      const ventTime = Math.max(Math.ceil(rawVentTime), 30); 
      const isMinimumForced = Math.ceil(rawVentTime) < 30 && effectiveAirflowMin > 0;

      const handleAddWorker = () => {
        setWorkers([...workers, { type: '작업자', name: '', confirmed: false }]);
      };
      const handleWorkerChange = (index, field, value) => {
        const newWorkers = [...workers];
        newWorkers[index][field] = value;
        setWorkers(newWorkers);
      };
      const handleRemoveWorker = (index) => {
        setWorkers(workers.filter((_, i) => i !== index));
      };

      const handleSendPermitSMS = () => {
        if (!approver.phone) {
          alert('최종 허가자의 전화번호를 입력해주세요.');
          return;
        }
        
        const message = `[맨홀작업 안전지킴이]  
작업허가서 승인 요청입니다.
- 작업장소 : ${formData.location || '-'}
- 작업내용 : ${formData.workContent || '-'}
- 작업수행시간 : ${formData.workDate || '-'}
- 산소및유해가스측정결과 : O2 ${o2||'-'}%, H2S ${h2s||'-'}ppm, CO2 ${co2||'-'}ppm, CO ${co||'-'}ppm

허가서 내용 확인 후 담당자 태블릿에서 직접 승인을 진행해 주시기 바랍니다.`;

        window.location.href = `sms:${approver.phone}?body=${encodeURIComponent(message)}`;
      };

      const saveAsPDF = () => {
        if (!pdfTemplateRef.current) return;
        if (!window.html2canvas || !window.jspdf) {
          alert('PDF 기능을 불러오는 중입니다. 잠시 후 시도해주세요.'); return;
        }
        const { jsPDF } = window.jspdf;
        pdfTemplateRef.current.style.display = 'block';

        window.html2canvas(pdfTemplateRef.current, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true })
        .then(canvas => {
          pdfTemplateRef.current.style.display = 'none';
          const imgData = canvas.toDataURL('image/jpeg', 1.0);
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const imgHeight = (canvas.height * pdfWidth) / canvas.width;
          pdf.addImage(imgData, 'JPEG', 0, 15, pdfWidth, imgHeight);
          const date = new Date();
          const dateStr = `${date.getFullYear().toString().slice(-2)}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
          pdf.save(`맨홀작업일정_사전송부_${dateStr}.pdf`);
        }).catch(err => {
          pdfTemplateRef.current.style.display = 'none';
          alert('PDF 저장 중 오류가 발생했습니다.');
        });
      };

      const savePermitAsPDF = () => {
        if (!permitPdfTemplateRef.current) return;
        if (!window.html2canvas || !window.jspdf) {
          alert('PDF 기능을 불러오는 중입니다. 잠시 후 시도해주세요.'); return;
        }
        const { jsPDF } = window.jspdf;
        permitPdfTemplateRef.current.style.display = 'block';

        window.html2canvas(permitPdfTemplateRef.current, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true })
        .then(canvas => {
          permitPdfTemplateRef.current.style.display = 'none';
          const imgData = canvas.toDataURL('image/jpeg', 1.0);
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = pdf.internal.pageSize.getHeight();
          
          let imgHeight = (canvas.height * pdfWidth) / canvas.width;
          if (imgHeight > pdfHeight) {
             imgHeight = pdfHeight;
          }

          pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, imgHeight);
          const date = new Date();
          const dateStr = `${date.getFullYear().toString().slice(-2)}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
          pdf.save(`맨홀공간_작업계획허가서_${dateStr}.pdf`);
        }).catch(err => {
          permitPdfTemplateRef.current.style.display = 'none';
          alert('PDF 저장 중 오류가 발생했습니다.');
        });
      };

      const downloadGuideImage = () => {
        try {
          const link = document.createElement('a');
          link.href = '동영상촬영가이드.jpg';
          link.download = '맨홀작업_안전조치_동영상_촬영가이드.jpg';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (error) {
          alert('다운로드 중 오류가 발생했습니다.');
        }
      };

      const downloadOneCallService = () => {
        try {
          const link = document.createElement('a');
          link.href = '원콜서비스.pdf';
          link.download = '원콜서비스_안내.pdf';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (error) {
          alert('다운로드 중 오류가 발생했습니다.');
        }
      };

      const saveAsImage = () => {
        if (!resultRef.current) return;
        window.html2canvas(resultRef.current, { scale: 1.5, backgroundColor: '#F8FAFC' }).then(canvas => {
          const link = document.createElement('a');
          link.download = `환기계산결과_${new Date().getTime()}.jpg`;
          link.href = canvas.toDataURL('image/jpeg', 0.7);
          link.click();
        });
      };

      useEffect(() => {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        const hideUntil = localStorage.getItem('hideInstallPromptUntil');
        const now = new Date().getTime();

        if (!isStandalone && (!hideUntil || now > parseInt(hideUntil, 10))) {
          setShowInstallBanner(true);
        }

        const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const dismissInstall = () => {
        setShowInstallBanner(false);
        localStorage.setItem('hideInstallPromptUntil', new Date().getTime() + 30 * 60 * 1000);
      };

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') setShowInstallBanner(false);
          setDeferredPrompt(null);
        } else {
          setShowInstallBanner(false); setShowInstallInstructions(true);
        }
      };

      const nextStep = () => setStep((s) => s + 1);
      const prevStep = () => setStep((s) => s - 1);

      return (
        <div className="min-h-screen bg-[#F4F7FB] flex justify-center font-sans text-slate-800 selection:bg-blue-200 sm:p-4 md:p-8">
          <div className="w-full max-w-md md:max-w-3xl lg:max-w-5xl bg-white sm:rounded-[2.5rem] sm:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)] min-h-[100dvh] sm:min-h-[850px] flex flex-col relative overflow-hidden sm:border border-slate-100/50 transition-all duration-500">
            
            {/* 초기화 재확인 모달창 */}
            {showResetModal && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-300">
                <div className="bg-white rounded-[2rem] p-6 md:p-8 w-full max-w-sm shadow-2xl relative animate-in zoom-in-95 duration-300 text-center">
                  <div className="w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                  </div>
                  <h3 className="text-xl md:text-2xl font-extrabold text-slate-900 mb-2">데이터 초기화</h3>
                  <p className="text-slate-500 text-sm md:text-base font-medium mb-6 leading-relaxed">입력하신 모든 내용이 초기화됩니다.<br/>정말 초기화하시겠습니까?</p>
                  <div className="flex gap-3">
                    <button onClick={() => setShowResetModal(false)} className="flex-1 py-3.5 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">취소</button>
                    <button onClick={() => { performReset(); setShowResetModal(false); }} className="flex-1 py-3.5 rounded-xl font-bold bg-rose-600 text-white shadow-md shadow-rose-500/20 hover:bg-rose-700 transition-colors">예</button>
                  </div>
                </div>
              </div>
            )}

            {/* 상단 프로그레스 바 (2~10단계 통일 적용) */}
            {step > 1 && step <= 10 && (
              <header className="px-6 py-5 flex items-center bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100/80 justify-between">
                <button onClick={prevStep} className="p-2 -ml-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95 shrink-0">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" /></svg>
                </button>
                <div className="flex-1 flex items-center px-4 md:px-10">
                  <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                    <div className="bg-blue-600 h-full rounded-full transition-all duration-500 ease-out" style={{ width: `${((step - 1) / 9) * 100}%` }}></div>
                  </div>
                  <span className="ml-3 text-xs font-bold text-slate-400 whitespace-nowrap">{step - 1} / 9</span>
                </div>
                <button onClick={nextStep} disabled={step === 10} className={`p-2 -mr-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95 shrink-0 ${step === 10 ? 'opacity-0 cursor-default' : 'opacity-100'}`}>
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" /></svg>
                </button>
              </header>
            )}

            {/* Step 1 */}
            {step === 1 && (
              <div className="flex flex-col flex-1 pb-6 pt-10 animate-in fade-in duration-700 ease-out h-full max-h-[100dvh] relative md:justify-center">
                <div className="text-center w-full space-y-3 px-6 mb-6 shrink-0 mt-4 md:mt-0">
                  <span className="inline-block py-1.5 px-4 rounded-full bg-blue-50 text-blue-600 text-xs font-bold tracking-wide mb-1">안전보건공단 KOSHA GUIDE 기준</span>
                  <h1 className="text-[2.2rem] md:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight transition-all">맨홀작업 안전조치 <br className="md:hidden"/><span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">맨홀지킴이</span></h1>
                  <p className="text-slate-500 text-sm md:text-base mt-3 font-medium px-4 md:max-w-lg md:mx-auto transition-all">맨홀 작업 사전일정 송부 및 작업 전 필수적인 맨홀 안전점검을 지원합니다.</p>
                </div>
                <div className="w-full relative shrink-0 md:max-w-2xl md:mx-auto md:rounded-3xl md:overflow-hidden md:shadow-sm md:border md:border-slate-100 transition-all">
                  <div className="w-full aspect-[4/3] md:aspect-[21/9] relative overflow-hidden bg-white shadow-sm border-y border-slate-100 md:border-none">
                    <img src="image_bf5001.jpg" alt="환기 예시 아이콘" className="absolute inset-0 w-full h-full object-contain p-8 md:p-12 transition-all" />
                  </div>
                </div>
                <div className="px-6 flex-1 flex flex-col justify-center my-auto w-full max-w-sm md:max-w-md mx-auto min-h-[100px] relative z-20">
                  <button onClick={nextStep} className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-[1.15rem] md:py-5 rounded-2xl md:rounded-3xl shadow-xl hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg md:text-xl relative z-30">사전송부 및 평가 시작</button>
                </div>
                <div className="w-full shrink-0 flex flex-col items-center justify-end opacity-90 px-6 pb-4 md:absolute md:bottom-6 md:left-0 md:right-0 pointer-events-none z-10">
                  <img src="image_bfaefe.png" alt="하단 로고" className="h-10 sm:h-12 object-contain" />
                </div>
              </div>
            )}

            {/* Step 2 */}
            {step === 2 && (
              <div className="flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out bg-[#F8FAFC]">
                <div ref={formRef} className="p-6 pb-4 bg-white flex-1 overflow-y-auto custom-scrollbar">
                  <div className="mb-6 text-center border-b-2 border-slate-800 pb-4">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight transition-all">맨홀 작업 일정 사전송부 서식</h2>
                  </div>
                  <div className="space-y-1 md:grid md:grid-cols-2 md:gap-x-10 md:gap-y-2 md:space-y-0 transition-all">
                    {[
                      { num: '1', label: '수신자', name: 'receiver', placeholder: '입력하세요' },
                      { num: '2', label: '발신자', name: 'sender', placeholder: '입력하세요' },
                      { num: '3', label: '사업장명(현장명)', name: 'companyName', placeholder: '입력하세요' },
                      { num: '4', label: '대표자(현장책임자)', name: 'representative', placeholder: '입력하세요' },
                      { num: '5', label: '소재지(맨홀위치)', name: 'location', placeholder: '상세 위치 입력' },
                      { num: '6', label: '발주자', name: 'client', placeholder: '입력하세요' },
                      { num: '7', label: '현장 연락처', name: 'contact', placeholder: '핸드폰 등 입력' },
                      { num: '8', label: '작업 일시', name: 'workDate', placeholder: '예: 2024.10.12 09:00~18:00' },
                      { num: '9', label: '작업 내용', name: 'workContent', placeholder: '구체적인 작업 내용 입력' },
                      { num: '10', label: '기타(보호구 등)', name: 'otherInfo', placeholder: '보유장비, 특기사항 등' },
                      { num: '11', label: '특이사항', name: 'remarks', placeholder: '특이사항 입력' },
                      { num: '12', label: '입회자(담당공무원)', name: 'inspector', placeholder: '입력하세요' }
                    ].map((item, idx) => (
                      <div key={item.name} className={`flex items-start border-b border-slate-300 py-3 hover:bg-slate-50/50 transition-colors ${(item.num === '11' || item.num === '12') ? 'md:col-span-2' : ''}`}>
                        <span className="font-bold text-slate-700 text-[13.5px] md:text-[14.5px] w-[145px] md:w-[160px] shrink-0 mt-0.5">{item.num}. {item.label}</span>
                        <span className="text-slate-400 mr-2 mt-0.5">:</span>
                        <textarea name={item.name} value={formData[item.name]} onChange={(e) => { handleInputChange(e); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }} rows="1" className="flex-1 w-full px-1 py-0.5 outline-none text-[13.5px] md:text-[14.5px] font-medium focus:bg-blue-50/50 bg-transparent text-slate-900 resize-none overflow-hidden break-words whitespace-pre-wrap" placeholder={item.placeholder} />
                      </div>
                    ))}
                  </div>
                  <div className="mt-6 text-right pr-2 pb-4">
                    <span className="text-[11px] md:text-sm text-slate-400">※ 본 서식은 맨홀 작업 전 필수 송부용입니다.</span>
                  </div>
                </div>

                <div style={{ display: 'none', position: 'absolute', left: '-9999px', top: '0', width: '800px', backgroundColor: 'white', padding: '10px 40px 40px 40px', boxSizing: 'border-box' }} ref={pdfTemplateRef}>
                  <div style={{ textAlign: 'center', marginBottom: '15px', marginTop: '35px', fontSize: '13.5px', fontWeight: 'bold', color: '#DC2626', lineHeight: '1.4' }}>
                    『맨홀 질식재해 예방 3대 안전수칙』 준수<br/>
                    ① 산소 및 유해가스 측정! &nbsp; ② 충분한 환기! &nbsp; ③ 호흡보호구(송기마스크 등) 착용!
                  </div>
                  <h1 style={{ fontSize: '32px', fontWeight: 'bold', textAlign: 'center', marginBottom: '25px', color: '#000' }}>맨홀 작업 일정 사전송부</h1>
                  <div style={{ textAlign: 'left', marginBottom: '20px', fontSize: '18px', color: '#000', lineHeight: '1.8' }}>
                    <div><strong>수신자:</strong> {formData.receiver}</div>
                    <div style={{ marginTop: '10px' }}><strong>발신자:</strong> {formData.sender}</div>
                  </div>
                  <table style={{ width: '100%', borderCollapse: 'collapse', border: '2px solid black', color: '#000', fontSize: '16px', tableLayout: 'fixed' }}>
                    <tbody>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', width: '20%', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>사업장명<br/>(현장명)</th>
                        <td style={{ border: '1px solid black', padding: '12px', width: '30%', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.companyName}</td>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', width: '20%', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>대표자<br/>(현장 책임자)</th>
                        <td style={{ border: '1px solid black', padding: '12px', width: '30%', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.representative}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>소재지<br/>(맨홀위치)</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.location}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>발주자</th>
                        <td style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.client}</td>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>현장 연락처<br/>(핸드폰 등)</th>
                        <td style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.contact}</td>
                      </tr>
                      <tr>
                        <th rowSpan="3" style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>작업정보</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '24px 12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}><strong>1. 작업 일시:</strong> {formData.workDate}</td>
                      </tr>
                      <tr>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '30px 12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}><strong>2. 작업 내용:</strong> {formData.workContent}</td>
                      </tr>
                      <tr>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '30px 12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}><strong>3. 기타:</strong> {formData.otherInfo}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>특이사항</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.remarks}</td>
                      </tr>
                      <tr>
                        <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '12px', textAlign: 'center', verticalAlign: 'middle', fontWeight: 'bold' }}>입회자<br/>(담당 공무원)</th>
                        <td colSpan="3" style={{ border: '1px solid black', padding: '12px', wordBreak: 'break-word', whiteSpace: 'pre-wrap' }}>{formData.inspector}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div style={{ marginTop: '12px', fontSize: '14.5px', fontWeight: 'bold', color: '#2563EB', textAlign: 'left' }}>
                    ※ 관할 노동관서와 협의하여 자유로운 서식으로 오픈채팅방, 문자 등으로 송부 가능
                  </div>
                </div>

                <div className="mt-auto px-6 pt-4 pb-6 bg-[#F8FAFC] space-y-3 shrink-0 border-t border-slate-100 flex flex-col md:px-10">
                  <div className="flex flex-col md:flex-row gap-3 w-full">
                    <button onClick={saveAsPDF} className="w-full md:w-1/2 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm md:text-base flex items-center justify-center gap-2">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                      맨홀 작업 일정 다운로드
                    </button>
                    <button onClick={nextStep} className="w-full md:w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg md:text-xl">
                      가이드 확인 진행
                    </button>
                  </div>
                  <button onClick={() => setShowResetModal(true)} className="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold py-3.5 rounded-2xl transition-all active:scale-[0.98] text-sm md:text-base flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    입력 내용 초기화
                  </button>
                </div>
              </div>
            )}

            {/* Step 3 */}
            {step === 3 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out h-full overflow-hidden">
                <div className="p-6 pb-4 shrink-0 bg-white border-b border-slate-100 shadow-sm z-10 relative text-center">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">질식사고예방 사전준비 사항</h2>
                  <p className="text-slate-500 text-sm md:text-base font-medium leading-relaxed">작업 전 필수 안전조치 및 동영상 촬영 가이드 확인한 후 휴대폰으로 촬영하세요.</p>
                </div>

                <div className="flex-1 overflow-y-auto custom-scrollbar p-6 bg-slate-50 flex flex-col justify-start items-center">
                  <div className="w-full max-w-3xl rounded-2xl overflow-hidden shadow-md border border-slate-200 bg-white">
                    <img src="image1.jpg" alt="질식사고예방 사전준비 사항" className="w-full h-auto max-h-[60vh] object-contain block mx-auto" />
                  </div>
                </div>

                <div className="p-6 pt-4 pb-6 bg-white border-t border-slate-100 shrink-0 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] z-10 relative space-y-3 md:flex md:space-y-0 md:gap-4 md:justify-center md:px-10">
                  <button onClick={downloadGuideImage} className="w-full md:w-1/3 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>가이드 다운로드
                  </button>
                  <input type="file" accept="video/*" capture="environment" id="videoCapture" className="hidden" />
                  <label htmlFor="videoCapture" className="w-full md:w-1/3 bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm flex items-center justify-center gap-2 cursor-pointer m-0">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>동영상 촬영하기
                  </label>
                  <button onClick={nextStep} className="w-full md:w-1/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 active:scale-[0.98] transition-all duration-300 text-lg">확인완료/다음</button>
                </div>
              </div>
            )}

            {/* Step 4 */}
            {step === 4 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out text-center overflow-y-auto custom-scrollbar md:px-10">
                <div className="mb-6 md:mb-10">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">맨홀 안전작업 체크리스트</h2>
                  <p className="text-slate-500 text-sm md:text-base font-medium leading-relaxed">안전한 맨홀 작업을 위해 10가지 항목의 자율점검을 실시하세요.</p>
                </div>
                <div className="space-y-4 pb-4 text-left md:grid md:grid-cols-2 md:gap-5 md:space-y-0 transition-all">
                  {[
                    { qState: q1, setFn: setQ1, num: '1', text: '해당 밀폐공간 위치파악, 유해위험요인 파악 하셨나요?' },
                    { qState: q2, setFn: setQ2, num: '2', text: '안전조치 사전확인을 위한 작업허가서 발급 및 작업장 게시 하셨나요?' },
                    { qState: q3, setFn: setQ3, num: '3', text: '맨홀 밀폐공간 인근 잘보이는 곳에 출입금지 표지 게시 하셨나요?' },
                    { qState: q4, setFn: setQ4, num: '4', text: <>산소 및 유해가스 측정을 작업 전, <span className="text-red-600 font-black">작업 중에도</span> 하셨나요?</> },
                    { qState: q5, setFn: setQ5, num: '5', text: <>맨홀 작업 전, 작업 중 지속적으로 환기팬 가동 및 <span className="text-red-600 font-black">보유 환기팬 풍량(정압)을</span> 아시나요?</> },
                    { qState: q6, setFn: setQ6, num: '6', text: '송기마스크 등 호흡용보호구 비치 하셨나요?' },
                    { qState: q7, setFn: setQ7, num: '7', text: '감시인을 배치하여 내외부간 연락 및 비상시 조치할 수 있도록 하셨나요?' },
                    { qState: q8, setFn: setQ8, num: '8', text: '작업 전, 후 입장 및 퇴장 시 근로자 인원 점검을 하셨나요?' },
                    { qState: q9, setFn: setQ9, num: '9', text: '작업 전 작업자 및 감시인에게 안전한 작업방법(TBM) 교육을 실시하셨나요?' },
                    { qState: q10, setFn: setQ10, num: '10', text: '구조장비 설치 및 긴급구조훈련을 실시하셨나요?' }
                  ].map((item, idx) => (
                    <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:border-blue-100 transition-colors flex flex-col justify-between">
                      <p className="font-bold text-slate-800 mb-4 text-sm md:text-base leading-snug"><span className="text-blue-600 mr-1">{item.num}.</span> {item.text}</p>
                      <div className="flex gap-2">
                        <button onClick={() => item.setFn('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${item.qState === 'yes' ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>예</button>
                        <button onClick={() => item.setFn('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${item.qState === 'no' ? 'bg-rose-500 text-white border-rose-500 shadow-md shadow-rose-500/20' : 'bg-slate-50 text-slate-600 border-transparent hover:bg-slate-100'}`}>아니오</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="mt-auto pt-4 pb-2 bg-transparent shrink-0 md:max-w-md md:mx-auto w-full">
                  <button onClick={nextStep} disabled={!q1 || !q2 || !q3 || !q4 || !q5 || !q6 || !q7 || !q8 || !q9 || !q10} className="w-full bg-blue-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg">평가 리포트 확인</button>
                </div>
              </div>
            )}

            {/* Step 5 */}
            {step === 5 && (
              <div className="p-6 flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar md:px-10">
                <div className="mb-6 md:mb-10 text-center">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-2 tracking-tight transition-all">자율점검 평가 리포트</h2>
                  <p className="text-slate-500 text-sm md:text-base font-medium leading-relaxed">점검결과에 따른 조치사항을 반드시 준수하세요.</p>
                </div>
                
                <div className="space-y-3 mb-6 md:grid md:grid-cols-2 md:gap-5 md:space-y-0 transition-all">
                  {[
                    { q: q1, title: '유해위험요인 파악', pass: '해당 공간의 위치와 위험요인을 정확히 파악했습니다.', fail: '작업 전 해당 장소의 위치와 위험요인을 명확히 파악하세요.' },

                <div className="space-y-8 md:grid md:grid-cols-2 md:gap-10 md:space-y-0 transition-all">
                  <div>
                    <h3 className="font-bold text-slate-800 text-base md:text-lg mb-4 flex items-center gap-2"><span className="bg-blue-100 text-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-xs md:text-sm font-black">1</span> 작업 전 산소 및 유해가스농도 측정결과</h3>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                      
                      <div className="flex flex-col gap-2">
                        <label className="text-sm font-bold text-slate-700 ml-1">검교정일자</label>
                        <input type="date" value={calDate} onChange={e => setCalDate(e.target.value)} className="w-full p-4 border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none font-medium text-slate-700 bg-slate-50 transition-all" />
                      </div>

                      {[
                        { label: '산소 (O₂)', limit: '18.0% ~ 23.5% 미만', unit: '%', state: o2, setter: setO2, placeholder: '20.9' },
                        { label: '황화수소 (H₂S)', limit: '10ppm 미만', unit: 'ppm', state: h2s, setter: setH2S, placeholder: '0' },
                        { label: '이산화탄소 (CO₂)', limit: '1.5% 미만 (15,000ppm)', unit: 'ppm', state: co2, setter: setCO2, placeholder: '400' },
                        { label: '일산화탄소 (CO)', limit: '30ppm 미만', unit: 'ppm', state: co, setter: setCO, placeholder: '0' }
                      ].map((item, idx) => (
                        <div key={idx} className="flex flex-col gap-2 pb-4 border-b border-slate-50 last:border-0 last:pb-0">
                          <div className="flex justify-between items-end px-1">
                            <label className="text-sm font-bold text-slate-700">{item.label}</label>
                            <span className="text-[10px] md:text-[11px] font-bold text-blue-500 bg-blue-50 px-2.5 py-1 rounded-md">기준: {item.limit}</span>
                          </div>
                          <div className="relative group">
                            <input type="number" value={item.state} onChange={e => item.setter(e.target.value)} placeholder={item.placeholder} className="w-full text-xl md:text-2xl p-4 border border-slate-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none font-black text-slate-800 bg-slate-50 focus:bg-white transition-all placeholder:text-slate-300" />
                            <span className="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm md:text-base">{item.unit}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h3 className="font-bold text-slate-800 text-base md:text-lg mb-4 flex items-center gap-2"><span className="bg-blue-100 text-blue-600 w-6 h-6 rounded-full flex items-center justify-center text-xs md:text-sm font-black">2</span> 보유 풍량</h3>
                    <div className="space-y-4">
                      <div className={`transition-all duration-500 overflow-hidden ${parseFloat(fanCapacity) > 0 && parseFloat(fanCapacity) < 5000 ? 'max-h-40 opacity-100 mb-4' : 'max-h-0 opacity-0 mb-0'}`}>
                        <div className="p-4 bg-orange-50 border border-orange-100 rounded-2xl flex items-start gap-3">
                          <span className="text-orange-500 mt-0.5">⚠️</span>
                          <p className="text-xs md:text-[13px] text-orange-700 font-bold leading-relaxed">5,000 m³/hr 이상 풍량일 경우 정압 40mmAq 이상이 되므로, 풍량 5,000 m³/hr 이상의 배풍기를 구매하여 주시기 바랍니다.</p>
                        </div>
                      </div>
                      <div className="relative group">
                        <input type="number" value={fanCapacity} onChange={e => setFanCapacity(e.target.value)} placeholder="0" min="0" className="w-full text-3xl md:text-4xl p-6 md:p-8 border border-slate-200 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:outline-none transition-all font-black text-slate-800 bg-white placeholder:text-slate-300 shadow-sm" />
                        <span className="absolute right-6 top-1/2 -translate-y-1/2 text-slate-400 font-bold group-focus-within:text-blue-500 transition-colors md:text-lg">m³/hr</span>
                      </div>
                      <div className="mt-4 bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col items-center">
                        <span className="text-xs md:text-sm font-bold text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full mb-4 border border-slate-100">풍량 확인방법 예시</span>
                        <div className="w-full rounded-xl overflow-hidden border border-slate-100 bg-slate-50 flex justify-center p-2">
                          <img src="image_02e923.png" alt="배풍기 제원표 최대풍량 확인 예시" className="w-full h-auto object-contain max-h-48 md:max-h-56 rounded-lg" />
                        </div>
                        <p className="text-[11px] md:text-[13px] text-slate-400 font-medium mt-4 text-center leading-relaxed">장비 측면에 부착된 제원표(명판)에서<br/><strong className="text-slate-600">'최대풍량'</strong> 또는 <strong className="text-slate-600">'풍량'</strong> 항목을 확인해 주세요.</p>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-auto pt-8 pb-4 shrink-0 md:max-w-md md:mx-auto w-full">
                   <button 
                    onClick={nextStep} 
                    disabled={!fanCapacity || parseFloat(fanCapacity) <= 0 || !calDate || !o2 || !h2s || !co2 || !co} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/30 disabled:shadow-none active:scale-[0.98] transition-all duration-300 text-lg md:text-xl"
                  >
                    환기계산 결과 보기
                  </button>
                </div>
              </div>
            )}

            {/* Step 9 */}
            {step === 9 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in zoom-in-95 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="bg-white px-6 py-10 md:py-14 border-b border-slate-100 shadow-sm text-center shrink-0 relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-1 md:h-2 bg-gradient-to-r from-blue-500 via-cyan-400 to-emerald-400"></div>
                  <div className="inline-flex items-center justify-center w-16 h-16 md:w-20 md:h-20 bg-blue-50 text-blue-600 rounded-full mb-4 shadow-inner ring-4 ring-blue-50">
                    <svg className="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                  </div>
                  <h2 className="text-[1.75rem] md:text-4xl font-black text-slate-900 tracking-tight leading-tight transition-all">자율점검 완료</h2>
                </div>

                <div ref={resultRef} className="p-6 md:p-10 pt-8 bg-[#F8FAFC] flex-1">
                  
                  <div className="md:grid md:grid-cols-2 md:gap-8 space-y-5 md:space-y-0 mb-5 md:mb-8 transition-all">
                    <div className="bg-white border border-slate-100 rounded-2xl p-5 md:p-7 shadow-sm flex flex-col h-full">
                      <h3 className="text-sm md:text-base font-black text-blue-600 tracking-tight mb-4 ml-1">맨홀공간 정보 요약</h3>
                      <div className="space-y-2 md:space-y-3 text-sm md:text-base flex-1">
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-50"><span className="text-slate-500 font-medium">배풍기 풍량</span><span className="font-bold text-slate-800">{Number(fanCapacity).toLocaleString()} <span className="text-xs text-slate-400">m³/hr</span></span></div>
                        
                        <div className="flex justify-between items-start py-2 border-b border-slate-50">
                          <span className="text-slate-500 font-medium shrink-0 mr-4 mt-0.5">공간 형태</span>
                          <div className="font-bold text-slate-800 text-right leading-tight flex flex-col items-end whitespace-nowrap break-keep">
                            {shape === 'rect' && (
                              <>
                                <span>직사각형</span>
                                <span className="text-[11px] md:text-[13px] text-slate-500 font-medium mt-1">(가로: {width || 0}m, 세로: {length || 0}m, 높이: {height || 0}m)</span>
                              </>
                            )}
                            {shape === 'cyl' && (
                              <>
                                <span>원통형</span>
                                <span className="text-[11px] md:text-[13px] text-slate-500 font-medium mt-1">(지름: {diameter || 0}m, 높이: {height || 0}m)</span>
                              </>
                            )}
                            {shape === 'combo' && (
                              <>
                                <span>결합형</span>
                                <span className="text-[11px] md:text-[13px] text-slate-500 font-medium mt-1">(사각: 가로 {comboRectWidth || 0}m, 세로 {comboRectLength || 0}m, 높이 {comboRectHeight || 0}m</span>
                                <span className="text-[11px] md:text-[13px] text-slate-500 font-medium">원형: 지름 {comboCylDiameter || 0}m, 높이 {comboCylHeight || 0}m)</span>
                              </>
                            )}
                          </div>
                        </div>
                        
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-200"><span className="text-slate-500 font-medium">밀폐공간 체적</span><span className="font-bold text-slate-800">{volume.toFixed(2)} <span className="text-xs text-slate-400">m³</span></span></div>
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-50"><span className="text-slate-500 font-medium">작업 전 환기시간</span><span className="font-bold text-slate-800">{ventTime} <span className="text-xs text-slate-400">분 {isMinimumForced ? '(이상)' : ''}</span></span></div>
                        <div className="flex justify-between items-center py-1.5"><span className="text-slate-500 font-medium">작업 중 환기 가동 대수</span><span className="font-bold text-slate-800">{displayFanCount}</span></div>
                      </div>
                      
                      <div className="mt-5 space-y-2 shrink-0">
                        <div className="bg-slate-50 p-3 md:p-4 rounded-xl border border-slate-100">
                           <p className="text-[11px] md:text-xs text-slate-500 font-medium leading-relaxed">⚠️ 이론적 환기시간은 {Math.ceil(rawVentTime)}분이나, 작업 전 반드시 <strong className="text-slate-700">30분 이상 급기</strong>를 실시바랍니다. <br/><span className="text-[10px] md:text-[11px] text-slate-400">(※ 밀폐공간 체적 10배 급기, 배풍기 효율 80% 적용)</span></p>
                        </div>
                        {rawFanCount > 1 && (
                          <div className="bg-rose-50 p-3 md:p-4 rounded-xl border border-rose-100">
                            <p className="text-[11px] md:text-xs text-rose-600 font-extrabold leading-relaxed">⚠️ 현재 배풍기를 해당 대수만큼 추가하여 환기 실시 바랍니다. <br/><span className="text-[10px] md:text-[11px] text-rose-400/80">(※ 시간당 20회 환기 적용 기준)</span></p>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="bg-white border border-slate-100 rounded-2xl p-5 md:p-7 shadow-sm flex flex-col h-full">
                      <h3 className="text-sm md:text-base font-black text-blue-600 tracking-tight mb-4 ml-1">가스 측정결과 요약</h3>
                      <div className="space-y-2 md:space-y-3 text-sm md:text-base flex-1">
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-50"><span className="text-slate-500 font-medium">검교정일자</span><span className="font-bold text-slate-800">{calDate}</span></div>
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-50"><span className="text-slate-500 font-medium">산소 (O₂)</span><span className={`font-bold ${parseFloat(o2) < 18.0 || parseFloat(o2) >= 23.5 ? 'text-rose-600' : 'text-slate-800'}`}>{o2} <span className="text-xs text-slate-400">%</span></span></div>
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-50"><span className="text-slate-500 font-medium">황화수소 (H₂S)</span><span className={`font-bold ${parseFloat(h2s) >= 10 ? 'text-rose-600' : 'text-slate-800'}`}>{h2s} <span className="text-xs text-slate-400">ppm</span></span></div>
                        <div className="flex justify-between items-center py-1.5 border-b border-slate-50"><span className="text-slate-500 font-medium">이산화탄소 (CO₂)</span><span className={`font-bold ${parseFloat(co2) >= 15000 ? 'text-rose-600' : 'text-slate-800'}`}>{Number(co2).toLocaleString()} <span className="text-xs text-slate-400">ppm</span></span></div>
                        <div className="flex justify-between items-center py-1.5"><span className="text-slate-500 font-medium">일산화탄소 (CO)</span><span className={`font-bold ${parseFloat(co) >= 30 ? 'text-rose-600' : 'text-slate-800'}`}>{co} <span className="text-xs text-slate-400">ppm</span></span></div>
                      </div>
                      
                      <div className="mt-5 space-y-2 shrink-0">
                        {calDate && (new Date() - new Date(calDate)) / (1000 * 3600 * 24) > 365 && (
                          <div className="bg-rose-50 p-3 md:p-4 rounded-xl border border-rose-100">
                            <p className="text-[11px] md:text-xs text-rose-600 font-extrabold leading-relaxed">⚠️ 측정기는 1년 1회 이상 검교정하시기 바랍니다.</p>
                          </div>
                        )}
                        <div className="bg-blue-50 p-3 md:p-4 rounded-xl border border-blue-100">
                           <p className="text-[11px] md:text-xs text-blue-700 font-extrabold leading-relaxed">ℹ️ 맨홀 작업 중(시간당 1회 이상) 반드시 가스농도 측정 실시 바랍니다.</p>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="md:grid md:grid-cols-2 md:gap-8 space-y-5 md:space-y-0 transition-all">
                    <div className="bg-white border border-slate-100 rounded-2xl p-5 md:p-7 shadow-sm h-full">
                      <h3 className="text-sm md:text-base font-black text-blue-600 tracking-tight mb-3 ml-1">안전작업 체크리스트 결과</h3>
                      <div className="space-y-2 md:space-y-3 mt-4">
                        {[ 
                          { q: q1, title: '1. 공간 위치 및 유해위험 파악' }, 
                          { q: q2, title: '2. 작업허가서 발급 및 게시' }, 
                          { q: q3, title: '3. 출입금지 표지 게시' }, 
                          { q: q4, title: '4. 산소/유해가스 작업전·중 측정' },
                          { q: q5, title: '5. 환기팬 가동 및 성능 확인' },
                          { q: q6, title: '6. 호흡용보호구 비치' },
                          { q: q7, title: '7. 감시인 배치 및 비상체계' },
                          { q: q8, title: '8. 입·퇴장 인원 점검' },
                          { q: q9, title: '9. 안전방법(TBM) 교육' },
                          { q: q10, title: '10. 구조장비 설치/구조훈련' }
                        ].map((item, idx) => (
                          <div key={idx} className="flex justify-between items-center py-2 border-b border-slate-50 last:border-0">
                            <span className="text-slate-600 text-[13px] md:text-[14px] font-medium">{item.title}</span>
                            <span className={`text-[11px] md:text-[12px] font-extrabold px-2.5 py-1 rounded-md ${item.q === 'yes' ? 'bg-blue-50 text-blue-600' : 'bg-rose-50 text-rose-600'}`}>{item.q === 'yes' ? '예 (확인)' : '아니오 (부적정)'}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {(() => {
                      const isCalExpired = calDate && (new Date() - new Date(calDate)) / (1000 * 3600 * 24) > 365;
                      const isO2Bad = o2 !== '' && (parseFloat(o2) < 18.0 || parseFloat(o2) >= 23.5);
                      const isH2SBad = h2s !== '' && parseFloat(h2s) >= 10;
                      const isCO2Bad = co2 !== '' && parseFloat(co2) >= 15000;
                      const isCOBad = co !== '' && parseFloat(co) >= 30;
                      const hasIssues = fanHr < 5000 || q1 === 'no' || q2 === 'no' || q3 === 'no' || q4 === 'no' || q5 === 'no' || q6 === 'no' || q7 === 'no' || q8 === 'no' || q9 === 'no' || q10 === 'no' || isCalExpired || isO2Bad || isH2SBad || isCO2Bad || isCOBad;
                      
                      return (
                        <div className="h-full">
                          {hasIssues ? (
                            <div className="bg-rose-50 border border-rose-100 rounded-2xl p-5 md:p-7 shadow-sm h-full">
                              <h4 className="text-rose-800 font-bold text-sm md:text-base mb-4 flex items-center gap-2"><svg className="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>개선조치사항</h4>
                              <ul className="text-xs md:text-[13.5px] text-rose-700/90 leading-relaxed font-semibold space-y-3 list-disc pl-5">
                                {isCalExpired && <li><span className="font-extrabold">가스측정기 검교정 초과:</span> 기기의 검교정일이 1년을 초과했습니다. 재검교정 또는 정상 기기로 교체 후 측정하세요.</li>}
                                {isO2Bad && <li><span className="font-extrabold text-rose-600">산소 농도 불량:</span> 기준치(18.0~23.5%)를 벗어났습니다. 작업 전 환기를 충분히 실시하세요.</li>}
                                {isH2SBad && <li><span className="font-extrabold text-rose-600">황화수소 농도 초과:</span> 기준치(10ppm) 이상입니다. 중독 위험이 있으므로 강력한 환기가 필요합니다.</li>}
                                {isCO2Bad && <li><span className="font-extrabold text-rose-600">이산화탄소 농도 초과:</span> 기준치(1.5% / 15,000ppm) 이상입니다. 질식 위험이 있습니다.</li>}
                                {isCOBad && <li><span className="font-extrabold text-rose-600">일산화탄소 농도 초과:</span> 기준치(30ppm) 이상입니다. 중독 위험이 있습니다.</li>}
                                {fanHr < 5000 && <li><span className="font-extrabold">환기팬 성능 부족:</span> 덕트 내 압력 손실 방지를 위해 최소 풍량 5,000 m³/hr(또는 정압 40 mmAq) 이상의 장비를 사용하세요.</li>}
                                {q1 === 'no' && <li><span className="font-extrabold">유해위험 파악 미흡:</span> 작업 전 해당 장소의 위치와 위험요인을 명확히 파악하세요.</li>}
                                {q2 === 'no' && <li><span className="font-extrabold">작업허가서 미발급:</span> 작업 전 반드시 허가서를 발급받고 작업장에 게시하세요.</li>}
                                {q3 === 'no' && <li><span className="font-extrabold">표지 미게시:</span> 인근 잘 보이는 곳에 출입금지 표지를 즉시 게시하세요.</li>}
                                {q4 === 'no' && <li><span className="font-extrabold">가스측정 미흡:</span> 산소 및 유해가스를 작업 전은 물론 작업 중에도 지속적으로 측정하세요.</li>}
                                {q5 === 'no' && <li><span className="font-extrabold">환기팬/성능 미확인:</span> 보유 배풍기 성능을 파악하고, 작업 전/중 환기를 지속적으로 실시하세요.</li>}
                                {q6 === 'no' && <li><span className="font-extrabold">보호구 미비치:</span> 밀폐공간 작업용 송기마스크 등 호흡용보호구를 반드시 비치하세요.</li>}
                                {q7 === 'no' && <li><span className="font-extrabold">감시/비상체계 누락:</span> 전담 감시인을 배치하고 내외부 연락 및 비상 조치 체계를 마련하세요.</li>}
                                {q8 === 'no' && <li><span className="font-extrabold">인원점검 누락:</span> 출입 시 근로자 인원을 철저히 점검하여 인원 누락을 방지하세요.</li>}
                                {q9 === 'no' && <li><span className="font-extrabold">안전교육(TBM) 미실시:</span> 작업 전 작업자와 감시인에게 안전한 작업방법(TBM)을 교육하세요.</li>}
                                {q10 === 'no' && <li><span className="font-extrabold">장비/훈련 미흡:</span> 삼각대 등 구조장비를 설치하고 사전에 긴급구조훈련을 실시하세요.</li>}
                              </ul>
                            </div>
                          ) : (
                            <div className="bg-emerald-50 border border-emerald-100 rounded-2xl p-5 md:p-7 shadow-sm h-full flex flex-col items-center justify-center text-center">
                              <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4"><svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg></div>
                              <h4 className="text-emerald-800 font-extrabold text-lg mb-2">조치사항 완료</h4>
                              <p className="text-emerald-600/90 text-sm font-medium">안전 작업 기준을 모두 통과했습니다.<br/>안전하게 작업을 진행해 주세요.</p>
                            </div>
                          )}
                        </div>
                      );
                    })()}
                  </div>
                </div>
                
                <div className="px-6 pt-2 pb-6 flex flex-col gap-3 shrink-0 md:max-w-2xl md:mx-auto w-full">
                  <button onClick={downloadOneCallService} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-emerald-500/25 active:scale-[0.98] transition-all duration-300 text-sm md:text-base flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
