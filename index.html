<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>밀폐공간 환기계산 웹앱</title>
  
  <!-- PWA Manifest 연결 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#317EFB">
  
  <!-- iOS(사파리) PWA 지원 메타 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="밀폐공간환기">
  <link rel="apple-touch-icon" href="/icon-192x192.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD versions for browser) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for parsing JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 4px;
    }
    button {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-[#F4F7FB] antialiased">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [step, setStep] = useState(1);
      const [fanCapacity, setFanCapacity] = useState('');
      const [shape, setShape] = useState('');
      
      // PWA 설치 프롬프트 상태 관리
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [showInstallInstructions, setShowInstallInstructions] = useState(false);

      const [width, setWidth] = useState('');
      const [length, setLength] = useState('');
      const [diameter, setDiameter] = useState('');
      const [height, setHeight] = useState('');

      const [comboRectWidth, setComboRectWidth] = useState('');
      const [comboRectLength, setComboRectLength] = useState('');
      const [comboRectHeight, setComboRectHeight] = useState('');
      const [comboCylDiameter, setComboCylDiameter] = useState('');
      const [comboCylHeight, setComboCylHeight] = useState('');

      const [q1, setQ1] = useState(null);
      const [q2, setQ2] = useState(null);
      const [q3, setQ3] = useState(null);
      const [q4, setQ4] = useState(null);

      // 체적 계산 함수
      const getVolume = () => {
        if (shape === 'rect') {
          const w = parseFloat(width) || 0;
          const l = parseFloat(length) || 0;
          const h = parseFloat(height) || 0;
          return w * l * h;
        } else if (shape === 'cyl') {
          const d = parseFloat(diameter) || 0;
          const h = parseFloat(height) || 0;
          return (3.14 * Math.pow(d, 2) / 4) * h;
        } else if (shape === 'combo') {
          const rw = parseFloat(comboRectWidth) || 0;
          const rl = parseFloat(comboRectLength) || 0;
          const rh = parseFloat(comboRectHeight) || 0;
          const v1 = rw * rl * rh;
          
          const cd = parseFloat(comboCylDiameter) || 0;
          const ch = parseFloat(comboCylHeight) || 0;
          const v2 = (3.14 * Math.pow(cd, 2) / 4) * ch;
          
          return v1 + v2;
        }
        return 0;
      };

      const volume = getVolume();

      const fanHr = parseFloat(fanCapacity) || 0;
      const reqTotalFanCapacityHr = volume * 24; 
      
      const rawFanCount = fanHr > 0 ? reqTotalFanCapacityHr / (fanHr * 0.8) : 0;
      let displayFanCount = "0대";
      if (rawFanCount > 0) {
        if (rawFanCount <= 1) {
          displayFanCount = "1대 이하";
        } else {
          displayFanCount = rawFanCount.toFixed(1) + "대 이상";
        }
      }

      const actualFanCount = Math.ceil(rawFanCount > 0 ? rawFanCount : 0);
      const effectiveAirflowMin = (actualFanCount * fanHr * 0.8) / 60;
      const rawVentTime = effectiveAirflowMin > 0 ? (volume * 10) / effectiveAirflowMin : 0;
      const ventTime = Math.max(Math.ceil(rawVentTime), 30); 
      const isMinimumForced = Math.ceil(rawVentTime) < 30 && effectiveAirflowMin > 0;

      // PWA 설치 이벤트 캐치 및 배너 제어
      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
          const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
          const hasDismissed = localStorage.getItem('dismissedInstallPrompt');
          if (!isStandalone && !hasDismissed) {
            setShowInstallBanner(true);
          }
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

        // 서비스 워커 등록
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Service Worker 등록 완료'))
            .catch((err) => console.log('Service Worker 등록 실패:', err));
        }

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
        };
      }, []);

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            console.log('사용자가 앱 설치를 수락했습니다.');
          }
          setDeferredPrompt(null);
          setShowInstallBanner(false);
        } else {
          setShowInstallInstructions(true);
        }
      };

      const dismissInstall = () => {
        setShowInstallBanner(false);
        localStorage.setItem('dismissedInstallPrompt', 'true');
      };

      const nextStep = () => setStep((s) => s + 1);
      const prevStep = () => setStep((s) => s - 1);
      const reset = () => {
        setStep(1);
        setFanCapacity('');
        setShape('');
        setWidth('');
        setLength('');
        setHeight('');
        setDiameter('');
        setComboRectWidth('');
        setComboRectLength('');
        setComboRectHeight('');
        setComboCylDiameter('');
        setComboCylHeight('');
        setQ1(null);
        setQ2(null);
        setQ3(null);
        setQ4(null);
      };

      return (
        <div className="min-h-screen flex justify-center font-sans text-slate-800 selection:bg-blue-200 sm:p-4">
          <div className="w-full max-w-md bg-white sm:rounded-[2.5rem] sm:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)] min-h-screen sm:min-h-[850px] flex flex-col relative overflow-hidden sm:border border-slate-100/50">
            
            {step > 1 && step <= 7 && (
              <header className="px-6 py-5 flex items-center bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-100/80">
                <button 
                  onClick={prevStep} 
                  className="p-2 -ml-2 rounded-full hover:bg-slate-50 text-slate-600 transition-colors active:scale-95"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M15 19l-7-7 7-7" />
                  </svg>
                </button>
                <div className="w-full bg-slate-100 h-1.5 rounded-full ml-4 overflow-hidden">
                  <div 
                    className="bg-blue-600 h-full rounded-full transition-all duration-500 ease-out"
                    style={{ width: `${((step - 1) / 6) * 100}%` }}
                  ></div>
                </div>
                <span className="ml-4 text-xs font-bold text-slate-400 whitespace-nowrap">{step - 1} / 6</span>
              </header>
            )}

            {step === 1 && (
              <div className="flex flex-col items-center flex-1 px-6 pb-10 pt-8 animate-in fade-in duration-700 ease-out overflow-y-auto custom-scrollbar">
                <div className="text-center mb-6 w-full space-y-3">
                  <span className="inline-block py-1.5 px-4 rounded-full bg-blue-50 text-blue-600 text-[11px] font-bold tracking-wide mb-1">
                    안전보건공단 KOSHA GUIDE 기준
                  </span>
                  <h1 className="text-[2rem] font-extrabold text-slate-900 tracking-tight leading-tight">
                    밀폐공간 환기 <br/>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-cyan-500">
                      위험성평가
                    </span>
                  </h1>
                  <p className="text-slate-500 text-sm mt-3 font-medium px-4 leading-relaxed">
                    작업 전 필수적인 위험성평가와 적정 환기량을 빠르고 정확하게 산출합니다.
                  </p>
                </div>

                <div className="w-full mb-8 relative rounded-[1.5rem] overflow-hidden shadow-[0_10px_30px_-10px_rgba(37,99,235,0.15)] ring-1 ring-slate-100/50">
                  <img 
                    src="image_bf5585.jpg" 
                    alt="밀폐공간 환기 예시" 
                    className="w-full h-auto object-cover hover:scale-105 transition-transform duration-700"
                    onError={(e) => { e.target.src = 'https://placehold.co/600x400/e2e8f0/64748b?text=Image+Not+Found'; }}
                  />
                </div>

                <div className="w-full mt-auto mb-6">
                  <button 
                    onClick={nextStep} 
                    className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-xl hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-lg"
                  >
                    시작하기
                  </button>
                </div>

                <div className="w-full flex justify-center items-center opacity-90 hover:opacity-100 transition-opacity">
                  <img 
                    src="image_bfaefe.png" 
                    alt="고용노동부 창원고용노동지청 로고" 
                    className="h-10 object-contain drop-shadow-sm" 
                    onError={(e) => { e.target.src = 'https://placehold.co/300x80/ffffff/1e293b?text=Logos+Here'; }}
                  />
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">위험성평가 체크리스트</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    안전한 환기계산을 위해 아래 항목들을 꼼꼼히 확인해 주세요.
                  </p>
                </div>

                <div className="space-y-4 overflow-y-auto pb-4 custom-scrollbar">
                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">1.</span> 보유 배풍기 풍량(m³/hr)을 아시나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ1('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q1 === 'yes' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-transparent'}`}>예</button>
                      <button onClick={() => setQ1('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q1 === 'no' ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-600 border-transparent'}`}>아니오</button>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">2.</span> 보유 배풍기 정압(mmAq)을 아시나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ2('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q2 === 'yes' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-transparent'}`}>예</button>
                      <button onClick={() => setQ2('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q2 === 'no' ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-600 border-transparent'}`}>아니오</button>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">3.</span> 배풍기 덕트 길이는 15m 이하거나 제조사 권장 기준을 준수하셨나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ3('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q3 === 'yes' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-transparent'}`}>예</button>
                      <button onClick={() => setQ3('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q3 === 'no' ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-600 border-transparent'}`}>아니오</button>
                    </div>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <p className="font-bold text-slate-800 mb-4 text-sm leading-snug">
                      <span className="text-blue-600 mr-1">4.</span> 배풍기 덕트 끝부분이 밀폐공간 가장 하단에 위치하고 있나요?
                    </p>
                    <div className="flex gap-2">
                      <button onClick={() => setQ4('yes')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q4 === 'yes' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-transparent'}`}>예</button>
                      <button onClick={() => setQ4('no')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all border ${q4 === 'no' ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-600 border-transparent'}`}>아니오</button>
                    </div>
                  </div>
                </div>

                <div className="mt-auto pt-6 pb-2 bg-white">
                  <button 
                    onClick={nextStep} 
                    disabled={!q1 || !q2 || !q3 || !q4} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg transition-all duration-300 text-lg"
                  >
                    평가 결과 확인
                  </button>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="p-6 flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">평가 리포트</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    안전한 작업을 위해 아래 조치사항을 반드시 준수해 주세요.
                  </p>
                </div>

                <div className="space-y-3 mb-6">
                  {[
                    { q: q1, title: '배풍기 풍량', pass: '풍량을 인지하고 있어 정확한 환기량 산출이 가능합니다.', fail: '장비 제원표를 반드시 확인하여 풍량을 파악하세요.' },
                    { q: q2, title: '배풍기 정압', pass: '정압을 인지하고 있어 압력 손실 예측이 가능합니다.', fail: '제원표를 확인하여 압력 손실에 대비하세요.' },
                    { q: q3, title: '덕트 길이', pass: '기준을 준수하여 환기 효율 저하를 예방합니다.', fail: '길이를 줄이거나 고정압 배풍기를 사용하세요.' },
                    { q: q4, title: '덕트 하단 위치', pass: '효과적인 환기(급기)가 이루어질 수 있는 적절한 위치입니다.', fail: '사각지대 방지를 위해 덕트를 밀폐공간 하단으로 재조정하세요.' }
                  ].map((item, idx) => (
                    <div key={idx} className="p-4 rounded-2xl flex items-start gap-3 bg-white border border-slate-100 shadow-sm">
                      <div className={`mt-0.5 rounded-full p-1 ${item.q === 'yes' ? 'bg-blue-50 text-blue-600' : 'bg-rose-50 text-rose-500'}`}>
                        {item.q === 'yes' ? (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                        ) : (
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        )}
                      </div>
                      <div>
                        <p className="font-bold text-slate-800 text-sm mb-0.5">{idx + 1}. {item.title}</p>
                        <p className={`text-xs font-medium ${item.q === 'yes' ? 'text-slate-500' : 'text-rose-600'}`}>
                          {item.q === 'yes' ? item.pass : item.fail}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-gradient-to-br from-rose-50 to-orange-50 border border-rose-100 p-5 rounded-2xl shadow-sm mb-6">
                  <div className="flex items-center gap-2 mb-3">
                    <div className="bg-rose-100 p-1.5 rounded-lg text-rose-600">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </div>
                    <h3 className="font-extrabold text-rose-800 text-sm tracking-tight">감소대책 조치사항</h3>
                  </div>
                  <p className="text-xs text-rose-700/90 leading-relaxed font-semibold">
                    보유 배풍기 풍량이 <span className="bg-rose-200/50 px-1 rounded">5,000 m³/hr 이하</span>일 경우 정압은 <span className="bg-rose-200/50 px-1 rounded">40mmAq 미만</span>이 될 수 있으므로, 적절하지 않을 경우 반드시 <strong>장비 교체</strong>를 권장합니다.
                  </p>
                </div>

                <div className="mt-auto pt-2 pb-4">
                  <button 
                    onClick={nextStep} 
                    className="w-full bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all duration-300 text-lg"
                  >
                    환기계산 진행하기
                  </button>
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-8">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">배풍기 풍량 입력</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    현재 보유중인 배풍기(송풍기/포터블팬)의 성능을 입력해주세요.
                  </p>
                </div>

                <div className="space-y-4">
                  <label className="block text-sm font-bold text-slate-700 ml-1">보유 풍량 <span className="text-blue-500">*</span></label>
                  <div className="relative group">
                    <input 
                      type="number" 
                      value={fanCapacity} 
                      onChange={e => setFanCapacity(e.target.value)} 
                      placeholder="0" 
                      min="0"
                      className="w-full text-3xl p-5 border border-slate-200 rounded-2xl focus:border-blue-500 focus:outline-none transition-all font-black text-slate-800 bg-slate-50 shadow-inner" 
                    />
                    <span className="absolute right-6 top-1/2 -translate-y-1/2 text-slate-400 font-bold">m³/hr</span>
                  </div>
                </div>

                <div className="mt-auto pt-8 pb-4">
                  <button 
                    onClick={nextStep} 
                    disabled={!fanCapacity || parseFloat(fanCapacity) <= 0} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg transition-all duration-300 text-lg"
                  >
                    다음으로
                  </button>
                </div>
              </div>
            )}

            {step === 5 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out">
                <div className="mb-8">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-2 tracking-tight">공간 형태 선택</h2>
                  <p className="text-slate-500 text-sm font-medium leading-relaxed">
                    작업하실 밀폐공간의 형태를 선택해주세요.
                  </p>
                </div>

                <div className="space-y-4 mt-2">
                  <button onClick={() => { setShape('rect'); nextStep(); }} className="w-full bg-white border border-slate-200 p-6 rounded-[1.5rem] flex items-center shadow-sm">
                    <div className="text-left">
                      <h3 className="text-lg font-bold text-slate-800">직사각형</h3>
                      <p className="text-xs text-slate-400 mt-1 font-medium">가로, 세로, 높이 기반</p>
                    </div>
                  </button>
                  <button onClick={() => { setShape('cyl'); nextStep(); }} className="w-full bg-white border border-slate-200 p-6 rounded-[1.5rem] flex items-center shadow-sm">
                    <div className="text-left">
                      <h3 className="text-lg font-bold text-slate-800">원통형(원형)</h3>
                      <p className="text-xs text-slate-400 mt-1 font-medium">지름, 높이 기반</p>
                    </div>
                  </button>
                  <button onClick={() => { setShape('combo'); nextStep(); }} className="w-full bg-white border border-slate-200 p-6 rounded-[1.5rem] flex items-center shadow-sm">
                    <div className="text-left">
                      <h3 className="text-lg font-bold text-slate-800">결합형</h3>
                      <p className="text-xs text-slate-400 mt-1 font-medium">직사각형 + 원통형</p>
                    </div>
                  </button>
                </div>
              </div>
            )}

            {step === 6 && (
              <div className="p-6 flex-1 flex flex-col animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="mb-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 mb-3 tracking-tight">제원 입력</h2>
                </div>

                <div className="space-y-3 pb-4">
                  {shape === 'rect' ? (
                    <>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">가로</span>
                        <input type="number" value={width} onChange={e => setWidth(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">세로</span>
                        <input type="number" value={length} onChange={e => setLength(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">높이</span>
                        <input type="number" value={height} onChange={e => setHeight(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                    </>
                  ) : shape === 'cyl' ? (
                    <>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">지름</span>
                        <input type="number" value={diameter} onChange={e => setDiameter(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">높이</span>
                        <input type="number" value={height} onChange={e => setHeight(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                    </>
                  ) : (
                    <div className="space-y-4">
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">직사 가로</span>
                        <input type="number" value={comboRectWidth} onChange={e => setComboRectWidth(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">직사 세로</span>
                        <input type="number" value={comboRectLength} onChange={e => setComboRectLength(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">직사 높이</span>
                        <input type="number" value={comboRectHeight} onChange={e => setComboRectHeight(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">원형 지름</span>
                        <input type="number" value={comboCylDiameter} onChange={e => setComboCylDiameter(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                      <div className="flex items-center bg-white p-3 rounded-2xl border border-slate-200">
                        <span className="w-16 pl-2 font-bold text-slate-500 text-sm">원형 높이</span>
                        <input type="number" value={comboCylHeight} onChange={e => setComboCylHeight(e.target.value)} placeholder="0.0" className="flex-1 text-right text-xl p-2 outline-none font-black bg-transparent" />
                        <span className="w-10 text-center font-bold text-slate-300">m</span>
                      </div>
                    </div>
                  )}
                </div>

                <div className="mt-8 bg-slate-50 rounded-2xl p-5 border border-slate-100 flex justify-between items-center shadow-inner">
                  <span className="text-slate-500 font-bold text-sm">총 체적(m³)</span>
                  <span className="text-3xl font-black text-blue-600">{volume > 0 ? volume.toFixed(2) : '0.00'}</span>
                </div>

                <div className="mt-6 pt-2 pb-4">
                  <button 
                    onClick={nextStep} 
                    disabled={volume <= 0} 
                    className="w-full bg-blue-600 disabled:bg-slate-100 disabled:text-slate-400 text-white font-bold py-4 rounded-2xl shadow-lg transition-all duration-300 text-lg"
                  >
                    환기계산 결과 보기
                  </button>
                </div>
              </div>
            )}

            {step === 7 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in zoom-in-95 duration-500 ease-out overflow-y-auto custom-scrollbar">
                <div className="bg-white px-6 py-10 border-b border-slate-100 shadow-sm text-center">
                  <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">환기계산 완료</h2>
                  <p className="text-slate-500 mt-2 text-sm font-medium">안전한 밀폐공간 작업을 위한 기준입니다.</p>
                </div>

                <div className="p-6 space-y-5">
                  <div className="space-y-4">
                    <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 shadow-lg text-white">
                      <h3 className="text-blue-50 font-bold text-sm mb-1">1. (작업 전) 환기시간</h3>
                      <div className="flex items-baseline gap-1.5 mt-2">
                        <span className="text-5xl font-black tracking-tighter">{ventTime}</span>
                        <span className="text-lg font-bold text-blue-100">min (분)</span>
                      </div>
                    </div>

                    <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 shadow-lg text-white">
                      <h3 className="text-blue-50 font-bold text-sm mb-1">2. (작업 중) 적정 배풍기 수량</h3>
                      <div className="flex items-baseline gap-2 mt-1">
                        <span className="text-5xl font-black tracking-tighter">{displayFanCount}</span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-4 pb-6 space-y-3">
                    <button 
                      onClick={reset} 
                      className="w-full bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold py-4 rounded-2xl transition-all duration-300 text-sm"
                    >
                      새로운 계산하기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 앱 설치 배너 */}
            {showInstallBanner && !showInstallInstructions && (
              <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-white rounded-3xl p-5 shadow-2xl border border-slate-100 z-50">
                <div className="flex items-start gap-4">
                  <div className="bg-blue-50 p-3 rounded-2xl text-blue-600 shrink-0">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                  </div>
                  <div className="flex-1">
                    <h4 className="font-extrabold text-slate-900 text-sm mb-1">앱 설치하기</h4>
                    <p className="text-xs text-slate-500 font-medium">홈 화면에 추가하여 언제든 빠르고 편리하게 사용하세요!</p>
                  </div>
                </div>
                <div className="flex gap-2 mt-4">
                  <button onClick={dismissInstall} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">나중에</button>
                  <button onClick={handleInstallClick} className="flex-1 py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-md">앱 설치</button>
                </div>
              </div>
            )}

            {/* 설치 방법 안내 모달 */}
            {showInstallInstructions && (
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-[2.5rem] p-6 w-full max-w-sm shadow-2xl relative">
                  <button onClick={() => setShowInstallInstructions(false)} className="absolute top-4 right-4 p-2 text-slate-400">✕</button>
                  <h3 className="text-xl font-extrabold text-slate-900 mb-2 text-center">홈 화면에 추가하는 방법</h3>
                  <div className="space-y-4 mt-4">
                    <div className="bg-slate-50 p-4 rounded-2xl">
                      <h4 className="font-bold text-slate-800 text-sm mb-1">iPhone (Safari)</h4>
                      <p className="text-xs text-slate-600">하단 <b>공유</b> 버튼 ➔ <b>'홈 화면에 추가'</b> 선택</p>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-2xl">
                      <h4 className="font-bold text-slate-800 text-sm mb-1">Android (Chrome)</h4>
                      <p className="text-xs text-slate-600">우측 상단 <b>⋮</b> 메뉴 ➔ <b>'홈 화면에 추가'</b> 또는 <b>'앱 설치'</b> 선택</p>
                    </div>
                  </div>
                  <button onClick={() => setShowInstallInstructions(false)} className="w-full mt-6 bg-slate-900 text-white font-bold py-4 rounded-xl text-sm">확인했습니다</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
