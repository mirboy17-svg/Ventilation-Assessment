                  </button>
                  <div className="flex flex-col space-y-3 md:flex-row md:space-y-0 md:gap-4 w-full">
                    <button onClick={saveAsImage} className="w-full md:w-1/2 bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm md:text-base flex items-center justify-center gap-2"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>종합결과 저장 후 공유</button>
                    <button onClick={nextStep} className="w-full md:w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-blue-500/25 active:scale-[0.98] transition-all duration-300 text-sm md:text-base">작업허가서 작성 및 발급</button>
                  </div>
                </div>
              </div>
            )}

            {/* Step 10: 작업허가서 발급 */}
            {step === 10 && (
              <div className="flex-1 flex flex-col bg-[#F8FAFC] animate-in slide-in-from-right-4 duration-500 ease-out overflow-y-auto custom-scrollbar relative">
                <div className="bg-white px-6 py-6 md:py-8 border-b border-slate-100 shadow-sm shrink-0 relative flex items-center justify-center">
                  <div className="text-center w-full px-8 md:px-12">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">맨홀공간 작업(계획)허가서</h2>
                    <p className="text-slate-500 text-[13px] md:text-sm mt-2 font-medium">최종 작업자 명단과 허가자 서명을 완료 후 발급하세요.</p>
                  </div>
                </div>
                
                <div className="p-6 md:p-10 space-y-6 flex-1 md:max-w-4xl md:mx-auto md:w-full">
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                     <h3 className="text-base font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">기본 정보</h3>
                     <div className="space-y-3 text-sm md:text-base">
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">신청인(발신자)</span><span className="font-medium text-slate-900">{formData.sender || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">작업수행시간</span><span className="font-medium text-slate-900">{formData.workDate || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">작업장소(위치)</span><span className="font-medium text-slate-900">{formData.location || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">작업내용</span><span className="font-medium text-slate-900">{formData.workContent || '-'}</span></div>
                        <div className="flex"><span className="w-28 md:w-36 text-slate-500 font-bold shrink-0">내부 연락방법</span><span className="font-medium text-slate-900">{formData.representative} / {formData.contact}</span></div>
                     </div>
                     <div className="mt-4 bg-amber-50 p-3 rounded-lg border border-amber-100">
                        <p className="text-xs md:text-sm text-amber-800 font-bold leading-relaxed">⚠️ 작업허가는 최대 8시간까지만 유효합니다. 이 허가서는 지정된 장소와 시간에 대해 1회만 유효합니다.</p>
                     </div>
                  </div>

                  {/* 5. 작업자(측정자) 명단 */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                     <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-2">
                       <h3 className="text-base font-bold text-slate-800">5. 작업자(측정자) 명단</h3>
                       <button onClick={handleAddWorker} className="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition-colors">+ 인원 추가</button>
                     </div>
                     {workers.some(w => w.type === '측정자') && (
                       <div className="mb-3 text-sm text-blue-600 font-bold bg-blue-50 p-2 rounded">
                         ※ 산소 및 유해가스농도측정자명을 정확히 적어주세요.
                       </div>
                     )}
                     <div className="space-y-3">
                        {workers.map((worker, idx) => (
                           <div key={idx} className="flex flex-col gap-3 bg-slate-50 p-3 md:p-4 rounded-xl border border-slate-100">
                              <div className="flex gap-2 items-center w-full">
                                <select value={worker.type} disabled={worker.confirmed} onChange={(e) => handleWorkerChange(idx, 'type', e.target.value)} className="w-[85px] md:w-[110px] p-2.5 rounded-lg border border-slate-200 bg-white font-bold text-slate-700 text-[13px] md:text-sm outline-none focus:border-blue-500 shrink-0 disabled:bg-slate-100 disabled:text-slate-400">
                                  <option value="작업자">작업자</option>
                                  <option value="감시인">감시인</option>
                                  <option value="측정자">측정자</option>
                                </select>
                                <input type="text" value={worker.name} readOnly={worker.confirmed} onChange={(e) => handleWorkerChange(idx, 'name', e.target.value)} placeholder="성명 입력" className="min-w-0 flex-1 w-full p-2.5 rounded-lg border border-slate-200 bg-white text-[13px] md:text-sm outline-none focus:border-blue-500 disabled:bg-slate-100 disabled:text-slate-400 read-only:bg-slate-100 read-only:text-slate-500" />
                                {workers.length > 1 && !worker.confirmed && (
                                  <button onClick={() => handleRemoveWorker(idx)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg shrink-0 transition-colors">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                  </button>
                                )}
                              </div>
                              <div className="flex justify-end w-full">
                                {worker.confirmed ? (
                                  <div className="flex gap-2 w-full md:w-auto">
                                    <button onClick={() => handleWorkerChange(idx, 'confirmed', false)} className="py-2 px-4 rounded-lg font-bold text-[13px] bg-slate-200 text-slate-600 hover:bg-slate-300 transition-colors shrink-0">수정</button>
                                    <div className="flex-1 md:flex-none py-2 px-4 rounded-lg font-bold text-[13px] bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center gap-1.5"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg> 서명완료</div>
                                  </div>
                                ) : (
                                  <button onClick={() => { if(!worker.name.trim()){ alert('성명을 먼저 입력해주세요.'); return; } handleWorkerChange(idx, 'confirmed', true); }} className="w-full md:w-auto text-[13px] bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-5 rounded-lg transition-colors flex items-center gap-1.5 justify-center">서명확인</button>
                                )}
                              </div>
                           </div>
                        ))}
                     </div>
                  </div>

                  {/* 6. 최종 허가자 승인 (서명확인 방식 적용) */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
                     <h3 className="text-base font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">6. 최종 허가자 승인</h3>
                     <div className="grid grid-cols-2 gap-3 mb-4 md:grid-cols-4">
                        <input type="text" placeholder="부서" value={approver.dept} readOnly={approver.signed} onChange={e => setApprover({...approver, dept: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-500" />
                        <input type="text" placeholder="직책" value={approver.title} readOnly={approver.signed} onChange={e => setApprover({...approver, title: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-500" />
                        <input type="text" placeholder="성명" value={approver.name} readOnly={approver.signed} onChange={e => setApprover({...approver, name: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-500" />
                        <input type="tel" placeholder="전화번호" value={approver.phone} readOnly={approver.signed} onChange={e => setApprover({...approver, phone: e.target.value})} className="p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm md:text-base outline-none focus:border-blue-500 focus:bg-white disabled:bg-slate-100 disabled:text-slate-500" />
                     </div>
                     
                     <div className="flex flex-col md:flex-row gap-3 items-stretch">
                        <button onClick={handleSendPermitSMS} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md transition-all text-sm md:text-base flex items-center justify-center gap-2">
                          <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                          승인 요청 알림문자 발송
                        </button>
                        
                        <div className="flex-1 flex items-center">
                          {approver.signed ? (
                            <div className="flex gap-2 w-full">
                              <button onClick={() => setApprover(prev => ({ ...prev, signed: false }))} className="py-3 px-4 rounded-xl font-bold text-sm bg-slate-200 text-slate-600 hover:bg-slate-300 transition-colors shrink-0">수정</button>
                              <div className="flex-1 py-3 px-4 rounded-xl font-bold text-sm bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center gap-2">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg> 서명완료
                              </div>
                            </div>
                          ) : (
                            <button onClick={() => { if(!approver.name.trim()){ alert('최종 허가자 성명을 먼저 입력해주세요.'); return; } setApprover(prev => ({ ...prev, signed: true })); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md transition-all text-sm md:text-base flex items-center justify-center gap-2">
                              서명확인
                            </button>
                          )}
                        </div>
                     </div>
                  </div>
                </div>
                
                <div className="px-6 pt-2 pb-6 shrink-0 md:max-w-2xl md:mx-auto w-full space-y-3">
                  <button onClick={savePermitAsPDF} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-[0.98] transition-all duration-300 text-lg flex items-center justify-center gap-2">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    최종 작업허가서 PDF 다운로드
                  </button>
                  <button onClick={handleGoHome} className="w-full bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800 font-bold py-4 rounded-2xl active:scale-[0.98] transition-all duration-300 text-base">처음으로 돌아가기</button>
                </div>

                {/* 10단계 작업허가서 전용 PDF 템플릿 (성명만 파란색으로 출력) */}
                {(() => {
                  const measurerName = workers.find(w => w.type === '측정자' && w.name.trim() !== '')?.name || formData.inspector || formData.sender || '-';
                  
                  let shapeName = '';
                  let shapeDetails = '';
                  if(shape === 'rect'){
                    shapeName = '직사각형'; shapeDetails = `(가로: ${width||0}m, 세로: ${length||0}m, 높이: ${height||0}m)`;
                  } else if(shape === 'cyl') {
                    shapeName = '원통형'; shapeDetails = `(지름: ${diameter||0}m, 높이: ${height||0}m)`;
                  } else if(shape === 'combo') {
                    shapeName = '결합형'; shapeDetails = `(사각: 가로 ${comboRectWidth||0}m, 세로 ${comboRectLength||0}m, 높이 ${comboRectHeight||0}m / 원형: 지름 ${comboCylDiameter||0}m, 높이 ${comboCylHeight||0}m)`;
                  }

                  return (
                  <div style={{ display: 'none', position: 'absolute', left: '-9999px', top: '0', width: '800px', backgroundColor: 'white', padding: '10px 20px', boxSizing: 'border-box' }} ref={permitPdfTemplateRef}>
                    <h1 style={{ fontSize: '28px', fontWeight: '900', textAlign: 'center', marginBottom: '20px', color: '#000', letterSpacing: '-1px' }}>맨홀공간 작업(계획)허가서</h1>
                    
                    <div style={{ display: 'flex', flexWrap: 'wrap', marginBottom: '15px', fontSize: '14px', color: '#000', lineHeight: '1.6' }}>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 신청인:</strong> {formData.sender}</div>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 작업수행시간:</strong> {formData.workDate}</div>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 작업장소(위치):</strong> {formData.location}</div>
                      <div style={{ width: '50%', marginBottom: '4px' }}><strong>ㅇ 작업내용:</strong> {formData.workContent}</div>
                      <div style={{ width: '100%', marginBottom: '4px' }}><strong>ㅇ 내부 연락방법:</strong> {formData.representative} / {formData.contact}</div>
                    </div>

                    <div style={{ padding: '8px', backgroundColor: '#fffbeb', border: '1px solid #fcd34d', marginBottom: '15px', fontSize: '13px', color: '#92400e', fontWeight: 'bold' }}>
                      작업허가는 최대 8시간까지만 유효합니다. 유해가스의 농도에 따라서 출입시간에 제한이 있을 수도 있습니다. 이 허가서는 지정된 장소와 시간에 대해 1회만 유효합니다.<br/>
                      <span style={{color: '#000'}}>위 공간에서의 작업을 다음의 조건하에서만 허가함.</span>
                    </div>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>1. 맨홀공간 정보요약</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', marginBottom: '15px', fontSize: '13px', textAlign: 'center' }}>
                      <tbody>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>맨홀 형태</th>
                          <td style={{ border: '1px solid black', padding: '6px', width: '30%' }}>{shapeName}</td>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>맨홀 체적</th>
                          <td style={{ border: '1px solid black', padding: '6px', width: '30%' }}>
                            {volume.toFixed(2)} m³<br/><span style={{fontSize:'11px', color:'#555'}}>{shapeDetails}</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>2. 맨홀 안전작업 체크리스트</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', marginBottom: '15px', fontSize: '12px', textAlign: 'center' }}>
                      <thead>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '4px' }}>체크리스트(자율점검)</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '4px', width: '12%' }}>예</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '4px', width: '12%' }}>아니오</th>
                        </tr>
                      </thead>
                      <tbody>
                        {[
                          { q: q1, title: '1. 해당 밀폐공간 위치파악, 유해위험요인 파악', fix: '작업 전 해당 장소의 위치와 위험요인을 명확히 파악하세요.' },
                          { q: q2, title: '2. 작업허가서 발급 및 작업장 게시', fix: '작업 전 반드시 허가서를 발급받고 작업장에 게시하세요.' },
                          { q: q3, title: '3. 출입금지 표지 게시', fix: '인근 잘 보이는 곳에 출입금지 표지를 즉시 게시하세요.' },
                          { q: q4, title: '4. 산소 및 유해가스 작업전·중 측정', fix: '산소 및 유해가스를 작업 전은 물론 작업 중에도 지속적으로 측정하세요.' },
                          { q: q5, title: '5. 환기팬 가동 및 성능 확인', fix: '보유 배풍기 성능을 파악하고, 작업 전/중 환기를 지속적으로 실시하세요.' },
                          { q: q6, title: '6. 호흡용보호구 비치', fix: '밀폐공간 작업용 송기마스크 등 호흡용보호구를 반드시 비치하세요.' },
                          { q: q7, title: '7. 감시인 배치 및 비상체계 마련', fix: '전담 감시인을 배치하고 내외부 연락 및 비상 조치 체계를 마련하세요.' },
                          { q: q8, title: '8. 입·퇴장 인원 점검', fix: '출입 시 근로자 인원을 철저히 점검하여 인원 누락을 방지하세요.' },
                          { q: q9, title: '9. 안전방법(TBM) 교육', fix: '작업 전 작업자와 감시인에게 안전한 작업방법(TBM)을 교육하세요.' },
                          { q: q10, title: '10. 구조장비 설치/구조훈련', fix: '삼각대 등 구조장비를 설치하고 사전에 긴급구조훈련을 실시하세요.' }
                        ].map((item, i) => (
                          <React.Fragment key={i}>
                            <tr>
                              <td style={{ border: '1px solid black', padding: '3px 8px', textAlign: 'left' }}>{item.title}</td>
                              <td style={{ border: '1px solid black', padding: '3px', color: '#2563EB', fontWeight: item.q==='yes'?'bold':'normal' }}>{item.q === 'yes' ? 'O' : ''}</td>
                              <td style={{ border: '1px solid black', padding: '3px', color: '#DC2626', fontWeight: item.q==='no'?'bold':'normal' }}>{item.q === 'no' ? 'O' : ''}</td>
                            </tr>
                            {item.q === 'no' && (
                              <tr>
                                <td colSpan="3" style={{ border: '1px solid black', padding: '3px 8px', textAlign: 'left', color: '#DC2626', fontSize: '11px', backgroundColor: '#fef2f2' }}>
                                  <strong>[조치사항]</strong> {item.fix}
                                </td>
                              </tr>
                            )}
                          </React.Fragment>
                        ))}
                      </tbody>
                    </table>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>3. 산소 및 유해가스 농도 측정 결과 <span style={{fontSize:'12px', fontWeight:'normal'}}>[측정시기: 작업 시작 전, 장시간 작업 시 등]</span></h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', marginBottom: '15px', fontSize: '13px', textAlign: 'center' }}>
                      <thead>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>측정물질명</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>측정농도</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '20%' }}>측정자 (검교정일)</th>
                          <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '35%' }}>허가기준 농도</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>산소 (O₂)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{o2} %</td>
                          <td rowSpan="4" style={{ border: '1px solid black', padding: '4px', verticalAlign: 'middle' }}>{measurerName}<br/><span style={{fontSize:'11px'}}>({calDate})</span></td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>18% 이상 23.5% 미만</td>
                        </tr>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>황화수소 (H₂S)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{h2s} ppm</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>10ppm 이하</td>
                        </tr>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>이산화탄소 (CO₂)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{co2} ppm</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>1.5% 미만 (15,000ppm)</td>
                        </tr>
                        <tr>
                          <th style={{ border: '1px solid black', backgroundColor: '#f9fafb', padding: '4px' }}>일산화탄소 (CO)</th>
                          <td style={{ border: '1px solid black', padding: '4px' }}>{co} ppm</td>
                          <td style={{ border: '1px solid black', padding: '4px', textAlign: 'left', paddingLeft: '8px' }}>30ppm 미만</td>
                        </tr>
                      </tbody>
                    </table>

                    <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>4. 특별조치필요사항</h3>
                    <div style={{ border: '1.5px solid black', padding: '10px', minHeight: '40px', marginBottom: '15px', fontSize: '13px', whiteSpace: 'pre-wrap', textAlign: 'left' }}>
                      {formData.remarks || '특이사항 없음'}
                    </div>

                    <div style={{ display: 'flex', gap: '20px' }}>
                      {/* 5. 작업자 명단 (성명만 파란색 출력) */}
                      <div style={{ flex: '1' }}>
                        <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>5. 작업자 명단</h3>
                        <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', fontSize: '13px', textAlign: 'center' }}>
                          <thead>
                            <tr>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '30%' }}>구분</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '40%' }}>성명</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '30%' }}>서명</th>
                            </tr>
                          </thead>
                          <tbody>
                            {workers.map((w, i) => (
                              <tr key={i}>
                                <td style={{ border: '1px solid black', padding: '6px' }}>{w.type}</td>
                                <td style={{ border: '1px solid black', padding: '6px' }}>{w.name}</td>
                                <td style={{ border: '1px solid black', padding: '6px' }}>
                                   {w.confirmed && w.name ? (
                                      <div style={{ color: '#2563EB', fontWeight: 'bold', fontSize: '13px' }}>{w.name}</div>
                                   ) : (
                                      <div style={{ color: '#94a3b8', fontSize: '12px' }}>{w.name ? '(미확인)' : '(서명)'}</div>
                                   )}
                                </td>
                              </tr>
                            ))}
                            {workers.length < 3 && Array(3 - workers.length).fill().map((_, i) => (
                              <tr key={'empty'+i}>
                                <td style={{ border: '1px solid black', padding: '13px' }}></td><td style={{ border: '1px solid black' }}></td><td style={{ border: '1px solid black' }}></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                      
                      {/* 6. 최종 허가자 승인 (성명만 파란색 출력) */}
                      <div style={{ flex: '1' }}>
                        <h3 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '6px', color: '#000' }}>6. 최종 허가자</h3>
                        <table style={{ width: '100%', borderCollapse: 'collapse', border: '1.5px solid black', fontSize: '13px', textAlign: 'center' }}>
                          <thead>
                            <tr>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>부서</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>직책</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>성명</th>
                              <th style={{ border: '1px solid black', backgroundColor: '#f3f4f6', padding: '6px', width: '25%' }}>서명</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>{approver.dept}</td>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>{approver.title}</td>
                              <td style={{ border: '1px solid black', padding: '13px 4px' }}>{approver.name}</td>
                              <td style={{ border: '1px solid black', padding: '2px 4px' }}>
                                 <div style={{ color: '#2563EB', fontWeight: 'bold', fontSize: '13px', padding: '11px 0' }}>
                                   {approver.signed ? (approver.name || '책임자') : '(서명)'}
                                 </div>
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                  );
                })()}
              </div>
            )}

            {/* PWA 설치 배너 */}
            {showInstallBanner && !showInstallInstructions && (
              <div className="absolute bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm md:max-w-md bg-white rounded-3xl p-5 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.3)] border border-slate-100 z-50 animate-in slide-in-from-bottom-10 fade-in duration-500">
                <div className="flex items-start gap-4">
                  <div className="bg-blue-50 p-3 rounded-2xl text-blue-600 shrink-0 shadow-inner"><svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></div>
                  <div className="flex-1"><h4 className="font-extrabold text-slate-900 text-sm md:text-base mb-1">앱 다운로드 및 설치</h4><p className="text-xs md:text-sm text-slate-500 font-medium leading-relaxed">바탕화면에 아이콘을 추가하여 언제든 빠르게 실행하세요!</p></div>
                </div>
                <div className="flex gap-2 mt-4 md:mt-5">
                  <button onClick={dismissInstall} className="flex-1 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors active:scale-95">나중에</button>
                  <button onClick={handleInstallClick} className="flex-1 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-bold bg-blue-600 text-white shadow-md shadow-blue-500/20 hover:bg-blue-700 transition-colors active:scale-95">앱 설치하기</button>
                </div>
              </div>
            )}

            {/* PWA iOS 설치 안내 가이드 */}
            {showInstallInstructions && (
              <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-300">
                <div className="bg-white rounded-[2.5rem] p-6 md:p-8 w-full max-w-sm md:max-w-md shadow-2xl relative animate-in zoom-in-95 duration-300">
                  <button onClick={() => setShowInstallInstructions(false)} className="absolute top-4 right-4 p-2 text-slate-400 hover:bg-slate-50 rounded-full transition-colors"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                  <div className="text-center mb-6 mt-2">
                    <div className="w-16 h-16 md:w-20 md:h-20 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 md:mb-5 shadow-inner"><svg className="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div>
                    <h3 className="text-xl md:text-2xl font-extrabold text-slate-900">홈 화면에 추가하는 방법</h3><p className="text-sm md:text-base text-slate-500 mt-2 font-medium">기기에 따라 아래 방법을 따라해주세요.</p>
                  </div>
                  <div className="space-y-4 md:space-y-5">
                    <div className="bg-slate-50 p-4 md:p-5 rounded-2xl border border-slate-100 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm md:text-base mb-2 flex items-center gap-2"><svg className="w-4 h-4 md:w-5 md:h-5 text-slate-400" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91 1.62.15 3.09.84 4.01 2.15-3.16 1.9-2.61 6.54.49 7.76-.75 1.83-1.68 3.5-2.71 4.75zM15.42 6.51c.71-.85 1.19-2.04 1.06-3.21-1.02.04-2.27.68-3 1.54-.65.77-1.23 2.01-1.07 3.15 1.13.09 2.3-.59 3.01-1.48z"/></svg>iPhone (Safari)</h4>
                      <ol className="text-[13px] md:text-sm text-slate-600 space-y-2 pl-5 list-decimal font-medium"><li>화면 하단의 <b>공유</b> 버튼을 누릅니다.</li><li>메뉴를 올려서 <b>'홈 화면에 추가'</b>를 선택합니다.</li><li>우측 상단의 <b>'추가'</b>를 누릅니다.</li></ol>
                    </div>
                    <div className="bg-slate-50 p-4 md:p-5 rounded-2xl border border-slate-100 shadow-sm">
                      <h4 className="font-bold text-slate-800 text-sm md:text-base mb-2 flex items-center gap-2"><svg className="w-4 h-4 md:w-5 md:h-5 text-green-500" viewBox="0 0 24 24" fill="currentColor"><path d="M17.523 15.3414c-.5511 0-1.002-.451-1.002-1.0021 0-.5512.451-1.0022 1.002-1.0022.5512 0 1.0022.451 1.0022 1.0022 0 .5511-.451 1.0021-1.0022 1.0021m-11.046 0c-.5511 0-1.002-.451-1.002-1.0021 0-.5512.451-1.0022 1.002-1.0022.5511 0 1.0021.451 1.0021 1.0022 0 .5511-.451 1.0021-1.0021 1.0021m11.4045-6.023l1.844-3.1932c.1052-.1821.043-.4141-.1391-.5191-.1822-.1052-.4141-.0431-.5192.139l-1.8562 3.2152C15.7061 8.2435 13.9312 7.7634 12 7.7634c-1.9311 0-3.7062.4801-5.2112 1.1983L4.9328 5.7461c-.1052-.1821-.3371-.2442-.5191-.139-.1822.1051-.2443.3371-.1392.5191l1.8441 3.1932C2.6517 11.2386.3262 14.8845.021 19.3402h23.958c-.3052-4.4557-2.6307-8.1016-6.0975-10.0218"/></svg>Android (Chrome/Samsung)</h4>
                      <ol className="text-[13px] md:text-sm text-slate-600 space-y-2 pl-5 list-decimal font-medium"><li>우측 하단/상단의 <b>메뉴(⋮ 또는 ≡)</b>를 누릅니다.</li><li><b>'홈 화면에 추가'</b> 또는 <b>'앱 설치'</b>를 선택합니다.</li><li>화면의 안내에 따라 <b>'설치'</b>를 누릅니다.</li></ol>
                    </div>
                  </div>
                  <button onClick={() => setShowInstallInstructions(false)} className="w-full mt-6 bg-slate-900 hover:bg-blue-600 text-white font-bold py-4 md:py-5 rounded-xl shadow-lg active:scale-[0.98] transition-all duration-300 text-sm md:text-base">확인했습니다</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
